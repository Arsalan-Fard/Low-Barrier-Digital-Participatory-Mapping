<!doctype html>
<!--
  IMOBYL — the digitiser, served at /digitize-map.

  This began as a fork of the original Digitize Map page (paper-test.html)
  for a temporary exhibition, so the expo could be reshaped without touching
  the daily tool. The fork has since replaced its parent: paper-test.html is
  gone and this is the one digitise page, reached from the launcher's
  "Digitize Paper Map" and from the old /imobyl address.

  Added on top of the original: saving and loading a session as JSON on the
  server.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IMOBYL</title>
  <link href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js" crossorigin="anonymous"></script>
  <script src="src/maplibreCompat.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/glowbox/maptastic@master/build/maptastic.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* The browser's own [hidden] rule is only a user-agent default, so ANY
       display declaration in this sheet (e.g. .level{display:flex}) silently
       beats it and the element stays on screen. Assert it once, globally. */
    [hidden] { display: none !important; }
    html, body {
      width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #111; color: #eee; overflow: hidden;
    }
    /* Full-screen map (same as the real map page); the panel floats on top. */
    #wrap { width: 100vw; height: 100vh; }
    #map { position: fixed; inset: 0; }

    /* ==================== paper window ==================== */
    /* The sheet's inside shown as a street, laid over the map at the sheet's
       own pose, under every panel. The sheet itself is left unpainted: any
       plate drawn over its full quad lands on the paper as a black border. */
    #paperWindow { position: fixed; inset: 0; z-index: 12; pointer-events: none; }
    #paperWindow[hidden] { display: none; }
    /* Drawn at a fixed size of its own and warped onto the sheet with a
       matrix3d, the one CSS transform that puts a rectangle onto an arbitrary
       quadrilateral. */
    #paperWindow .pw-view {
      position: absolute; left: 0; top: 0; transform-origin: 0 0;
      overflow: hidden; background: #000;
    }
    #paperWindow .pw-pano { position: absolute; inset: 0; }
    #paperWindow .pw-pano .gm-style-cc,
    #paperWindow .pw-pano .gmnoprint { display: none !important; }
    #paperWindow .pw-still {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    }
    #paperWindow .pw-note {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; text-align: center; padding: 8%; color: #cfd8d6;
      font: 700 34px/1.3 "Segoe UI", system-ui, sans-serif;
    }
    /* The close-up window: the second printed sheet, warped the same way.
       Where the street window shows what the pointer is looking at, this one
       shows the ground it is standing on. */
    #zoomWindow { position: fixed; inset: 0; z-index: 12; pointer-events: none; }
    #zoomWindow[hidden] { display: none; }
    #zoomWindow .zw-cells { position: absolute; inset: 0; width: 100%; height: 100%; }
    #zoomWindow .zw-cells polygon { fill: #000; }
    #zoomWindow .zw-view {
      position: absolute; left: 0; top: 0; transform-origin: 0 0;
      overflow: hidden; background: #eae6df;
    }
    #zoomWindow .zw-map { position: absolute; inset: 0; }
    #zoomWindow .zw-note {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; text-align: center; padding: 8%; color: #4a4a4a;
      font: 700 34px/1.3 "Segoe UI", system-ui, sans-serif;
    }
    /* Both windows, put on screen at the mouse instead of on paper. The
       dashed edge says this is the debug stand-in, not the projected sheet. */
    #paperWindow.is-debug .pw-view, #zoomWindow.is-debug .zw-view {
      outline: 2px dashed rgba(120, 220, 255, 0.9); outline-offset: -2px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
    }
    /* Where the pen points. Strong red and half as big again as it used to
       be, so it can be found on a busy map from across the table; it grows
       and glows while the card is pinched. */
    #penTip {
      position: fixed; z-index: 30; pointer-events: none;
      transform: translate(-50%, -50%);
      width: 24px; height: 24px; border-radius: 50%;
      background: rgba(255, 20, 20, 0.92);
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.45), 0 0 16px 4px rgba(255, 0, 0, 0.45);
      transition: width 0.1s ease, height 0.1s ease, background 0.1s ease, box-shadow 0.1s ease;
    }
    #penTip[hidden] { display: none; }
    #penTip.is-down {
      width: 36px; height: 36px; background: #ff0000;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.5), 0 0 24px 8px rgba(255, 0, 0, 0.6);
    }

    /* The tether: pointer 24 tied to each open window with an electric
       line. It is always there; what changes is its weight. While either
       end is moving it runs three times as thick, and once both are still
       it thins back to a wire. Between the windows (z 12) and the tag cues
       (z 13). */
    #tetherLayer { position: fixed; inset: 0; z-index: 12; pointer-events: none; }
    #tetherLayer[hidden] { display: none; }
    #tetherLayer svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    #tetherLayer path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    #tetherLayer .tether-glow { stroke: #6fe3d6; filter: url(#tetherBlur); }
    #tetherLayer .tether-core { stroke: #f2fffd; }

    #paperWindow .pw-caption {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px;
      text-align: center; color: #fff; background: rgba(0, 0, 0, 0.55);
      font: 700 28px/1.2 "Segoe UI", system-ui, sans-serif;
    }
    #paperWindow .pw-view [hidden] { display: none; }
    /* The tag cells stand proud of the band into the inside, so the view
       would land on them; these sit above it and keep every cell dark. */
    #paperWindow .pw-cells { position: absolute; inset: 0; width: 100%; height: 100%; }
    #paperWindow .pw-cells polygon { fill: #000; }

    /* Detection cues: a ring of light around every frame or pointer tag the
       camera can see, each labelled with its id, with the tag's own footprint
       projected BLACK -- light landing on the modules is what makes a tag
       harder to decode, so the glow stays outside it. */

    /* Export-frame preview. An SVG overlay sits above the map (never
       intercepting pointer events) showing exactly what the PDF will contain:
       the page outline, the inset map frame, and the eight AprilTag patches in
       their true printed positions. Geometry comes from /api/map-sheet-layout,
       so it cannot drift from what the PDF generator actually draws. */
    #exportPreview {
      position: fixed; inset: 0; z-index: 10;
      pointer-events: none; overflow: visible;
    }
    #exportPreview .page { fill: rgba(0,0,0,0.30); }
    #exportPreview .frame {
      fill: none; stroke: #ffd000; stroke-width: 2;
      stroke-dasharray: 9 6; vector-effect: non-scaling-stroke;
    }
    #exportPreview .tag { fill: #fff; stroke: #111; stroke-width: 1; }
    #exportPreview .tagimg { image-rendering: pixelated; }
    #exportPreview .badge { fill: #fff; stroke: #999; stroke-width: 0.7; }
    #exportPreview .cap {
      fill: #ffd000; font: 700 12px -apple-system, "Segoe UI", Arial, sans-serif;
      paint-order: stroke; stroke: rgba(0,0,0,0.75); stroke-width: 3px;
    }

    /* Digitization controls float above the shared map workspace. */
    .panel {
      position: fixed; top: 14px; z-index: 20;
      width: min(360px, calc(100vw - 28px)); max-height: calc(100vh - 28px);
      display: flex; flex-direction: column; gap: 12px;
      padding: 14px; overflow-y: auto;
      background: rgba(20, 20, 20, 0.88); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px; backdrop-filter: blur(10px);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.38);
      transition: transform 0.18s ease, opacity 0.18s ease;
    }
    #panel { right: 14px; }
    /* Save / load sits at the foot of the panel, after every other step. */
    .session-bar { display: flex; gap: 8px; }
    .session-bar button { flex: 1; }
    /* Centred picker for saved sessions. */
    #sessionModal {
      position: fixed; inset: 0; z-index: 40; display: flex;
      align-items: center; justify-content: center; padding: 20px;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(3px);
    }
    #sessionModal[hidden] { display: none; }
    .session-card {
      width: min(520px, 100%); max-height: min(70vh, 640px);
      display: flex; flex-direction: column; gap: 12px; padding: 16px;
      background: #1c1c1c; border: 1px solid rgba(255,255,255,0.22);
      border-radius: 4px; box-shadow: 0 18px 44px rgba(0,0,0,0.5);
    }
    .session-card h2 { font-size: 15px; }
    .session-card .head { display: flex; align-items: center; gap: 10px; }
    .session-card .head h2 { flex: 1; }
    #sessionRows { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .session-row {
      display: flex; align-items: center; gap: 10px; padding: 9px 11px;
      background: #242424; border: 1px solid #3d3d3d; border-radius: 4px;
    }
    .session-row .meta { flex: 1; min-width: 0; }
    .session-row .nm { font-size: 12.5px; color: #eee; }
    .session-row .sub { font-size: 10.5px; color: #9a9a9a; margin-top: 2px; }
    .session-row button { padding: 5px 10px; font-size: 11px; }
    .session-row .del { border-color: #7a3a33; color: #ff9d90; }
    .session-empty { font-size: 12px; color: #9a9a9a; padding: 10px 2px; }
    /* Fix by Hand opens against the left edge, under the hand that reaches
       for it from the dock. The dock stands down while it is open (see
       syncLaunchers) so the two never fight for the same strip. */
    #panelEdit { left: 14px; }
    .panel.collapsed { transform: translateY(-10px); opacity: 0; pointer-events: none; }

    #pinLabel {
      flex: 1; min-width: 0; padding: 7px 9px; border-radius: 4px;
      background: #202020; border: 1px solid #4a4a4a; color: #eee;
      font: 600 12px inherit;
    }
    #pinLabel:focus { outline: none; border-color: #6fe3d6; }

    /* Tool palette: one swatch per colour, the shape drawn inside it. */
    .tool-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .tool {
      width: 40px; height: 34px; display: flex; align-items: center; justify-content: center;
      padding: 0; background: #242424; border: 1px solid #4a4a4a; border-radius: 4px;
      cursor: pointer;
    }
    .tool:hover { border-color: #6fe3d6; }
    .tool.is-active { border-color: #6fe3d6; background: #17302d; box-shadow: 0 0 0 2px rgba(99,206,197,0.35); }
    .tool svg { display: block; pointer-events: none; }
    .tool.wide { width: auto; padding: 0 10px; gap: 6px; font: 700 11px inherit; color: #ddd; }
    /* While a tool is armed the map is a drawing surface, not a pannable map. */
    .map-editing { cursor: crosshair; }
    /* Edge furniture retreats off-screen so the map is uninterrupted, and
       comes back when the pointer nears that edge. Everything stays reachable
       by keyboard, since focus inside a group pins it open. */
    #sideDock, #expoBar {
      transition: transform 0.28s ease, opacity 0.22s ease;
    }
    body:not(.peek-left) #sideDock {
      transform: translateY(-50%) translateX(-100%); opacity: 0;
    }
    /* The row of views hides with the bottom edge like the rest of the
       furniture. A pointer tag resting near that edge counts as a hand being
       there, so the discs come out for the tag as well as for the mouse. */
    body:not(.peek-bottom) #expoBar {
      transform: translateX(-50%) translateY(calc(100% + 40px)); opacity: 0;
    }
    /* Flipped, the discs occupy the top edge where the scene title normally
       sits, and the bar (z-index 70) covered it. The title drops below the
       row instead. The row's height is not a constant -- a long name wraps at
       104px -- so it is measured into --expo-bar-h; the fallback is the
       one-line height. The extra 18px clears the 1.2x scale-up of the active
       disc, which the rotation throws downward. */
    body.expo-top #expoTimer {
      top: calc(22px + var(--expo-bar-h, 106px) + 18px);
    }
    /* Ctrl+Shift+A sends the row to the far edge, turned 180 degrees, for
       whoever is standing on the other side of the table: it reads the right
       way up from there, and it hides into the top edge instead of the bottom
       one. Placed after the rule above because they tie on specificity. */
    body.expo-top #expoBar {
      top: 22px; bottom: auto;
      transform: translateX(-50%) rotate(180deg); opacity: 1;
    }
    /* rotate() is applied before this translate, so a positive Y here carries
       the row up and off the top edge -- the same gesture as the bottom case. */
    body.expo-top:not(.peek-top) #expoBar {
      transform: translateX(-50%) rotate(180deg) translateY(calc(100% + 40px));
      opacity: 0;
    }
    #sideDock:focus-within { transform: translateY(-50%); opacity: 1; }

    /* ==================== expo playback ==================== */
    /* The plaque naming the scene on screen. Read from across a room, so it is
       oversized and high contrast, and it holds one line at the width of the
       longest title -- fitSceneTitle sizes each one to fit. */
    #expoTimer { pointer-events: none; }
    #expoTimer {
      position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
      z-index: 60; padding: 14px 34px;
      font: 800 clamp(19px, 3.4vw, 46px)/1.05 "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.01em; color: #14181a;
      white-space: nowrap; max-width: 94vw;
      background: #ffffff; border: 5px solid #000000; border-radius: 4px;
    }
    #expoTimer[hidden] { display: none; }
    #expoTimerText { display: block; }

    /* The seven views, as seven discs along the bottom of the table: the
       roads, one per sticker colour, then all of them at once. They never
       tuck away like the other edge
       furniture, because a pointer tag has to be able to land on them, and
       they sit on the map with no bar behind them. */
    #expoBar {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      z-index: 70; display: flex; align-items: flex-start; gap: 18px;
      width: max-content; max-width: 96vw;
    }
    #expoBar .part {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      width: 104px; padding: 0; background: none; border: 0; cursor: pointer;
      font: inherit;
    }
    #expoBar .disc {
      width: 66px; height: 66px; border-radius: 50%;
      border: 4px solid #000; box-shadow: 0 0 0 3px #fff, 0 6px 16px rgba(0, 0, 0, 0.35);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    #expoBar .disc svg { width: 34px; height: 34px; display: block; }
    #expoBar .name {
      text-align: center; color: #fff;
      font: 800 13px/1.15 "Segoe UI", system-ui, sans-serif;
      text-shadow: 0 0 3px #000, 0 0 6px #000, 0 1px 2px #000;
    }
    /* A pointer tag resting on a disc shows as a ring before it selects. */
    #expoBar .part.is-hover .disc {
      box-shadow: 0 0 0 3px #fff, 0 0 0 8px #9fe8dc, 0 6px 16px rgba(0, 0, 0, 0.35);
    }
    #expoBar .part.is-active .disc {
      transform: scale(1.2);
      box-shadow: 0 0 0 4px #fff, 0 0 0 8px #000, 0 8px 22px rgba(0, 0, 0, 0.45);
    }
    #expoBar .part.is-active .name { font-size: 14px; }
    /* A colour nobody used is still a view, just an empty one. */
    #expoBar .part.is-empty .disc { opacity: 0.45; }
    #expoBar .part.is-empty .name { opacity: 0.6; }
    /* Top right, on the same white plate as the title: the swatches are
       hexagons, the shape of the bins they stand for, with the words beside
       them. Read from the same distance as the title. */
    #previzLegend {
      position: fixed; right: 14px; top: 14px; z-index: 60; pointer-events: none;
      display: flex; flex-direction: column; gap: 10px;
      padding: 12px 16px 12px 13px; border-radius: 4px; max-width: 34vw;
      background: #ffffff; border: 3px solid #000000; color: #14181a;
      font: 700 clamp(13px, 1.25vw, 18px)/1.25 "Segoe UI", system-ui, sans-serif;
    }
    #previzLegend[hidden] { display: none; }
    #previzLegend .row { display: flex; align-items: center; gap: 11px; }
    /* A pointy-top hexagon, the same way round as the bins on the map. The
       outline cannot be a border -- clip-path cuts that off too -- so the
       swatch is a black hexagon with a slightly smaller coloured one inset
       on top of it. */
    #previzLegend .sw {
      flex: 0 0 auto; position: relative; width: 1.45em; height: 1.62em;
      background: #000000;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }
    #previzLegend .sw::before {
      content: ''; position: absolute; inset: 2px;
      background: inherit; background-color: var(--sw, #fff);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }

    /* ---- street-level callouts ---- */
    /* The workshop page's own left-edge nav, matched value for value from
       web/src/pageFlow.js: a dark panel flush against the edge with only its
       right corners rounded, translucent white buttons inside it, and Back
       alone carrying the red. Anyone moving between the two pages should not
       have to learn a second set of controls. */
    #sideDock[hidden] { display: none; }
    #sideDock {
      position: fixed; left: 0; top: 50%; transform: translateY(-50%);
      z-index: 25; display: flex; flex-direction: column;
      align-items: stretch; gap: 8px; padding: 12px 10px;
      background: rgba(15, 15, 15, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.22); border-left: none;
      border-radius: 0 12px 12px 0; box-shadow: 6px 0 24px rgba(0, 0, 0, 0.35);
    }
    .menu-back, .launch {
      box-sizing: border-box; width: 132px; padding: 10px 16px;
      font: 600 14px/1.1 "Segoe UI", system-ui, sans-serif; color: #fff;
      text-align: left; text-decoration: none; cursor: pointer; white-space: nowrap;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 8px;
    }
    .menu-back:hover, .launch:hover { background: rgba(255, 255, 255, 0.16); }
    /* Leaving is the one action that undoes the session, so it is the one
       button that is coloured -- exactly as on the workshop page. */
    .menu-back {
      color: #ffe8e8; background: rgba(166, 58, 58, 0.28);
      border-color: rgba(255, 132, 132, 0.48);
    }
    .menu-back:hover { background: rgba(166, 58, 58, 0.42); }
    .menu-back:focus-visible, .launch:focus-visible {
      outline: 2px solid #6fe3d6; outline-offset: 2px;
    }
    .launch[hidden] { display: none; }
    /* Record carries an icon beside its label, so it lays itself out as a row
       rather than a block. Same plate and metrics as the rest of the dock. */
    .launch.rec { display: inline-flex; align-items: center; gap: 7px; }
    .launch.rec .rec-icon {
      flex: 0 0 auto; width: 12px; height: 12px; background: #e23b3b;
      border-radius: 50%; transition: border-radius 0.12s ease;
    }
    /* Recording: the disc squares off, as on the workshop page. */
    .launch.rec.is-on .rec-icon { border-radius: 2px; }
    .launch.rec[disabled] { opacity: 0.45; cursor: not-allowed; }
    .launch.rec[disabled]:hover { background: rgba(255, 255, 255, 0.08); }
    /* Says what the recorder is doing, and keeps saying it while the dock is
       tucked away or a panel is covering it. */
    #recordToast {
      position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 99999;
      padding: 10px 18px; max-width: 80vw; text-align: center;
      color: #fff; background: rgba(17, 22, 29, 0.96);
      border: 2px solid #2a323d; border-radius: 11px;
      font: 600 14px/1.4 "Segoe UI", system-ui, sans-serif;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      transition: opacity 0.25s; pointer-events: none; opacity: 0;
    }
    /* Toggle switches (basemap, POI/label on-off). */
    label.sw { display: flex; align-items: center; gap: 9px; font-size: 12px; cursor: pointer; }
    /* Only the checkbox is hidden behind the drawn track — scoped to
       [type=checkbox] so other inputs inside the label stay visible. */
    label.sw input[type="checkbox"] { position: absolute; opacity: 0; pointer-events: none; }
    label.sw .track {
      flex: 0 0 auto; width: 34px; height: 19px; border-radius: 4px; position: relative;
      background: #3a3a3a; border: 1px solid #555; transition: background 0.15s ease, border-color 0.15s ease;
    }
    label.sw .track::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 13px; height: 13px; border-radius: 50%; background: #ccc;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    label.sw input[type="checkbox"]:checked + .track { background: #2f8f86; border-color: #1f6f68; }
    label.sw input[type="checkbox"]:checked + .track::after { transform: translateX(15px); background: #fff; }
    label.sw input[type="checkbox"]:focus-visible + .track { outline: 2px solid #6fe3d6; outline-offset: 2px; }
    label.sw .txt { flex: 1; }

    /* Walking reach: label, toggle, minutes, unit and state on a single row.
       The number input overrides the full-width rule the ID fields use, and the
       state text is the flexible element so it absorbs the leftover space and
       ellipsises rather than wrapping the row. */
    .reach-line { display: flex; align-items: center; gap: 8px; }
    .reach-line .rl-label { flex: 0 0 auto; font-size: 12px; }
    .reach-line .rl-sw { flex: 0 0 auto; gap: 0; }
    .reach-line input[type="number"] {
      flex: 0 0 auto; width: 58px; min-width: 0;
      padding: 6px 4px 6px 8px; text-align: left; font-size: 12.5px;
    }
    .reach-line .rl-unit { flex: 0 0 auto; font-size: 11.5px; color: #9a9a9a; }
    .reach-line .rl-state {
      flex: 1 1 auto; min-width: 0; text-align: right; font-size: 11px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Detail sliders snap to named levels rather than raw numbers. */
    .level { display: flex; flex-direction: column; gap: 4px; }
    .level .lv-head { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
    .level .lv-head .lv-name { flex: 1; color: #9a9a9a; text-align: right; font-size: 11.5px; }
    .level input[type="range"] { width: 100%; accent-color: #2f8f86; }
    .level.off, label.sw.off, section.off { opacity: 0.4; pointer-events: none; }

    /* Slim disclosure row. Kept short so a collapsed group costs almost no
       vertical space in an already dense panel. */
    .disclose {
      display: flex; align-items: center; gap: 7px; width: 100%;
      padding: 3px 6px; background: transparent; border: 0; border-radius: 4px;
      color: #9a9a9a; font: 600 11.5px inherit; text-align: left; cursor: pointer;
    }
    .disclose:hover { background: rgba(255,255,255,0.06); color: #ddd; }
    .disclose .caret { flex: 0 0 auto; font-size: 9px; transition: transform 0.15s ease; }
    .disclose[aria-expanded="true"] .caret { transform: rotate(90deg); }
    .disclose .disclose-txt { flex: 0 0 auto; }
    .disclose .disclose-note {
      flex: 1; text-align: right; font-weight: 600; color: #7d858d;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .disclose .disclose-note.filtered { color: #6fe3d6; }

    .cats-actions { gap: 6px; }
    .cats-actions button { padding: 3px 9px; font-size: 11px; }

    /* Per-category label toggles, two per row. */
    .cats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
    .cats label { display: flex; align-items: center; gap: 6px; font-size: 11.5px; cursor: pointer; }
    .cats input { flex: 0 0 auto; accent-color: #2f8f86; margin: 0; }
    .cats label.unavailable { opacity: 0.35; }

    /* Colour pickers, two per row. */
    .swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 10px; align-items: center; }
    .swatches label { display: flex; align-items: center; gap: 7px; font-size: 12px; cursor: pointer; }
    .swatches input[type="color"] {
      flex: 0 0 auto; width: 30px; height: 22px; padding: 2px; cursor: pointer;
      background: #2c2c2c; border: 1px solid #555; border-radius: 4px;
    }
    .swatches button { grid-column: 1 / -1; justify-self: start; padding: 5px 10px; font-size: 11.5px; }
    /* Sections are plain stacked groups separated by a rule, not boxes. The
       divider plus an uppercase caption gives structure without the visual
       weight of nested panels. */
    section { display: flex; flex-direction: column; gap: 8px; }
    section + section {
      margin-top: 3px; padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.12);
    }
    /* A hidden section must not leave its divider (or gap) behind. */
    section[hidden] { display: none; }
    section[hidden] + section { margin-top: 0; padding-top: 0; border-top: 0; }
    section h2 {
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.8px;
      text-transform: uppercase; color: #8f97a0;
      display: flex; align-items: baseline; gap: 8px;
    }
    /* Optional right-aligned reading beside a section title. */
    section h2 .h2-note {
      flex: 1; text-align: right; font-weight: 600; letter-spacing: 0;
      text-transform: none; font-size: 11px; color: #7d858d;
    }
    /* The zoom note warns when the tiles lack street names at this zoom. */
    section h2 .h2-note.warn { color: #ffd66b; }
    /* A sub-label inside a section (e.g. "Level" under Points of interest). */
    .sub-label { font-size: 11.5px; color: #9a9a9a; }
    .hint { font-size: 12px; line-height: 1.45; color: #9a9a9a; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    button {
      font: 600 12.5px inherit; color: #fff; cursor: pointer;
      background: #2c2c2c; border: 1px solid #555; border-radius: 4px; padding: 7px 12px;
    }
    button:hover { background: #383838; }
    button.primary { background: #2f8f86; border-color: #1f6f68; }
    button.primary:hover { background: #35a094; }
    button.primary:disabled { opacity: 0.45; cursor: not-allowed; }
    button.armed { background: #8a6d00; border-color: #b89200; }
    .status { font-size: 12px; min-height: 15px; color: #bbb; }
    .status.ok { color: #6fe3d6; }
    .status.err { color: #ff8d7e; }
    .status.warn { color: #ffd66b; }
    .color-legend {
      display: flex; flex-wrap: wrap; gap: 5px 7px;
      padding-top: 2px;
    }
    .color-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 7px 3px 5px; cursor: pointer;
      color: #d7d7d7; background: #252525;
      border: 1px solid #464646; border-radius: 4px;
      font-size: 10.5px; line-height: 1.2;
    }
    .color-chip input { margin: 0; accent-color: #2f8f86; }
    .color-chip .dot {
      width: 11px; height: 11px; flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,0.55); border-radius: 50%;
    }
    .color-chip .sign { font-weight: 700; font-size: 12px; line-height: 1; margin-left: -2px; }
    .color-chip:has(input:not(:checked)) { opacity: 0.45; }
    /* What the drawing was understood to be, not just which colours it used. */
    .kind-legend { display: flex; flex-wrap: wrap; gap: 5px 7px; padding-top: 2px; }
    .kind-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 8px; color: #d7d7d7; background: #252525;
      border: 1px solid #464646; border-radius: 4px;
      font-size: 10.5px; line-height: 1.2;
    }
    .kind-chip { cursor: pointer; }
    .kind-chip input { margin: 0; accent-color: #2f8f86; }
    .kind-chip b { color: #6fe3d6; font-weight: 700; }
    .kind-chip .glyph { font-size: 12px; line-height: 1; }
    .kind-chip:has(input:not(:checked)) { opacity: 0.45; }
    .kind-chip:has(input:not(:checked)) b { color: #d7d7d7; }
    /* Four ways to read the drawn trips; exclusive, click again for plain lines. */
    .pathviz { display: flex; flex-wrap: wrap; gap: 5px 7px; align-items: center; padding-top: 4px; }
    .pathviz .lbl { font-size: 10.5px; color: #9a9a9a; }
    .pathviz button {
      padding: 3px 10px; font-size: 10.5px; line-height: 1.2;
      color: #d7d7d7; background: #252525;
      border: 1px solid #464646; border-radius: 4px; cursor: pointer;
    }
    .pathviz button.is-active { border-color: #2f8f86; color: #6fe3d6; background: #10312d; }
    /* An ID that already exists on disk: exporting would replace it. */
    input.used { border-color: #b89200; background: #2a2410; color: #ffd66b; }

    /* Photos in: phone, dropped files and camera share one row. The drop target
       stays a dashed box, not a button -- it is somewhere to drop, though a
       click still opens the file picker. The map itself is the preview. */
    .scan-row { display: flex; align-items: stretch; gap: 8px; }
    .scan-row > button { flex: 0 0 auto; }
    #dropZone {
      flex: 1 1 auto; min-width: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 6px 10px; cursor: pointer; text-align: center; white-space: nowrap;
      font-size: 12.5px; font-weight: 600; color: #cfcfcf;
      border: 1.5px dashed #565656; border-radius: 4px; background: #1c1c1c;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    #dropZone:hover, #dropZone:focus-visible { border-color: #6fe3d6; background: #202626; outline: none; }
    #dropZone.dragover { border-color: #2f8f86; background: #17302d; border-style: solid; }
    /* Dropping and the camera wait for a loaded reference; the phone does not. */
    .scan-row .off { opacity: 0.4; pointer-events: none; }
    #captureWatchBtn.is-active { border-color: #2f8f86; color: #6fe3d6; background: #10312d; }
    /* The QR is what a phone uses; its address is on the tooltip. While the
       tunnel connects, a placeholder holds the QR's place. */
    #capturePair { display: flex; justify-content: center; }
    #captureQr img, #captureQr canvas { border-radius: 4px; background: #fff; padding: 7px; }
    #captureQr .qr-wait {
      width: 162px; height: 162px; display: flex; align-items: center; justify-content: center;
      border: 1.5px dashed #565656; border-radius: 4px; color: #9a9a9a; font-size: 12px;
    }
    /* The map field turns green once its map is loaded -- the only sign needed,
       since loading lists nothing until a photo arrives. */
    #digitizeMapId.loaded { border-color: #2f8f86; box-shadow: inset 0 0 0 1px #2f8f86; }
    /* A quiet status only speaks when something went wrong. */
    .status.quiet:not(.err):not(.warn), .status.quiet:empty { display: none; }

    /* One row per loaded image, with its own per-sheet state. */
    #sheetList { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    #sheetList:empty { display: none; }
    #sheetList li {
      display: flex; align-items: center; gap: 8px; font-size: 11.5px;
      padding: 5px 8px; border-radius: 4px; background: #1e1e1e; border: 1px solid #333;
    }
    #sheetList .sh { flex: 0 0 auto; margin: 0; accent-color: #2f8f86; cursor: pointer; }
    #sheetList .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #sheetList .st { flex: 0 0 auto; color: #9a9a9a; font-variant-numeric: tabular-nums; }
    #sheetList li.ok { border-color: #2f8f86; }
    #sheetList li.ok .st { color: #6fe3d6; }
    #sheetList li.err { border-color: #7a3a33; }
    #sheetList li.err .st { color: #ff8d7e; }
    /* Unticked: still listed and still detected, just not in the combined view. */
    #sheetList li.off { opacity: 0.45; }
    #sheetList li.off .nm { text-decoration: line-through; }
    #sheetList .x {
      flex: 0 0 auto; padding: 1px 6px; font: 700 12px inherit; line-height: 1.3;
      background: transparent; border: 1px solid #4a4a4a; border-radius: 4px; color: #bbb;
    }

    label.slider { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    label.slider input[type="range"] { flex: 1; accent-color: #2f8f86; }
    label.slider .val { min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
    input[type="text"], input[type="number"], select {
      min-width: 0; flex: 1; padding: 7px 9px; border-radius: 4px;
      color: #eee; background: #292929; border: 1px solid #555; font: 12px inherit;
    }
    input[type="file"] { display: none; }

    /* Hidden working elements. The rectified ink canvas must stay in the DOM for
       the maplibre canvas source; camImg is the decode target for each photo /
       the MJPEG stream, and is never shown now that the preview box is gone. */
    #camCanvas, #inkCanvas, #camImg { display: none; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="map"></div>
    <svg id="exportPreview" hidden aria-hidden="true"></svg>



    <!-- The launcher opens the digitization workflow. -->
    <!-- The plaque is a drawn cloud now rather than a panel: it belongs to
         the same cartoon the walker came out of. The cloud is generated to fit
         whatever the title says, so it is inserted here rather than authored. -->
    <div id="expoTimer" hidden aria-live="off">
      <span id="expoTimerText"></span>
    </div>

    <!-- The paper window: an A3 sheet with AprilTags in its border, laid on
         the projected table. Its outline is painted black so the printed tags
         keep their contrast under the projector; its inside gets a street-level
         view of wherever the pointer tag sits on the map. -->
    <div id="paperWindow" hidden aria-hidden="true">
      <div class="pw-view">
        <div class="pw-pano"></div>
        <img class="pw-still" alt="" hidden />
        <div class="pw-note">Posez le pointeur sur la carte</div>
        <div class="pw-caption" hidden></div>
      </div>
      <svg class="pw-cells" aria-hidden="true"></svg>
    </div>
    <!-- The close-up sheet. Its own border ids (see imobyl_zoom_slot_ids)
         make it a different sheet to the camera; it reads the same pointer. -->
    <div id="zoomWindow" hidden aria-hidden="true">
      <div class="zw-view">
        <div class="zw-map"></div>
        <div class="zw-note">Posez le pointeur sur la carte</div>
      </div>
      <svg class="zw-cells" aria-hidden="true"></svg>
    </div>
    <div id="penTip" hidden aria-hidden="true"></div>

    <!-- The line from pointer 24 to each open window. Drawn by script;
         see the pointer-effects module. -->
    <div id="tetherLayer" hidden aria-hidden="true">
      <svg aria-hidden="true">
        <defs>
          <filter id="tetherBlur" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="3.2" />
          </filter>
        </defs>
        <g id="tetherMarks"></g>
      </svg>
    </div>

    <!-- Names the colours the scene on screen is speaking in. Part of the
         show rather than a control, so unlike the transport it does not tuck
         itself away at the edge. -->
    <div id="previzLegend" hidden aria-live="off"></div>

    <!-- The views. Built by the script from the sticker colours, so a
         colour added to the palette gets its disc without touching this. -->
    <div id="expoBar" role="group" aria-label="Views"></div>

    <!-- Menu, then the two panels: one column at the height of the hand. -->
    <div id="sideDock">
      <a class="menu-back" href="/" aria-label="Back to main menu">Back</a>
      <button type="button" id="openH" class="launch" title="IMOBYL (H)">IMOBYL</button>
      <button type="button" id="openEdit" class="launch"
              title="Fix by hand (J)">Fix by Hand</button>
      <!-- The same backend recorder the workshop page drives, so whichever
           page is on the table can start and stop it. -->
      <button type="button" id="recordBtn" class="launch rec"
              title="Record camera and microphone" aria-label="Start recording">
        <span class="rec-icon" aria-hidden="true"></span><span class="rec-label">Record</span>
      </button>
    </div>
    <div id="recordToast" role="status" aria-live="polite"></div>
    <!-- Manual correction. Whatever is drawn here is attached to the reference
         sheet selected in the Digitize panel's list, alongside what detection
         found, so a missed sticker or a broken path can be put right by hand. -->
    <aside id="panelEdit" class="panel collapsed" aria-label="Fix by Hand">
      <h1 class="panel-title">
        <button type="button" class="back" data-close="panelEdit" title="Close (J)" aria-label="Close">‹</button>
      </h1>

      <section>
        <h2>Stickers</h2>
        <div class="tool-grid" id="toolStickerCircle" aria-label="Add round sticker"></div>
        <div class="tool-grid" id="toolStickerTriangle" aria-label="Add triangular sticker"></div>
      </section>

      <section>
        <h2>Paths</h2>
        <div class="tool-grid" id="toolPaths"></div>
        <label class="slider">Pen width
          <input type="range" id="penWidth" min="2" max="24" step="1" value="8" />
          <span class="val" id="penWidthVal">8</span>
        </label>
      </section>

      <section>
        <h2>Pin</h2>
        <p class="hint">Type a name, pick the pin, then click the map.</p>
        <div class="row">
          <input type="text" id="pinLabel" maxlength="60"
                 placeholder="e.g. Entrée du collège" aria-label="Pin label" />
        </div>
        <div class="tool-grid" id="toolPin" aria-label="Drop a labelled pin"></div>
      </section>

      <section>
        <h2>Eraser</h2>
        <div class="tool-grid" id="toolEraser"></div>
        <div class="row">
          <button type="button" id="clearManualBtn">Clear my edits on this sheet</button>
        </div>
        <div class="status" id="editStatus"></div>
      </section>
    </aside>

    <aside id="panel" class="panel collapsed">
      <h1 class="panel-title">
        <button type="button" class="back" data-close="panel" title="Close (H)" aria-label="Close">‹</button>
        <span>IMOBYL</span>
      </h1>

      <section id="tempRasterControls" hidden>
        <label class="slider">Raster opacity
          <input type="range" id="tempRasterOpacity" min="0" max="1" step="0.05" value="0.65" />
          <span class="val" id="tempRasterOpacityVal">65%</span>
        </label>
      </section>

      <!-- No captions here: the controls say what they do, and the quiet
           status lines only appear when something went wrong. -->
      <section id="stepReferenceMap">
        <div class="row">
          <input type="number" id="digitizeMapId" min="1" max="999999999" step="1"
                 placeholder="Map ID" aria-label="Map ID" />
        </div>
        <button type="button" class="primary" id="loadReferenceBtn">Load reference</button>
        <div class="status quiet" id="sheetIdStatus"></div>
      </section>

      <!-- Photos in, three ways. The phone needs nothing loaded first -- each
           photo names its own map -- while dropped files and the camera file
           into the loaded reference. Loading runs detection automatically. -->
      <section id="stepCam">
        <div class="scan-row">
          <button type="button" id="captureWatchBtn"
                  title="Take photos on a phone and have them digitised here automatically. Every photo becomes a sheet of its own, numbered within its map.">Listen for phone</button>
          <div id="dropZone" class="off" tabindex="0" role="button"
               title="Drop photos of the marked map here, or click to choose files"
               aria-label="Drop photos of the marked map here, or click to choose files">
            Drop image
            <input type="file" id="photoInput" accept="image/*" multiple />
          </div>
          <button type="button" id="camSourceBtn" class="off">Use camera</button>
        </div>
        <div id="capturePair" hidden>
          <div id="captureQr"></div>
        </div>
        <div class="status quiet" id="captureHint"></div>
        <div class="status quiet" id="captureStatus"></div>
        <div class="status quiet" id="camStatus"></div>
        <ul id="sheetList"></ul>
        <div class="row">
          <button type="button" id="exportGeojsonBtn" disabled>Export GeoJSON</button>
        </div>
      </section>

      <!-- Detection runs on load; the threshold re-runs it. -->
      <section id="stepInk">
        <h2>Detected drawing</h2>
        <label class="slider">Difference threshold
          <input type="range" id="threshold" min="5" max="100" step="1" value="28" />
          <span class="val" id="thresholdVal">28</span>
        </label>
        <div id="kindLegend" class="kind-legend" hidden
             aria-label="What the drawing was understood to be"></div>
        <div class="pathviz" role="group" aria-label="How drawn paths are shown">
          <span class="lbl">Paths:</span>
          <button type="button" data-viz="flow"
                  title="Line width grows where many trips share a corridor">Flow width</button>
          <button type="button" data-viz="regions"
                  title="The smallest areas holding 50%, 70% and 90% of everything drawn — how far the group's city reaches">Regions</button>
          <button type="button" id="snapStreetsBtn"
                  title="Move each drawn path onto the nearest street, alley or footpath. Display only — the drawn data and exports keep the pen strokes.">Snap to streets</button>
          <span class="status" id="pathVizStatus"></span>
        </div>
        <div class="pathviz" role="group" aria-label="Map overlays">
          <span class="lbl">Overlay:</span>
          <button type="button" id="arrondissementBtn"
                  title="Outline the surrounding arrondissements, so the region bands can be read against the city's own districts">Arrondissements</button>
          <span class="status" id="arrondissementStatus"></span>
        </div>
        <label class="slider" title="Scales every drawn line — plain, flow width and pulse alike">Line width
          <input type="range" id="pathWidth" min="0.3" max="3" step="0.1" value="1" />
          <span class="val" id="pathWidthVal">1.0&times;</span>
        </label>
        <label class="slider" title="How many pulses travel the trips at once, on average (0 turns them off)">Particles
          <input type="range" id="pulseCount" min="0" max="40" step="1" value="10" />
          <span class="val" id="pulseCountVal">10</span>
        </label>
        <label class="slider" title="How fast the pulses travel along the trips">Particle speed
          <input type="range" id="pulseSpeed" min="0.2" max="4" step="0.1" value="1" />
          <span class="val" id="pulseSpeedVal">1.0&times;</span>
        </label>
        <label class="check">
          <input type="checkbox" id="showMarks" checked />
          <span>Show sticker marks (+ / –)</span>
        </label>
        <label class="check">
          <input type="checkbox" id="bivPulse" />
          <span>Pulse the bins (5 s)</span>
        </label>
        <label class="check"
               title="Carry each bin's reading out over the empty ground around it, ring by ring, fading as it goes">
          <input type="checkbox" id="bivInterpolate" />
          <span>Interpolate across the whole map</span>
        </label>
        <label class="slider"
               title="How much of a reading survives each hex further out. Lower fades the interpolated ground away faster and keeps it further behind the bins people actually marked.">Spread fade
          <input type="range" id="bivSpread" min="0.15" max="0.85" step="0.05" value="0.45"
                 disabled />
          <span class="val" id="bivSpreadVal">45%</span>
        </label>
        <div id="heatSections" class="heat-sections" hidden
             aria-label="Heatmap settings per sticker colour"></div>
        <div class="status" id="heatStatus"></div>
        <div id="colorLegend" class="color-legend" hidden
             aria-label="Detected drawing colours"></div>
        <div class="status" id="inkStatus"></div>
      </section>

      <!-- Sessions are files on the server, not browser storage, so the expo
           survives a cleared cache or a move to another machine. -->
      <section id="stepSession">
        <h2>Session</h2>
        <div class="row">
          <input type="text" id="sessionName" maxlength="80"
                 placeholder="Name this session" aria-label="Session name" />
        </div>
        <div class="session-bar">
          <button type="button" class="primary" id="saveSessionBtn">Save</button>
          <button type="button" id="loadSessionBtn">Load…</button>
        </div>
        <div class="status" id="sessionStatus"></div>
      </section>
    </aside>

    <div id="sessionModal" hidden role="dialog" aria-modal="true"
         aria-labelledby="sessionModalTitle">
      <div class="session-card">
        <div class="head">
          <h2 id="sessionModalTitle">Saved sessions</h2>
          <button type="button" id="sessionCloseBtn">Close</button>
        </div>
        <div id="sessionRows"></div>
        <div class="status" id="sessionPickerStatus"></div>
      </div>
    </div>

    <!--
      The "Create Map" panel this page inherited from the original digitise
      page (paper-test.html, since removed) is gone:
      imobyl never creates sheets, nothing opened it (only h and j are bound,
      to IMOBYL and Fix by Hand), and it was hidden outright -- 167 lines of
      UI no one could reach.

      Its CONTROLS could not simply go with it. applyDetailLevels(),
      applyAppearanceTo() and the reach and export code read these elements
      every time the style loads, and they decide what the map actually shows:
      which POI ranks and classes, which label categories, packing, colours,
      buildings. So what is left is a settings store, not an interface -- the
      same ids carrying the same defaults, with every heading, wrapper and
      button that existed only to be looked at stripped out. Nothing renders.

      Wiring any of it back to real UI means moving the inputs into the IMOBYL
      panel; the code will pick them up unchanged.
    -->
    <div id="mapDefaults" hidden aria-hidden="true">
      <input type="checkbox" id="basemapToggle" />

      <input type="checkbox" id="poiOn" checked />
      <div id="poiLevelWrap"><span id="poiLevelName"></span></div>
      <input type="range" id="poiLevel" min="1" max="6" step="1" value="2" />
      <div id="poiOverlapOnWrap"><input type="checkbox" id="poiOverlapOn" /></div>
      <div id="poiOverlapLabelsWrap"><input type="checkbox" id="poiOverlapLabels" disabled /></div>
      <div id="poiCollisionWrap"><span id="poiCollisionName"></span></div>
      <input type="range" id="poiCollisionDistance" min="0" max="24" step="1" value="0" />
      <button type="button" id="poiTypesToggle"><span id="poiTypesNote"></span></button>
      <div id="poiTypesWrap">
        <div id="poiCats">
          <label><input type="checkbox" data-poi="food" checked /></label>
          <label><input type="checkbox" data-poi="shop" checked /></label>
          <label><input type="checkbox" data-poi="education" checked /></label>
          <label><input type="checkbox" data-poi="health" checked /></label>
          <label><input type="checkbox" data-poi="transport" checked /></label>
          <label><input type="checkbox" data-poi="leisure" checked /></label>
          <label><input type="checkbox" data-poi="civic" checked /></label>
          <label><input type="checkbox" data-poi="street" /></label>
          <label><input type="checkbox" data-poi="other" checked /></label>
        </div>
        <button type="button" id="poiCatsAll"></button>
        <button type="button" id="poiCatsNone"></button>
      </div>

      <span id="labelZoomNote"></span>
      <input type="checkbox" id="labelOn" checked />

  <!-- Projector keystone correction, same one the workshop map page uses:

  <!-- The fold-pen hinge geometry, shared with the workshop page: its own
       header says the math lives in ONE place, so this page borrows it
       rather than keeping a second copy. -->
  <script src="src/foldGeometry.js"></script>
  <script>
    (function () {
      'use strict';

      // ==================== panels as real windows =======================
      // The IMOBYL panel is long and mostly read, and floating it over the map
      // hid the very thing it describes, so it moves into a browser window of
      // its own: the element itself is adopted into the popup's document, so
      // every listener already bound to it keeps working and the controls stay
      // wired to this page's state -- no second app instance, no message
      // passing.
      //
      // Fix by Hand deliberately stays on this page. Its buttons only arm a
      // tool; the work itself is clicking and dragging on the map here, and a
      // palette on another screen (or behind this window) makes that a
      // two-window job. It uses the overlay path below and never opens a
      // window, which is also what a blocked popup falls back to.
      //
      // Two consequences are handled below. Lookups must reach into the popup,
      // because $() and querySelectorAll() only see this document once the
      // panel has left it; and the panel must come home when the window
      // closes, or reopening would adopt a node that no longer exists.
      var panelWindows = {};        // panel id -> window

      function panelDocuments() {
        var docs = [document];
        Object.keys(panelWindows).forEach(function (id) {
          var win = panelWindows[id];
          if (win && !win.closed && win.document) docs.push(win.document);
        });
        return docs;
      }

      // Every element lookup goes through these, so it does not matter which
      // document a control currently lives in.
      function $(id) {
        var docs = panelDocuments();
        for (var i = 0; i < docs.length; i += 1) {
          var found = docs[i].getElementById(id);
          if (found) return found;
        }
        return null;
      }

      function queryAll(selector) {
        var out = [];
        panelDocuments().forEach(function (doc) {
          Array.prototype.push.apply(out, doc.querySelectorAll(selector));
        });
        return out;
      }

      function panelStylesheet() {
        var css = '';
        Array.prototype.forEach.call(document.querySelectorAll('style'), function (node) {
          css += node.textContent + '\n';
        });
        // In a window of its own the panel is the whole page: no floating box,
        // no fade-out when "collapsed" (that class still tracks open state for
        // the launchers), and room to use the full width.
        return css + '\n'
          + 'html, body { margin: 0; padding: 0; height: 100%; background: #141414; }\n'
          + '.panel { position: static; width: auto; max-height: none; height: 100%;'
          + ' border: 0; border-radius: 0; box-shadow: none; backdrop-filter: none;'
          + ' background: #141414; transition: none; box-sizing: border-box; }\n'
          + '.panel.collapsed { transform: none; opacity: 1; pointer-events: auto; }\n'
          + '.panel-title .back { display: none; }\n';
      }

      function closePanelWindow(id) {
        var win = panelWindows[id];
        delete panelWindows[id];
        if (win && !win.closed) win.close();
      }

      // Bring the panel back into this document, hidden, so the next open can
      // adopt it again from a known place.
      function reclaimPanel(id) {
        var win = panelWindows[id];
        delete panelWindows[id];
        var element = win && win.document
          ? win.document.getElementById(id)
          : null;
        if (element) {
          element.classList.add('collapsed');
          document.body.appendChild(document.adoptNode(element));
        }
        var here = document.getElementById(id);
        if (here) here.classList.add('collapsed');
        syncLaunchers();
      }

      function openPanelWindow(id, title, width) {
        var existing = panelWindows[id];
        if (existing && !existing.closed) {
          existing.focus();
          return true;
        }
        var element = document.getElementById(id);
        if (!element) return false;
        var win;
        try {
          win = window.open('', 'imobyl-' + id,
            'width=' + width + ',height=' + Math.min(1000, window.screen.availHeight - 60)
            + ',menubar=no,toolbar=no,location=no,status=no');
        } catch (_error) {
          win = null;
        }
        if (!win) return false;      // blocked: the caller falls back to the overlay

        win.document.title = title;
        var style = win.document.createElement('style');
        style.textContent = panelStylesheet();
        win.document.head.appendChild(style);
        win.document.body.appendChild(win.document.adoptNode(element));
        element.classList.remove('collapsed');
        panelWindows[id] = win;

        // A closed window must not leave the panel stranded in a dead
        // document; pagehide fires on close, and the poll covers the cases
        // where it does not (a browser that skips it, a crashed tab).
        win.addEventListener('pagehide', function () {
          window.setTimeout(function () { reclaimPanel(id); }, 0);
        });
        var poll = window.setInterval(function () {
          if (!panelWindows[id]) { window.clearInterval(poll); return; }
          if (win.closed) {
            window.clearInterval(poll);
            reclaimPanel(id);
          }
        }, 700);
        // The opener going away would orphan the popup entirely.
        window.addEventListener('beforeunload', function () {
          if (win && !win.closed) win.close();
        });
        return true;
      }

      function panelIsOpen(id) {
        var win = panelWindows[id];
        if (win && !win.closed) return true;
        var element = document.getElementById(id);
        return Boolean(element) && !element.classList.contains('collapsed');
      }

      function setStatus(el, msg, kind) {
        el.textContent = msg || '';
        // Only the state classes are swapped. Rewriting className wholesale
        // would strip layout classes such as rl-state, which carries the
        // flex sizing for the inline walking-reach row.
        el.classList.remove('ok', 'err', 'warn');
        el.classList.add('status');
        if (kind) el.classList.add(kind);
      }

      // ==================== printable OSM / MapLibre basemaps ====================
      var CONFIG = window.CompactMapConfig.CONFIG;
      // Streets remain the normal OSM raster requested for this workflow.
      // The alternate basemap is a token-free MapLibre VECTOR style:
      // OpenFreeMap "Liberty" (OpenMapTiles schema, OSM-derived). The vector
      // source caps at z14 and MapLibre overzooms beyond it, which keeps
      // streets and labels crisp at z16+. Style, tiles, glyphs and sprites are
      // all served with Access-Control-Allow-Origin:*, so the POI icons load
      // and the PDF canvas export stays untainted.
      // The map generator's own style, which is what the paper sheets were
      // printed from. The
      // exhibition projects onto those sheets, so the ground under a
      // participant's pen and the ground under the projector are one map.
      //
      // web/styles/imobyl-basemap.json is the near-monochrome alternative
      // this page used to open on -- quieter under drawn ink, but a different
      // map from the one in people's hands.
      var PAPER_MAPLIBRE_STYLE = window.CompactMapSetup.generatorStyle();
      var PAPER_OSM_STYLE = {
        version: 8,
        sources: {
          'paper-osm-source': {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
          }
        },
        layers: [{
          id: 'paper-osm-tiles',
          type: 'raster',
          source: 'paper-osm-source',
          minzoom: 0,
          maxzoom: 19,
          // Linear raster sampling softens labels whenever the map is between
          // integer zoom levels. Preserve the original OSM tile pixels for a
          // crisper live view and reference-sheet capture.
          paint: {
            'raster-resampling': 'nearest',
            'raster-fade-duration': 0
          }
        }]
      };

      // Default view: Rue de Ménilmontant, Paris 20e. Centre is the midpoint of
      // the street's real OSM extent (lon 2.38286..2.39923, lat 48.86700..48.87078),
      // at a zoom that fits its length on a printable sheet. Overridden locally
      // rather than in config.js so other pages keep their own default view.
      var PAPER_DEFAULT_CENTER = [2.39104, 48.86889];
      var PAPER_DEFAULT_ZOOM = 15.6;

      var setup = window.CompactMapSetup.initMap({
        config: Object.assign({}, CONFIG, {
          style: PAPER_OSM_STYLE,
          useMapboxServices: false,
          center: PAPER_DEFAULT_CENTER,
          zoom: PAPER_DEFAULT_ZOOM,
          pitch: 0,
          bearing: 0
        }),
        // useBuiltIn3D:true tells mapSetup NOT to inject its own extruded
        // buildings layer — this page wants a flat map on both basemaps.
        themeStyles: {
          streets: { style: PAPER_OSM_STYLE, useBuiltIn3D: true },
          maplibre: { style: PAPER_MAPLIBRE_STYLE, useBuiltIn3D: true }
        },
        // Open on the map generator's own style: this page digitises and
        // replays sheets printed from it, so the plain OSM raster is the
        // deliberate alternative (Basemap toggle), not the starting point.
        initialTheme: 'maplibre',
        // Fullscreen changes the CSS viewport. Keep the WebGL backing canvas at
        // the same physical size instead of stretching its previous pixels.
        trackResize: true,
        preserveDrawingBuffer: true,
        onStyleLoad: function (event) {
          if (event && event.theme === 'maplibre') applyMapLibreAppearance();
          reAddTempSketchMapRasterResult();
          reAddTempSketchMapResult();
          reAddReferenceMap();
          reAddInkLayer();
          drawArrondissements();
          reAddPinLayer();
          reAddSchoolLayer();
          refreshManualPins();
          capZoomToBuildings();
          // A style swap tears down custom sources; rebuild the reach overlay.
          if ($('reachOn') && $('reachOn').checked) updateReach();
        }
      });
      var map = setup.map;

      // ==================== POI / label detail levels ====================
      // Liberty gates detail two different ways, so each needs its own ladder:
      //
      //  * POIs carry a numeric `rank` (1 = most important). The stock style
      //    splits them across three layers by rank AND minzoom (rank 1-6 from
      //    z15, 7-19 from z16, 20+ from z17). Sorting by rank is therefore the
      //    style's own notion of importance, and on this campus tile the
      //    The first four ceilings select roughly 12% / 21% / 32% / 55% of
      //    POIs on the measured tile. Rank 50 is an intentionally bounded step
      //    between rank 20 and the unfiltered "Everything" setting, avoiding the
      //    large density jump that previously happened at the end of the slider.
      //
      //  * Labels have no rank; their importance is encoded as minzoom
      //    (country 2 -> state 5 -> town 6 -> place 8 -> major road 12.2 ->
      //    minor road 15 -> path 15.5). A label that appears when zoomed far
      //    out is by definition a more important one, so the native minzoom IS
      //    the ranking, and each level admits everything at or below a ceiling.
      //
      // For both, the selected level is shown REGARDLESS of current zoom: the
      // layer's own minzoom is forced down to 0 so nothing is hidden just
      // because the map is zoomed out. MapLibre still collision-culls
      // overlapping text, so a high level adds density without illegible pileup.
      // POI TYPE groups, over the OpenMapTiles `class` field. Rank measures
      // importance, not kind, so the level slider cannot single out clutter:
      // turning it down to hide bollards hides real shops too. These groups are
      // the orthogonal axis — what a thing IS — and compose with the ceiling.
      //
      // The class lists were taken from a decoded z14 tile over this area
      // (8233 POIs, 78 distinct classes). Street furniture alone — gates,
      // bollards, waste baskets, bicycle parking, recycling — is ~2600 of them,
      // which is why it is the one group off by default.
      var POI_TYPE_GROUPS = {
        food:      ['restaurant', 'cafe', 'fast_food', 'bar', 'beer', 'ice_cream', 'pub'],
        shop:      ['shop', 'grocery', 'bakery', 'butcher', 'clothing_store', 'alcohol_shop',
                    'hairdresser', 'laundry', 'florist', 'jewelry', 'books', 'marketplace'],
        education: ['school', 'college', 'university', 'library', 'kindergarten'],
        health:    ['pharmacy', 'doctors', 'dentist', 'hospital', 'veterinary', 'clinic'],
        transport: ['bus', 'railway', 'subway', 'tram', 'ferry_terminal', 'airport',
                    'bicycle_rental', 'car_rental', 'parking', 'fuel', 'charging_station'],
        leisure:   ['art_gallery', 'theatre', 'museum', 'cinema', 'attraction', 'castle',
                    'park', 'garden', 'playground', 'pitch', 'sports_centre', 'swimming_pool',
                    'dog_park', 'stadium', 'zoo', 'picnic_site'],
        civic:     ['town_hall', 'post', 'bank', 'atm', 'police', 'fire_station',
                    'place_of_worship', 'office', 'lodging', 'embassy', 'courthouse',
                    'community_centre'],
        street:    ['gate', 'bollard', 'lift_gate', 'cycle_barrier', 'waste_basket',
                    'bicycle_parking', 'motorcycle_parking', 'recycling', 'drinking_water',
                    'bench', 'toilets', 'shelter', 'entrance', 'information']
      };

      // Every class that belongs to a named group; anything else falls to "other".
      var POI_KNOWN_CLASSES = Object.keys(POI_TYPE_GROUPS).reduce(function (all, key) {
        return all.concat(POI_TYPE_GROUPS[key]);
      }, []);

      function poiTypeEnabled(name) {
        var input = document.querySelector('#poiCats input[data-poi="' + name + '"]');
        return !!(input && input.checked);
      }

      // Build the class test for the enabled groups.
      //   null  -> no filtering needed (everything is on)
      //   false -> nothing is on; the caller hides the layers entirely
      function poiClassFilter() {
        var groups = Object.keys(POI_TYPE_GROUPS);
        var enabled = groups.filter(poiTypeEnabled);
        var otherOn = poiTypeEnabled('other');
        if (enabled.length === groups.length && otherOn) return null;      // all on
        if (!enabled.length && !otherOn) return false;                     // all off

        var allowed = [];
        enabled.forEach(function (key) {
          POI_TYPE_GROUPS[key].forEach(function (cls) {
            if (allowed.indexOf(cls) < 0) allowed.push(cls);
          });
        });
        var test = allowed.length
          ? ['match', ['get', 'class'], allowed, true, false]
          : null;
        if (otherOn) {
          // "Other" = any class not claimed by a named group, so unfamiliar
          // classes in other cities stay visible instead of vanishing silently.
          var unknown = ['!', ['match', ['get', 'class'], POI_KNOWN_CLASSES, true, false]];
          test = test ? ['any', test, unknown] : unknown;
        }
        return test;
      }

      function refreshPoiTypesNote() {
        var groups = Object.keys(POI_TYPE_GROUPS).concat(['other']);
        var on = groups.filter(poiTypeEnabled).length;
        var note = $('poiTypesNote');
        if (!note) return;
        var all = on === groups.length;
        note.textContent = all ? 'all' : (on === 0 ? 'none' : on + ' of ' + groups.length);
        note.classList.toggle('filtered', !all);
      }

      var POI_RANK_CEILING = {
        1: 3,
        2: 6,
        3: 10,
        4: 20,
        5: 50,
        6: Infinity
      };
      var POI_LEVEL_NAME = {
        1: '1 · Landmarks only', 2: '2 · Major', 3: '3 · Common',
        4: '4 · Detailed', 5: '5 · Very detailed', 6: '6 · Everything'
      };
      // Label control is per-CATEGORY, not a single importance ladder.
      //
      // The old "Countries -> Towns -> Streets" ladder ordered layers by their
      // native minzoom, which mixes place names, water names and road names
      // into one axis and gives no way to say "street names but not paths".
      // Road names are what matters on a paper map, so each road class gets its
      // own switch. `highway-name-major` covers trunk/primary/secondary/tertiary
      // in ONE layer, so the split is done by rewriting its class filter.
      //
      // Every enabled layer is forced to minzoom 0, so a choice holds at any
      // zoom — but only down to z14. Below that OpenMapTiles omits minor road
      // names from the tiles entirely (measured over this area: 438 named roads
      // in the z14 tile, 17 at z13, 14 at z12), so nothing can reveal them and
      // the controls are marked unavailable instead of lying.
      var LABEL_DATA_MIN_ZOOM = 14;

      var LABEL_CATEGORIES = {
        major:     { layers: ['highway-name-major'], classes: ['trunk', 'primary'] },
        secondary: { layers: ['highway-name-major'], classes: ['secondary', 'tertiary'] },
        minor:     { layers: ['highway-name-minor'], classes: ['minor'] },
        path:      { layers: ['highway-name-path', 'highway-name-minor'], classes: ['path', 'service', 'track'] },
        place:     { layers: ['label_other', 'label_village', 'label_town', 'label_state',
                              'label_city', 'label_city_capital', 'label_country_1',
                              'label_country_2', 'label_country_3', 'airport'] },
        water:     { layers: ['water_name_point_label', 'water_name_line_label',
                              'waterway_line_label'] }
      };

      function labelCatEnabled(name) {
        var input = document.querySelector('#labelCats input[data-cat="' + name + '"]');
        return !!(input && input.checked);
      }

      // ---- label packing -------------------------------------------------
      // Even where data exists, MapLibre culls colliding labels using its
      // defaults: text-padding 2px, symbol-spacing 250px (line labels repeat
      // only every 250px), and text-optional false (a POI is dropped entirely
      // when its text will not fit, taking the icon with it). Relaxing these
      // recovers labels the tiles already contain.
      //
      // This does NOT help below z14, where the tiles simply lack minor road
      // names and non-transit POIs — nothing on the client can invent those.
      // `shrink` is the multiplier applied to text and icon size at LOW zoom.
      //
      // This is the lever that actually recovers POIs when zooming out.
      // Liberty pins text-size to a constant 12px, so as the map zooms out the
      // label keeps its pixel size while the world shrinks beneath it: at z17 a
      // ~120px label covers 94 m of ground, at z16 it covers 189 m, at z15
      // 377 m. Twice the footprint each step means twice the collisions, and
      // MapLibre drops whatever loses. Padding and spacing (below) only trim
      // the margins around a label — shrinking the label itself is what buys
      // back real space.
      // A label's collision box scales with BOTH its width and height, so the
      // area it claims goes as shrink^2 — 0.70 text is roughly half the
      // footprint. These values are chosen to make a visible difference at
      // z15-16 while staying legible in print at the smallest step.
      var LABEL_PACKING = [
        { name: 'Normal',  padding: null, spacing: null, optional: false, shrink: 1.00 },
        { name: 'Tight',   padding: 1,    spacing: 200,  optional: true,  shrink: 0.88 },
        { name: 'Tighter', padding: 0,    spacing: 150,  optional: true,  shrink: 0.78 },
        { name: 'Max',     padding: 0,    spacing: 100,  optional: true,  shrink: 0.68 }
      ];

      // Full size when zoomed right in, full shrink by z16 — the crowding shows
      // up immediately on the first step out, so the ramp has to be short to be
      // any use there. Below z16 it simply stays at the shrunken size.
      var SHRINK_ZOOM_START = 17.5; // at/above this zoom: unchanged
      var SHRINK_ZOOM_END = 16;     // at/below this zoom: full shrink

      // Wrap a size value (a number, or an existing zoom expression) so it is
      // scaled by `factor` below SHRINK_ZOOM_START and left alone above it.
      function shrinkBySize(value, factor) {
        if (value === undefined || value === null || factor >= 1) return value;
        return ['interpolate', ['linear'], ['zoom'],
          SHRINK_ZOOM_END, ['*', value, factor],
          SHRINK_ZOOM_START, value
        ];
      }

      function currentPacking() {
        return LABEL_PACKING[Number($('labelDensity').value)] || LABEL_PACKING[0];
      }

      // symbol-spacing only affects line-placed labels; setting it on a point
      // layer is ignored, but the placement can itself be a zoom expression
      // (the highway shields), so treat anything non-'point' as line-capable.
      function isLinePlaced(placement) {
        if (placement === undefined || placement === null) return false;
        if (typeof placement === 'string') return placement !== 'point';
        return true;                       // expression -> may become 'line'
      }

      function applyPackingTo(target, layerId, base) {
        var packing = currentPacking();
        function set(prop, value) {
          try { target.setLayoutProperty(layerId, prop, value); } catch (_e) {}
        }
        // null restores the layer's own value (or the spec default).
        set('text-padding', packing.padding === null ? base.textPadding : packing.padding);
        set('text-optional', packing.optional ? true : base.textOptional);
        if (isLinePlaced(base.placement)) {
          set('symbol-spacing', packing.spacing === null ? base.symbolSpacing : packing.spacing);
        }
        // Scale the label itself down as the map zooms out. Applied from the
        // captured stock value, so returning to Normal restores it exactly.
        if (base.textSize !== undefined) {
          set('text-size', shrinkBySize(base.textSize, packing.shrink));
        }
        if (base.iconSize !== undefined) {
          set('icon-size', shrinkBySize(base.iconSize, packing.shrink));
        }
      }

      // MapLibre's overlap switches are boolean; the continuous control it
      // exposes is collision padding. The switches decide whether icons and
      // labels may ignore collisions, while the slider controls the extra space
      // around the icon collision box when collision detection remains active.
      function applyPoiOverlap(target, layerId, base) {
        var overlapOn = $('poiOverlapOn').checked;
        var labelsToo = overlapOn && $('poiOverlapLabels').checked;
        var buffer = Number($('poiCollisionDistance').value);
        function set(prop, value) {
          try { target.setLayoutProperty(layerId, prop, value); } catch (_e) {}
        }
        function stock(value) {
          return value === undefined ? null : value;
        }

        set('icon-padding', buffer);
        // POI names retain the style's normal collision padding; text-optional
        // below allows an icon to survive without its label.
        set('text-padding', stock(base.textPadding));
        // Liberty's default couples each icon to its text: if a long shop name
        // collides, MapLibre drops the icon as well. Keep text optional in every
        // mode so collision avoidance judges icons by their own small boxes.
        // This is what prevents distant-looking POIs from disappearing merely
        // because their invisible label boxes overlap.
        set('text-optional', true);
        if (!overlapOn) {
          // POIs are split across several style layers. A label accepted in an
          // earlier layer must not reserve a large box that suppresses icons in
          // later layers. Each label still checks existing collisions before it
          // draws; text-optional lets its icon survive independently.
          set('text-ignore-placement', true);
          set('icon-allow-overlap', stock(base.iconAllowOverlap));
          set('icon-ignore-placement', stock(base.iconIgnorePlacement));
          set('text-allow-overlap', stock(base.textAllowOverlap));
          return;
        }

        set('icon-allow-overlap', true);
        set('icon-ignore-placement', true);
        if (!labelsToo) {
          // Icons bypass collisions, but labels return to the style's normal
          // collision behavior unless the user explicitly includes them.

          set('text-ignore-placement', stock(base.textIgnorePlacement));

        }

        set('text-allow-overlap', true);
        set('text-ignore-placement', true);
      }

      // Labels the results basemap owns. applyDetailLevels() hides every
      // symbol layer it cannot place in a category, which would blank exactly
      // the landmarks this view is built around, so they are exempted by name.

      // matched on the generator's own metadata so every rank goes at once and
      // a future rank cannot quietly reappear; the id list is for the transit
      // layers, which carry no category tag.
      var PAGE_HIDDEN_POI_CATEGORIES = ['health'];
      var PAGE_HIDDEN_POI_LAYERS = [
        'transit_metro_station', 'transit_metro_entrance', 'transit_bus'
      ];

      function pageHidesPoiLayer(layer) {
        if (PAGE_HIDDEN_POI_LAYERS.indexOf(layer.id) >= 0) return true;
        var category = (layer.metadata || {})['paper:poi-category'];
        return PAGE_HIDDEN_POI_CATEGORIES.indexOf(category) >= 0;
      }

      // (`rank >= N`); null when the filter has no lower bound.

          for (var i = 1; i < filter.length; i++) {

            if (found !== null) return found;
          }
          return null;
        }
        var getsRank = Array.isArray(filter[1]) && filter[1][0] === 'get' && filter[1][1] === 'rank';
        return filter[0] === '>=' && getsRank && Number.isFinite(filter[2]) ? filter[2] : null;
      }

      // What both renderers need to know about a POI layer, read off the
      // pristine style.
      function poiLayerFacts(layer) {
        var meta = layer.metadata || {};
        return {
          filter: layer.filter ? JSON.parse(JSON.stringify(layer.filter)) : null,
          category: meta['paper:poi-category'] || '',
          bucket: meta['paper:poi-rank-level'] || '',
          // The style's own visibility. The generator publishes its POI
          // buckets with the detailed/everything ranks switched off.
          styleOff: (layer.layout || {}).visibility === 'none',
          // This page's own subtraction on top: metro, bus and health markers
          // blanket the view here and the sheets being digitised do not need
          // them, while the generator still prints them.
          pageHidden: pageHidesPoiLayer(layer)

      }

      // Categories the style shows at least one bucket of. One the generator
      // switched off entirely stays off here at every level.

        layers.forEach(function (layer) {
          var meta = layer.metadata || {};
          if (layer['source-layer'] !== 'poi' || !meta['paper:poi-rank-level']) return;
          if ((layer.layout || {}).visibility !== 'none') on[meta['paper:poi-category']] = true;
        });
        return on;
      }

      // The filter one POI layer draws with at the current level, or false to
      // hide it.
      //
      // Each generator bucket keeps its OWN rank band and the level's ceiling
      // is added on top. Swapping the band for the ceiling made every visible
      // bucket repeat every rank up to it: each POI drawn once per bucket, plus
      // ranks the printed sheet never had. A bucket the style switched off
      // comes back only once the level reaches into its band, so the default
      // level shows exactly the sheet's POIs.
      function poiLayerFilter(facts, ceiling, classes, categoriesOn) {
        if (facts.pageHidden) return false;
        var next;
        if (facts.bucket) {
          if (facts.styleOff) {
            var floor = bucketMinRank(facts.filter);
            if (floor === null || floor > ceiling || !categoriesOn[facts.category]) return false;

        }

        return next;
      }

      // Road names collide, as they do on the map generator (its default "hide"
      // road mode). The style lets minor names skip collision altogether, which
      // laid them across one another and across POIs. Where two names contest
      // a spot, the less important road gives way.
      var ROAD_CLASS_RANK = ['match', ['get', 'class'],
        ['motorway', 'trunk'], 0, 'primary', 1, 'secondary', 2, 'tertiary', 3,

      function applyRoadNameCollision(target, layerId) {
        function set(prop, value) {
