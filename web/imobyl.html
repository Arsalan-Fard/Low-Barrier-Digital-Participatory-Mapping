      // Hand-drawn paths must be tallied for the same reason hand-placed
      // stickers are: renderKindLegend rebuilds enabledKinds from these counts,
      // and paintReference will not draw a kind that is not enabled. Leaving
      // strokes out made every hand-drawn line invisible unless a scanned photo
      // happened to have detected a path of its own.
      function manualStrokeTally() {
        var tally = [];
        references.forEach(function (reference) {
          if (!reference.visible || !reference.manual) return;
          reference.manual.strokes.forEach(function (stroke) { tally.push(stroke); });
        });
        return tally;
      }

      function refreshLegends() {
        var shown = visibleResults();
        var counts = {};
        var colorById = {};
        var stickerById = {};
        manualStrokeTally().forEach(function (_stroke) {
          counts.line = (counts.line || 0) + 1;
        });
        manualStickerTally().forEach(function (marker) {
          counts.sticker = (counts.sticker || 0) + 1;
          var running = stickerById[marker.colorClass];
          if (!running) {
            stickerById[marker.colorClass] = {
              id: marker.colorClass, label: marker.colorLabel, color: marker.color,
              count: 1, circle: marker.shape === 'circle' ? 1 : 0,
              triangle: marker.shape === 'triangle' ? 1 : 0
            };
          } else {
            running.count += 1;
            running[marker.shape] = (running[marker.shape] || 0) + 1;
          }
        });
        shown.forEach(function (result) {
          Object.keys(KIND_LABELS).forEach(function (kind) {
            counts[kind] = (counts[kind] || 0) + Number((result.counts || {})[kind] || 0);
          });
          (result.colors || []).forEach(function (item) { colorById[item.id] = item; });
          (result.stickerColors || []).forEach(function (item) {
            var running = stickerById[item.id];
            if (!running) {
              stickerById[item.id] = {
                id: item.id, label: item.label, color: item.color,
                count: item.count, circle: item.circle || 0, triangle: item.triangle || 0
              };
            } else {
              running.count += item.count;
              running.circle += item.circle || 0;
              running.triangle += item.triangle || 0;
            }
          });
        });
        renderStickerColorLegend(
          Object.keys(colorById).map(function (k) { return colorById[k]; }),
          Object.keys(stickerById).map(function (k) { return stickerById[k]; })
        );
        renderKindLegend(counts);
        // A scene states what belongs on screen, and rebuilding the legend must
        // not overrule it. Drawing calls through here on pointer-down and again
        // on pointer-up, and without this the map fell back to showing every
        // kind -- the raw view -- in the middle of a scene.
        if (previzRunning() && PREVIZ_SCENES[previzIndex]) {
          applySceneKinds(PREVIZ_SCENES[previzIndex].kinds);
        }
        return counts;
      }

      function aggregateStatus() {
        var shown = visibleResults();
        if (!shown.length && !manualStickerTally().length) {
          return 'Nothing shown — load a reference and drop a photo.';
        }
        var counts = {};
        var ink = 0, unrefined = 0;
        shown.forEach(function (result) {
          ink += result.inkPixels;
          if (!result.eccRefined) unrefined += 1;
          Object.keys(KIND_LABELS).forEach(function (kind) {
            counts[kind] = (counts[kind] || 0) + Number((result.counts || {})[kind] || 0);
          });
        });
        if (!ink && !manualStickerTally().length) {
          return 'No drawing found — lower the difference threshold.';
        }
        var summary = Object.keys(KIND_LABELS).filter(function (kind) {
          return counts[kind] > 0;
        }).map(function (kind) {
          var total = counts[kind];
          return total + ' ' + (total === 1 ? KIND_LABELS[kind].one : KIND_LABELS[kind].many);
        }).join(', ');
        var byHand = manualStickerTally().length;
        var strokes = references.reduce(function (total, reference) {
          return total + (reference.visible && reference.manual ? reference.manual.strokes.length : 0);
        }, 0);
        return (summary || 'Drawing isolated from the saved clean map') + ' ✓' +
          (shown.length > 1 ? ' · ' + shown.length + ' photos' : '') +
          (byHand || strokes ? ' · ' + (byHand + strokes) + ' by hand' : '') +
          (unrefined ? ' · ' + unrefined + ' not refined' : '');
      }
      var enabledKinds = new Set();
      var classCanvas = document.createElement('canvas');

      // Older backend responses contain an alpha-only mask. Keep the former red
      // rendering as a compatibility fallback; current responses carry the
      // colour-segmented pixels directly.
      var INK_COLOR = '#d3302f';
      var INK_OPACITY = 0.95;

      var thresholdInput = $('threshold');
      thresholdInput.addEventListener('input', function () {
        $('thresholdVal').textContent = thresholdInput.value;
        if (projected) {
          window.clearTimeout(thresholdTimer);
          thresholdTimer = window.setTimeout(function () { reprocessAll(); }, 180);
        }
      });

      function refreshExportBtn() {
        $('exportGeojsonBtn').disabled =
          !(projected && mapCorners.length === 4 && paperCorners.length === 4);
      }

      // Composite from the class mask: every pixel knows its kind and its
      // colour class, so both filters apply exactly. The mask is read at its
      // own resolution with smoothing off — interpolating it would blend the
      // kind and colour codes into meaningless in-between values — and only the
      // finished picture is scaled down onto the overlay canvas.
      // Draw one reference sheet onto its own canvas. Its photos are filtered
      // individually and then laid over one another — whichever photo saw a
      // given pixel first keeps it, so two scans of the same sheet reinforce
      // rather than erase each other.
      // ==================== arrondissement outlines ======================
      // District outlines as a real map layer rather than ink on the sheet
      // canvas: they stay crisp at every zoom, cover the whole view instead
      // of stopping at the paper's edge, and survive a basemap swap through
      // the same style.load hook the other overlays use. Geometry is the
      // relation members' ways, not assembled polygons -- an outline is all
      // that is drawn, and stitching rings is a pile of edge cases for no
      // visible gain.
      var ARR_SOURCE_ID = 'arrondissement-src';
      var ARR_LINE_ID = 'arrondissement-line';
      var ARR_LABEL_ID = 'arrondissement-label';
      var arrondissementOn = false;
      var arrondissementData = null;

      function removeArrondissements() {
        [ARR_LABEL_ID, ARR_LINE_ID].forEach(function (id) {
          try { if (map.getLayer(id)) map.removeLayer(id); } catch (_e) {}
        });
        try { if (map.getSource(ARR_SOURCE_ID)) map.removeSource(ARR_SOURCE_ID); } catch (_e) {}
      }

      function drawArrondissements() {
        if (!arrondissementOn || !arrondissementData) return;
        if (!map.isStyleLoaded()) return;
        try {
          var source = map.getSource(ARR_SOURCE_ID);
          if (source) {
            source.setData(arrondissementData);
          } else {
            map.addSource(ARR_SOURCE_ID, { type: 'geojson', data: arrondissementData });
          }
          if (!map.getLayer(ARR_LINE_ID)) {
            map.addLayer({
              id: ARR_LINE_ID,
              type: 'line',
              source: ARR_SOURCE_ID,
              filter: ['==', ['geometry-type'], 'LineString'],
              paint: {
                'line-color': '#7a3f9d',
                'line-width': 2,
                'line-opacity': 0.75,
                'line-dasharray': [3, 2]
              }
            });
          }
          if (!map.getLayer(ARR_LABEL_ID)) {
            map.addLayer({
              id: ARR_LABEL_ID,
              type: 'symbol',
              source: ARR_SOURCE_ID,
              filter: ['==', ['geometry-type'], 'Point'],
              layout: {
                'text-field': ['get', 'label'],
                'text-font': ['Noto Sans Bold'],
                'text-size': 16,
                'text-allow-overlap': true
              },
              paint: {
                'text-color': '#7a3f9d',
                'text-halo-color': '#ffffff',
                'text-halo-width': 2
              }
            });
          }
        } catch (_error) {
          // Mid style-swap; the style.load hook below retries.
        }
      }

      function fetchArrondissements() {
        // The whole current view, not just the sheet: the point of the
        // outlines is to place the drawn region in the wider city.
        var bounds = map.getBounds();
        var pad = 0.02;
        var bbox = (bounds.getSouth() - pad) + ',' + (bounds.getWest() - pad) + ','
          + (bounds.getNorth() + pad) + ',' + (bounds.getEast() + pad);
        return fetch('/api/boundaries?bbox=' + encodeURIComponent(bbox) + '&level=9')
          .then(function (response) { return response.json(); })
          .then(function (data) {
            if (!data.ok || !data.areas || !data.areas.length) {
              throw new Error(data.error || 'no boundaries here');
            }
            var features = [];
            data.areas.forEach(function (area) {
              // "20" alone reads as anything; "20e arr." names it.
              var ordinal = /^\d+$/.test(area.label)
                ? (area.label === '1' ? '1er' : area.label + 'e') + ' arr.'
                : area.label;
              area.lines.forEach(function (line) {
                features.push({
                  type: 'Feature',
                  properties: { label: ordinal, name: area.name },
                  geometry: { type: 'LineString', coordinates: line }
                });
              });
              features.push({
                type: 'Feature',
                properties: { label: ordinal, name: area.name },
                geometry: { type: 'Point', coordinates: area.centre }
              });
            });
            return { type: 'FeatureCollection', features: features };
          });
      }

      $('arrondissementBtn').addEventListener('click', function () {
        var button = this;
        if (arrondissementOn) {
          arrondissementOn = false;
          button.classList.remove('is-active');
          removeArrondissements();
          setStatus($('arrondissementStatus'), '');
          return;
        }
        button.disabled = true;
        setStatus($('arrondissementStatus'), 'Loading…');
        fetchArrondissements().then(function (geojson) {
          arrondissementData = geojson;
          arrondissementOn = true;
          button.classList.add('is-active');
          drawArrondissements();
          var count = geojson.features.filter(function (f) {
            return f.geometry.type === 'Point';
          }).length;
          setStatus($('arrondissementStatus'), count + ' shown', 'ok');
        }).catch(function (error) {
          setStatus($('arrondissementStatus'),
            error.message || 'Could not load boundaries.', 'err');
        }).then(function () {
          button.disabled = false;
        });
      });

      // ==================== path visualization modes ====================
      // Flow width reads the trips as a line heatmap turned into width: the
      // more trips share a corridor cell, the fatter (and firmer) the line
      // through it. On top of the static ribbons, rare glowing pulses run
      // along randomly chosen trips -- roughly ten alive at a time -- so the
      // aggregate keeps a sense of movement without the old marching-ants
      // clutter (dashes on every trip, since removed, as were bundling and a
      // density heatmap). Clicking the active button returns to plain lines.
      // "Snap to streets" is a modifier that works under any mode. Colours
      // never mix: walking (red) and cycling (black) are counted and blurred
      // separately, or the aggregate would invent corridors no one drew.
      var pathVizMode = 'classic';
      var pulseTimer = 0;
      var pulseLast = 0;
      // Display-only multiplier on every drawn line, whatever the mode. The
      // stored stroke widths (and exports) are untouched.
      var pathWidthScale = 1;
      var pathWidthTimer = 0;

      // Every visible trip on this sheet as {points, color, width}, hand-drawn
      // strokes and detected photo paths alike, honouring the kind toggle.
      // Cycling is drawn in black on paper because that is the pen the
      // workshop hands out, but black against a grey basemap reads as "not
      // data". It is shown in blue instead; the stored strokes and every
      // export keep the pen colour, and the scene filters below match on
      // sourceColor so the mapping never changes what is being selected.
      var PATH_DISPLAY_COLOR = { '#252525': '#2f6fd0' };

      function displayPathColor(color) {
        return PATH_DISPLAY_COLOR[color] || color;
      }

      function collectVizPaths(reference, ignoreSceneFilter) {
        var out = [];
        if (!enabledKinds.has('line')) return out;
        // The scene filter is a display rule; the scene's own analysis passes
        // ignoreSceneFilter so it still measures against the full data.
        var filter = ignoreSceneFilter ? null : previzFilter;
        if (filter && !filter.paths) return out;
        var manual = reference.manual;
        if (manual) {
          manual.strokes.forEach(function (stroke, index) {
            if (stroke.points.length < 2) return;
            out.push({ id: reference.id + '#m' + index,
              points: stroke.points, color: displayPathColor(stroke.color),
              sourceColor: stroke.color, width: Number(stroke.width) || 6 });
          });
        }
        reference.photos.forEach(function (photo, photoIndex) {
          if (!photo.result) return;
          (photo.result.paths || []).forEach(function (path, pathIndex) {
            var points = path.points || [];
            if (points.length < 2) return;
            out.push({ id: reference.id + '#p' + photoIndex + ':' + pathIndex,
              points: points, color: displayPathColor(path.color || '#252525'),
              sourceColor: path.color || '#252525',
              width: Math.max(2.5, (path.widthPx || 6) * 0.85) });
          });
        });
        // Snap the whole sheet first, then filter. The snap cache holds one
        // result per sheet, keyed on the set it was handed, so filtering first
        // would re-snap every stroke each time a scene narrows the selection.
        if (snapToStreets) out = snappedVizPaths(reference, out);
        if (filter && filter.colour) {
          out = out.filter(function (path) {
            return (path.sourceColor || path.color) === filter.colour;
          });
        }
        // Chosen trips are matched by id, never by their point array: snapping
        // replaces those arrays, so a set built from them before the snap
        // would match nothing after it and the scene would draw empty.
        if (filter && filter.pathSet) {
          out = out.filter(function (path) { return filter.pathSet.has(path.id); });
        }
        // A scene that names a stretch of street draws that stretch, not the
        // whole of every trip that happens to touch it. The bundle belongs to
        // one sheet, so the others contribute nothing to it.
        if (filter && filter.clip) {
          out = filter.clip.referenceId === reference.id
            ? clipVizPaths(out, filter.clip)
            : [];
        }
        return out;
      }

      // Only the parts of a trip that run inside the given cells. A trip that
      // crosses the corridor twice comes back as two pieces, so the ink draws
      // the shared street rather than the whole journey either side of it.
      function clipPolylineToCells(points, clip) {
        var size = clip.cell, runs = [], current = null, previous = null;

        function visit(point) {
          var key = Math.floor(point[1] / size) * clip.cols + Math.floor(point[0] / size);
          if (clip.cells.has(key)) {
            if (!current) {
              // Start one step back, so the piece reaches the near edge of the
              // cell rather than beginning inside it.
              current = previous ? [previous] : [];
              runs.push(current);
            }
            current.push(point);
          } else if (current) {
            current.push(point);            // and one step past the far edge
            current = null;
          }
          previous = point;
        }

        for (var i = 0; i < points.length; i += 1) {
          visit(points[i]);
          if (i === points.length - 1) break;
          // Vertices can sit far apart -- a snapped stroke runs corner to
          // corner -- so long segments are walked at the resolution the cells
          // were counted at. Testing vertices alone would miss a corridor
          // crossed cleanly between two of them.
          var ax = points[i][0], ay = points[i][1];
          var bx = points[i + 1][0], by = points[i + 1][1];
          var steps = Math.floor(Math.hypot(bx - ax, by - ay) / (size * 0.5));
          for (var step = 1; step <= steps; step += 1) {
            var t = step / (steps + 1);
            visit([ax + (bx - ax) * t, ay + (by - ay) * t]);
          }
        }
        return runs.filter(function (run) { return run.length >= 2; });
      }

      function clipVizPaths(paths, clip) {
        var out = [];
        paths.forEach(function (path) {
          clipPolylineToCells(path.points, clip).forEach(function (run, index) {
            out.push({ id: path.id + '/' + index, points: run, color: path.color,
              sourceColor: path.sourceColor, width: path.width });
          });
        });
        return out;
      }

      function groupVizPaths(paths) {
        var groups = {};
        paths.forEach(function (path) {
          (groups[path.color] = groups[path.color] || []).push(path);
        });
        return groups;
      }

      function resamplePolyline(points, step) {
        var out = [[points[0][0], points[0][1]]];
        var travelled = 0, next = step;
        for (var i = 1; i < points.length; i += 1) {
          var ax = points[i - 1][0], ay = points[i - 1][1];
          var bx = points[i][0], by = points[i][1];
          var seg = Math.hypot(bx - ax, by - ay);
          while (seg > 0 && next <= travelled + seg) {
            var t = (next - travelled) / seg;
            out.push([ax + (bx - ax) * t, ay + (by - ay) * t]);
            next += step;
          }
          travelled += seg;
        }
        out.push([points[points.length - 1][0], points[points.length - 1][1]]);
        return out;
      }

      function blurGrid(grid, cols, rows) {
        var out = new Float32Array(cols * rows);
        for (var y = 0; y < rows; y += 1) {
          for (var x = 0; x < cols; x += 1) {
            var total = 0, n = 0;
            for (var yy = Math.max(0, y - 1); yy <= Math.min(rows - 1, y + 1); yy += 1) {
              for (var xx = Math.max(0, x - 1); xx <= Math.min(cols - 1, x + 1); xx += 1) {
                total += grid[yy * cols + xx]; n += 1;
              }
            }
            out[y * cols + x] = total / n;
          }
        }
        return out;
      }

      // The busiest corridor on this sheet. Flow width and opacity are read
      // against it, so two trips fill the ribbon as convincingly as sixty do:
      // the map answers "where did THESE people go", not "how many were there".
      function gridMax(grid) {
        var top = 0;
        for (var i = 0; i < grid.length; i += 1) if (grid[i] > top) top = grid[i];
        return top;
      }

      // Absolute counts made the width a headcount: a two-person sheet drew
      // 1.4 + 2.6*sqrt(1.6) ~ 4.7px at its busiest and read as an empty map,
      // while the sixty-person simulation reached ~13px. Normalising against
      // this sheet's own maximum keeps the low end where it was (a single-trip
      // cell in a busy field lands within 0.2px of the old formula) and lifts
      // every sheet's busiest corridor to the same weight.
      var FLOW_MIN_W = 1.6;          // a corridor only one trip used
      var FLOW_SPAN_W = 11.4;        // added at the sheet's busiest corridor
      var FLOW_FLOOR = 0.4;          // counts below this read as no corridor

      function flowWidthFor(count, top) {
        var span = Math.max(1e-6, top - FLOW_FLOOR);
        var t = Math.max(0, Math.min(1, (count - FLOW_FLOOR) / span));
        // sqrt still, so the busiest corridor does not swallow the quiet ones.
        return (FLOW_MIN_W + FLOW_SPAN_W * Math.sqrt(t)) * pathWidthScale;
      }

      // Per-trip compositing alpha, chosen so the busiest corridor arrives at
      // the same near-solid colour whatever the headcount. Floored at the old
      // fixed 0.38, so anything with ~7+ trips through one corridor -- every
      // real workshop and the simulation -- keeps exactly the look it had.
      function flowAlphaFor(top) {
        return Math.max(0.38, 1 - Math.pow(0.04, 1 / Math.max(1, top)));
      }

      function sampleGrid(grid, cols, rows, gx, gy) {
        var x = Math.min(cols - 2, Math.max(0, gx));
        var y = Math.min(rows - 2, Math.max(0, gy));
        var x0 = Math.floor(x), y0 = Math.floor(y);
        var fx = x - x0, fy = y - y0;
        return grid[y0 * cols + x0] * (1 - fx) * (1 - fy)
          + grid[y0 * cols + x0 + 1] * fx * (1 - fy)
          + grid[(y0 + 1) * cols + x0] * (1 - fx) * fy
          + grid[(y0 + 1) * cols + x0 + 1] * fx * fy;
      }

      // One count per trip per corridor cell, however much it wiggles inside.
      function corridorCounts(pointLists, width, height, cell) {
        var cols = Math.ceil(width / cell) + 1;
        var rows = Math.ceil(height / cell) + 1;
        var counts = new Float32Array(cols * rows);
        pointLists.forEach(function (points) {
          var seen = {};
          resamplePolyline(points, cell * 0.5).forEach(function (pt) {
            var key = Math.floor(pt[1] / cell) * cols + Math.floor(pt[0] / cell);
            if (key >= 0 && key < counts.length && !seen[key]) {
              seen[key] = true;
              counts[key] += 1;
            }
          });
        });
        return { counts: counts, cols: cols, rows: rows, cell: cell };
      }

      function strokePolyline(context, points) {
        context.beginPath();
        context.moveTo(points[0][0], points[0][1]);
        for (var i = 1; i < points.length; i += 1) {
          context.lineTo(points[i][0], points[i][1]);
        }
        context.stroke();
      }

      function renderFlowViz(context, groups, width, height) {
        // Each trip is drawn alone, opaque, on a scratch canvas, then
        // composited translucently in one go. Stroking the short segments
        // straight onto the layer at partial alpha left a dark dot at every
        // joint where two round caps double-painted; at full alpha the caps
        // merge invisibly, and the translucency -- and its corridor build-up
        // across trips -- happens at composite time instead.
        var scratch = document.createElement('canvas');
        scratch.width = width;
        scratch.height = height;
        var sctx = scratch.getContext('2d');
        sctx.lineCap = 'round';
        sctx.lineJoin = 'round';
        Object.keys(groups).forEach(function (color) {
          var lists = groups[color].map(function (p) { return p.points; });
          var flow = corridorCounts(lists, width, height, 26);
          var counts = blurGrid(flow.counts, flow.cols, flow.rows);
          var top = gridMax(counts);
          var alpha = flowAlphaFor(top);
          sctx.strokeStyle = color;
          lists.forEach(function (points) {
            sctx.clearRect(0, 0, width, height);
            var walked = resamplePolyline(points, 13);
            for (var i = 1; i < walked.length; i += 1) {
              var mx = (walked[i - 1][0] + walked[i][0]) / 2 / flow.cell;
              var my = (walked[i - 1][1] + walked[i][1]) / 2 / flow.cell;
              var c = sampleGrid(counts, flow.cols, flow.rows, mx, my);
              sctx.lineWidth = flowWidthFor(c, top);
              sctx.beginPath();
              sctx.moveTo(walked[i - 1][0], walked[i - 1][1]);
              sctx.lineTo(walked[i][0], walked[i][1]);
              sctx.stroke();
            }
            context.globalAlpha = alpha;
            context.drawImage(scratch, 0, 0);
          });
        });
        context.globalAlpha = 1;
      }

      // ==================== snap trips to streets ====================
      // Pull every drawn trip onto the street network. Roads are fetched from
      // Overpass for each sheet's own bbox (any highway class -- street,
      // alley, cycleway, park path), projected into the sheet's pixel space,
      // and each trip is matched with a small Viterbi pass: for every
      // resampled pen point the nearest few road candidates, chosen so the
      // result stays continuous instead of teleporting between parallel
      // streets. Where consecutive points land on the same road the output
      // follows the road's real geometry rather than the pen. Display-only:
      // the stored strokes and every export keep the pen line.
      var snapToStreets = false;
      var roadPolylines = null;      // lng/lat polylines gathered from tiles
      var roadCacheVersion = 0;

      function gatherRoadPolylines() {
        var style;
        try { style = map.getStyle(); } catch (_error) { return []; }
        var sources = {};
        (style.layers || []).forEach(function (layer) {
          if (layer['source-layer'] === 'transportation'
            && typeof layer.source === 'string') {
            sources[layer.source] = true;
          }
        });
        var lines = [];
        Object.keys(sources).forEach(function (sourceId) {
          var features;
          try {
            features = map.querySourceFeatures(sourceId,
              { sourceLayer: 'transportation' });
          } catch (_error) {
            return;
          }
          features.forEach(function (feature) {
            var geometry = feature.geometry || {};
            var parts = geometry.type === 'LineString' ? [geometry.coordinates]
              : geometry.type === 'MultiLineString' ? geometry.coordinates : [];
            parts.forEach(function (coords) {
              if (coords.length > 1) lines.push(coords);
            });
          });
        });
        return lines;
      }

      // Roads in one sheet's pixel space, hashed into a grid of segments.
      function buildRoadIndex(reference) {
        var size = manualTargetSize(reference);
        var feats = [];
        (reference.roadLines || roadPolylines || []).forEach(function (coords) {
          var pts = [], anyInside = false;
          for (var i = 0; i < coords.length; i += 1) {
            var p = lngLatToSheetPixel(reference,
              { lng: coords[i][0], lat: coords[i][1] });
            if (!p) return;
            if (p.x > -80 && p.y > -80
              && p.x < size.w + 80 && p.y < size.h + 80) anyInside = true;
            pts.push([p.x, p.y]);
          }
          if (anyInside) feats.push(pts);
        });
        var cell = 36;
        var grid = {};
        feats.forEach(function (pts, fi) {
          for (var i = 1; i < pts.length; i += 1) {
            var x0 = Math.floor(Math.min(pts[i - 1][0], pts[i][0]) / cell);
            var x1 = Math.floor(Math.max(pts[i - 1][0], pts[i][0]) / cell);
            var y0 = Math.floor(Math.min(pts[i - 1][1], pts[i][1]) / cell);
            var y1 = Math.floor(Math.max(pts[i - 1][1], pts[i][1]) / cell);
            for (var gy = y0; gy <= y1; gy += 1) {
              for (var gx = x0; gx <= x1; gx += 1) {
                var key = gy + ':' + gx;
                (grid[key] = grid[key] || []).push(fi * 100000 + (i - 1));
              }
            }
          }
        });
        return { feats: feats, grid: grid, cell: cell };
      }

      // The closest projection per road feature around (x, y), nearest first.
      function roadCandidates(index, x, y, radius, limit) {
        var reach = Math.ceil(radius / index.cell);
        var cx = Math.floor(x / index.cell), cy = Math.floor(y / index.cell);
        var best = {};
        for (var gy = cy - reach; gy <= cy + reach; gy += 1) {
          for (var gx = cx - reach; gx <= cx + reach; gx += 1) {
            var bucket = index.grid[gy + ':' + gx];
            if (!bucket) continue;
            for (var k = 0; k < bucket.length; k += 1) {
              var fi = Math.floor(bucket[k] / 100000);
              var si = bucket[k] % 100000;
              var pts = index.feats[fi];
              var ax = pts[si][0], ay = pts[si][1];
              var vx = pts[si + 1][0] - ax, vy = pts[si + 1][1] - ay;
              var lenSq = vx * vx + vy * vy;
              var t = lenSq
                ? Math.max(0, Math.min(1, ((x - ax) * vx + (y - ay) * vy) / lenSq))
                : 0;
              var px = ax + vx * t, py = ay + vy * t;
              var d = Math.hypot(px - x, py - y);
              if (d > radius) continue;
              if (!best[fi] || d < best[fi].d) {
                best[fi] = { fi: fi, si: si, t: t, x: px, y: py, d: d };
              }
            }
          }
        }
        var list = Object.keys(best).map(function (key) { return best[key]; });
        list.sort(function (a, b) { return a.d - b.d; });
        return list.slice(0, limit);
      }

      // One trip onto the roads. Emission cost keeps the match near the pen,
      // the transition term keeps consecutive picks as far apart as the pen
      // moved (no teleporting), and staying on the same road is cheaper than
      // hopping -- the classic map-matching trade, in miniature.
      function snapStroke(index, points) {
        var samples = resamplePolyline(points, 12);
        var active = [];
        samples.forEach(function (pt) {
          var cands = roadCandidates(index, pt[0], pt[1], 26, 5);
          if (cands.length) active.push({ pt: pt, cands: cands });
        });
        if (active.length < 2) return null;
        active[0].cands.forEach(function (c) { c.cost = c.d; c.prev = null; });
        for (var i = 1; i < active.length; i += 1) {
          var stepLen = Math.hypot(active[i].pt[0] - active[i - 1].pt[0],
            active[i].pt[1] - active[i - 1].pt[1]);
          var previous = active[i - 1].cands;
          active[i].cands.forEach(function (c) {
            c.cost = Infinity;
            c.prev = null;
            previous.forEach(function (p) {
              var gap = Math.hypot(c.x - p.x, c.y - p.y);
              var cost = p.cost + c.d
                + Math.abs(gap - stepLen) * 1.3
                + (p.fi === c.fi ? 0 : 7);
              if (cost < c.cost) { c.cost = cost; c.prev = p; }
            });
          });
        }
        var node = active[active.length - 1].cands
          .reduce(function (a, b) { return a.cost <= b.cost ? a : b; });
        var picks = [];
        for (; node; node = node.prev) picks.unshift(node);
        var out = [[picks[0].x, picks[0].y]];
        for (var j = 1; j < picks.length; j += 1) {
          var a = picks[j - 1], b = picks[j];
          if (a.fi === b.fi) {
            // Follow the road's own vertices between the two projections.
            var pts = index.feats[a.fi];
            if (a.si < b.si) {
              for (var s = a.si + 1; s <= b.si; s += 1) out.push([pts[s][0], pts[s][1]]);
            } else if (a.si > b.si) {
              for (var s2 = a.si; s2 > b.si; s2 -= 1) out.push([pts[s2][0], pts[s2][1]]);
            }
          }
          out.push([b.x, b.y]);
        }
        var slim = [out[0]];
        for (var m = 1; m < out.length; m += 1) {
          var last = slim[slim.length - 1];
          if (Math.hypot(out[m][0] - last[0], out[m][1] - last[1]) > 1.5) {
            slim.push(out[m]);
          }
        }
        return slim.length > 1 ? slim : null;
      }

      function vizPathsSignature(paths) {
        return paths.length + '|' + paths.reduce(function (sum, path) {
          var a = path.points[0], z = path.points[path.points.length - 1];
          return sum + path.points.length + a[0] + a[1] + z[0] + z[1];
        }, 0).toFixed(1);
      }

      // A trip with no road within reach keeps its pen line -- better an
      // honest scribble than a match invented out of range.
      function snappedVizPaths(reference, paths) {
        var key = roadCacheVersion + '|' + vizPathsSignature(paths);
        if (reference.snapCache && reference.snapCache.key === key) {
          return reference.snapCache.paths;
        }
        var roads = reference.roadLines || roadPolylines;
        if (!roads || !roads.length) return paths;
        var index = buildRoadIndex(reference);
        var snappedCount = 0;
        var out = paths.map(function (path) {
          var snapped = snapStroke(index, path.points);
          if (!snapped) return path;
          snappedCount += 1;
          return { id: path.id, points: snapped, color: path.color,
            sourceColor: path.sourceColor, width: path.width };
        });
        reference.snapCache = { key: key, paths: out,
          stats: { snapped: snappedCount, total: paths.length } };
        return out;
      }

      function renderPlainViz(context, groups) {
        context.lineCap = 'round';
        context.lineJoin = 'round';
        Object.keys(groups).forEach(function (color) {
          groups[color].forEach(function (path) {
            var width = path.width * pathWidthScale;
            context.strokeStyle = 'rgba(255,255,255,0.85)';
            context.lineWidth = width + 2.5;
            strokePolyline(context, path.points);
            context.strokeStyle = color;
            context.lineWidth = width;
            strokePolyline(context, path.points);
          });
        });
      }

      // Roads for one sheet come from Overpass, for the sheet's own bounding
      // box: every mapped way with a highway tag except things that do not
      // exist yet (construction/proposed) and sidewalk/crossing fragments,
      // which duplicate the street they run beside and would shred the match
      // into kerb-hopping. Fetched once per sheet and kept; the earlier
      // approach of harvesting the vector basemap's loaded tiles only covered
      // whatever happened to be on screen -- and the raster OSM theme has no
      // vector roads at all -- which left most trips silently unsnapped. The
      // tile harvest survives only as an offline fallback.
      var OVERPASS_ENDPOINTS = [
        'https://overpass-api.de/api/interpreter',
        'https://overpass.kumi.systems/api/interpreter'
      ];
      var roadFetchCache = {};   // corners key -> Promise of lng/lat polylines

      function fetchRoadsForCorners(corners) {
        var key = corners.map(function (c) { return c.join(','); }).join(';');
        if (roadFetchCache[key]) return roadFetchCache[key];
        var lats = corners.map(function (c) { return c[1]; });
        var lngs = corners.map(function (c) { return c[0]; });
        // ~100 m of margin so trips at the paper's edge still find their road.
        var bbox = (Math.min.apply(null, lats) - 0.001) + ','
          + (Math.min.apply(null, lngs) - 0.0015) + ','
          + (Math.max.apply(null, lats) + 0.001) + ','
          + (Math.max.apply(null, lngs) + 0.0015);
        var query = '[out:json][timeout:25];'
          + 'way["highway"]["highway"!~"construction|proposed|razed"]'
          + '["footway"!~"sidewalk|crossing"](' + bbox + ');out skel geom;';
        // Same-origin proxy first: the server retries Overpass mirrors and
        // keeps a disk cache, so this is fast and survives flaky endpoints.
        // Direct Overpass remains the fallback for a server without internet.
        var viaProxy = function () {
          return fetch('/api/roads?bbox=' + encodeURIComponent(bbox))
            .then(function (response) { return response.json(); })
            .then(function (data) {
              if (!data.ok || !data.lines || !data.lines.length) {
                throw new Error(data.error || 'no roads');
              }
              return data.lines;
            });
        };
        var attempt = function (endpointIndex, retriesLeft) {
          return fetch(OVERPASS_ENDPOINTS[endpointIndex], {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'data=' + encodeURIComponent(query)
          }).then(function (response) {
            if (!response.ok) throw new Error('overpass ' + response.status);
            return response.json();
          }).then(function (data) {
            var lines = [];
            (data.elements || []).forEach(function (element) {
              if (element.type !== 'way' || !element.geometry) return;
              if (element.geometry.length < 2) return;
              lines.push(element.geometry.map(function (node) {
                return [node.lon, node.lat];
              }));
            });
            if (!lines.length) throw new Error('overpass returned no roads');
            return lines;
          }).catch(function (error) {
            // The public endpoints intermittently return empty bodies; one
            // retry per endpoint before moving to the next mirror.
            if (retriesLeft > 0) return attempt(endpointIndex, retriesLeft - 1);
            if (endpointIndex + 1 < OVERPASS_ENDPOINTS.length) {
              return attempt(endpointIndex + 1, 1);
            }
            throw error;
          });
        };
        var promise = viaProxy()
          .catch(function () { return attempt(0, 1); })
          .catch(function (error) {
            delete roadFetchCache[key];   // a failure must not poison the cache
            throw error;
          });
        roadFetchCache[key] = promise;
        return promise;
      }

      $('snapStreetsBtn').addEventListener('click', function () {
        var button = this;
        if (snapToStreets) {
          snapToStreets = false;
          button.classList.remove('is-active');
          references.forEach(function (reference) { reference.vizCache = null; });
          references.forEach(paintReference);
          setStatus($('inkStatus'), aggregateStatus());
          return;
        }
        if (!references.length) {
          setStatus($('inkStatus'), 'Load a session or reference map first.', 'err');
          return;
        }
        button.disabled = true;
        setStatus($('inkStatus'), 'Fetching the street network…');
        var pending = references.filter(function (r) { return !r.roadLines; });
        Promise.all(pending.map(function (reference) {
          return fetchRoadsForCorners(reference.corners).then(function (lines) {
            reference.roadLines = lines;
          });
        })).catch(function () {
          // Offline or Overpass down: whatever vector tiles are loaded is
          // better than nothing, and honest about it in the status below.
          roadPolylines = gatherRoadPolylines();
        }).then(function () {
          button.disabled = false;
          var covered = references.some(function (r) {
            return (r.roadLines && r.roadLines.length)
              || (roadPolylines && roadPolylines.length);
          });
          if (!covered) {
            setStatus($('inkStatus'),
              'Could not get street data (Overpass unreachable and no vector '
              + 'tiles loaded). Try again in a moment.', 'err');
            return;
          }
          roadCacheVersion += 1;
          snapToStreets = true;
          button.classList.add('is-active');
          references.forEach(function (reference) {
            reference.snapCache = null;
            reference.vizCache = null;
          });
          references.forEach(paintReference);
          var snapped = 0, total = 0;
          references.forEach(function (reference) {
            var stats = reference.snapCache && reference.snapCache.stats;
            if (stats) { snapped += stats.snapped; total += stats.total; }
          });
          setStatus($('inkStatus'),
            'Snapped ' + snapped + ' of ' + total + ' trips to the street '
            + 'network.', snapped ? 'ok' : 'err');
        });
      });

      // ---- how far the group's city reaches -----------------------------
      // A utilisation distribution, the home-range measure: spread every
      // drawn trip into a density field, sort the cells by density, and take
      // them from the busiest down until a given share of the total drawn
      // length is accounted for. The result is the SMALLEST area holding that
      // share -- "50% of everything drawn happens in here" -- which is what
      // makes it a statement about reach rather than a prettier heatmap.
      //
      // Bands are nested by construction (50% is inside 70% is inside 90%),
      // so the outer edge is where the participants' city ends and the inner
      // core is the ground they actually cover day to day.
      //
      // Walking and cycling are pooled here on purpose: the question is how
      // far this group's world extends, not which mode took them there.
      var REGION_BANDS = [
        { share: 0.90, fill: 'rgba(47,143,134,0.13)', line: 'rgba(47,143,134,0.55)' },
        { share: 0.70, fill: 'rgba(47,143,134,0.15)', line: 'rgba(47,143,134,0.70)' },
        { share: 0.50, fill: 'rgba(214,109,45,0.18)', line: 'rgba(214,109,45,0.85)' }
      ];
      var REGION_CELL = 10;      // density resolution, in sheet pixels
      var REGION_BLUR = 5;       // smoothing passes; a hand-drawn line is not a measurement

      // Length-weighted density: a cell gets credit for how much drawn line
      // passes through it, so a slow scribble does not outweigh a long trip.
      function regionDensityField(paths, width, height) {
        var cols = Math.ceil(width / REGION_CELL) + 1;
        var rows = Math.ceil(height / REGION_CELL) + 1;
        var grid = new Float32Array(cols * rows);
        paths.forEach(function (path) {
          var walked = resamplePolyline(path.points, REGION_CELL * 0.5);
          for (var i = 1; i < walked.length; i += 1) {
            var mx = (walked[i - 1][0] + walked[i][0]) / 2;
            var my = (walked[i - 1][1] + walked[i][1]) / 2;
            var weight = Math.hypot(walked[i][0] - walked[i - 1][0],
              walked[i][1] - walked[i - 1][1]);
            var gx = mx / REGION_CELL, gy = my / REGION_CELL;
            var x0 = Math.floor(gx), y0 = Math.floor(gy);
            if (x0 < 0 || y0 < 0 || x0 >= cols - 1 || y0 >= rows - 1) continue;
            var fx = gx - x0, fy = gy - y0;
            grid[y0 * cols + x0] += weight * (1 - fx) * (1 - fy);
            grid[y0 * cols + x0 + 1] += weight * fx * (1 - fy);
            grid[(y0 + 1) * cols + x0] += weight * (1 - fx) * fy;
            grid[(y0 + 1) * cols + x0 + 1] += weight * fx * fy;
          }
        });
        for (var pass = 0; pass < REGION_BLUR; pass += 1) {
          grid = blurGrid(grid, cols, rows);
        }
        return { grid: grid, cols: cols, rows: rows };
      }

      // The density above which the cells account for `share` of the total.
      function regionThresholds(field, shares) {
        var values = [];
        var total = 0;
        for (var i = 0; i < field.grid.length; i += 1) {
          var v = field.grid[i];
          if (v > 0) { values.push(v); total += v; }
        }
        if (!total) return shares.map(function () { return Infinity; });
        values.sort(function (a, b) { return b - a; });
        // Walk the cells from densest down, banking mass as we go. The single
        // sweep only works if the targets are visited smallest-first, so the
        // shares are sorted here and mapped back to the caller's order -- the
        // bands are declared outermost-first for drawing, and taking that
        // order literally gave all three the same threshold.
        var order = shares.map(function (s, i) { return { share: s, at: i }; })
          .sort(function (a, b) { return a.share - b.share; });
        var out = shares.map(function () { return values[values.length - 1]; });
        var running = 0, next = 0;
        for (var k = 0; k < values.length && next < order.length; k += 1) {
          running += values[k];
          while (next < order.length && running >= order[next].share * total) {
            out[order[next].at] = values[k];
            next += 1;
          }
        }
        return out;
      }

      // Bilinear upsample of the coarse field to full canvas resolution, so a
      // band edge is a smooth curve instead of a staircase of 10 px cells.
      function regionUpsample(field, width, height) {
        var out = new Float32Array(width * height);
        for (var y = 0; y < height; y += 1) {
          var gy = y / REGION_CELL;
          var y0 = Math.min(field.rows - 2, Math.floor(gy));
          var fy = gy - y0;
          for (var x = 0; x < width; x += 1) {
            var gx = x / REGION_CELL;
            var x0 = Math.min(field.cols - 2, Math.floor(gx));
            var fx = gx - x0;
            out[y * width + x] =
              field.grid[y0 * field.cols + x0] * (1 - fx) * (1 - fy)
              + field.grid[y0 * field.cols + x0 + 1] * fx * (1 - fy)
              + field.grid[(y0 + 1) * field.cols + x0] * (1 - fx) * fy
              + field.grid[(y0 + 1) * field.cols + x0 + 1] * fx * fy;
          }
        }
        return out;
      }

      function renderRegionViz(context, reference, paths, width, height) {
        var field = regionDensityField(paths, width, height);
        var shares = REGION_BANDS.map(function (b) { return b.share; });
        var levels = regionThresholds(field, shares);
        var dense = regionUpsample(field, width, height);

        // Fills first, outermost down, each as its own translucent layer so
        // the overlaps deepen naturally towards the core.
        REGION_BANDS.forEach(function (band, index) {
          var level = levels[index];
          if (!(level > 0) || level === Infinity) return;
          var layer = context.createImageData(width, height);
          var data = layer.data;
          var rgba = band.fill.match(/[\d.]+/g).map(Number);
          var alpha = Math.round((rgba[3] || 0.15) * 255);
          for (var i = 0; i < dense.length; i += 1) {
            if (dense[i] < level) continue;
            var at = i * 4;
            data[at] = rgba[0];
            data[at + 1] = rgba[1];
            data[at + 2] = rgba[2];
            data[at + 3] = alpha;
          }
          // A band edge is a pixel inside the band with a neighbour outside.
          var edge = context.createImageData(width, height);
          var edgeData = edge.data;
          var line = band.line.match(/[\d.]+/g).map(Number);
          var lineAlpha = Math.round((line[3] || 0.7) * 255);
          for (var y = 1; y < height - 1; y += 1) {
            for (var x = 1; x < width - 1; x += 1) {
              var at2 = y * width + x;
              if (dense[at2] < level) continue;
              if (dense[at2 - 1] >= level && dense[at2 + 1] >= level
                && dense[at2 - width] >= level && dense[at2 + width] >= level) continue;
              var e = at2 * 4;
              edgeData[e] = line[0];
              edgeData[e + 1] = line[1];
              edgeData[e + 2] = line[2];
              edgeData[e + 3] = lineAlpha;
            }
          }
          var scratch = document.createElement('canvas');
          scratch.width = width;
          scratch.height = height;
          var sctx = scratch.getContext('2d');
          sctx.putImageData(layer, 0, 0);
          context.drawImage(scratch, 0, 0);
          sctx.putImageData(edge, 0, 0);
          context.drawImage(scratch, 0, 0);
        });

        // The trips stay underneath as a hairline, so the bands can be read
        // against the lines they were derived from. A slideshow scene asks for
        // the bands alone: on a wall the hairline reads as a second, competing
        // drawing rather than as the evidence for the first.
        if (!(previzFilter && previzFilter.bandsOnly)) {
          context.save();
          context.lineCap = 'round';
          context.lineJoin = 'round';
          context.globalAlpha = 0.25;
          paths.forEach(function (path) {
            context.strokeStyle = path.color;
            context.lineWidth = Math.max(0.8, 1.2 * pathWidthScale);
            strokePolyline(context, path.points);
          });
          context.restore();
        }

        // A share means little without the ground it covers, so each band is
        // reported as the area it encloses, measured off the sheet's corners.
        var corners = reference.corners;
        var kmPerPxX = 0, kmPerPxY = 0;
        if (corners && corners.length === 4) {
          var midLat = (corners[0][1] + corners[3][1]) / 2;
          kmPerPxX = Math.abs(corners[1][0] - corners[0][0])
            * 111.32 * Math.cos(midLat * Math.PI / 180) / (width - 1);
          kmPerPxY = Math.abs(corners[0][1] - corners[3][1]) * 110.54 / (height - 1);
        }
        var cellKm2 = (REGION_CELL * kmPerPxX) * (REGION_CELL * kmPerPxY);
        var parts = REGION_BANDS.slice().reverse().map(function (band) {
          var level = levels[REGION_BANDS.indexOf(band)];
          var cells = 0;
          for (var i = 0; i < field.grid.length; i += 1) {
            if (field.grid[i] > 0 && field.grid[i] >= level) cells += 1;
          }
          var area = cells * cellKm2;
          return Math.round(band.share * 100) + '% in '
            + (area >= 1 ? area.toFixed(1) : area.toFixed(2)) + ' km²';
        });
        setStatus($('pathVizStatus'), parts.join('  ·  '), 'ok');
      }

      // ---- travelling pulses over the flow ribbons ----------------------
      // A handful of short glowing sections run along randomly chosen trips.
      // Spawning is probabilistic each frame, so arrivals feel irregular
      // rather than metronomic, and the population hovers around the target
      // instead of being pinned to it. Longer trips are picked more often
      // (weighted by length), which keeps the pulse density even across the
      // map rather than clustering on short hops.
      // Spawning is rate-based: the expected number alive equals the slider
      // value whatever the speed, because the spawn rate is derived from the
      // population target divided by a pulse's expected lifetime (the
      // length-weighted mean trip length over the current speed). Arrivals
      // stay Bernoulli-per-frame, so they keep their irregular feel.
      var flowPulseCount = 10;
      var flowPulseSpeed = 1;

      function pathCumulativeLengths(points) {
        var cum = [0];
        for (var i = 1; i < points.length; i += 1) {
          cum.push(cum[i - 1] + Math.hypot(points[i][0] - points[i - 1][0],
            points[i][1] - points[i - 1][1]));
        }
        return cum;
      }

      // The piece of a polyline between arc-lengths a and b, with
      // interpolated end points, so a pulse can sit anywhere on the trip.
      function subPolyline(points, cum, a, b) {
        var total = cum[cum.length - 1];
        a = Math.max(0, Math.min(total, a));
        b = Math.max(0, Math.min(total, b));
        if (b - a < 1e-3) return null;
        var out = [];
        var at = function (d) {
          var i = 1;
          while (i < cum.length - 1 && cum[i] < d) i += 1;
          var seg = cum[i] - cum[i - 1] || 1;
          var t = (d - cum[i - 1]) / seg;
          return [points[i - 1][0] + (points[i][0] - points[i - 1][0]) * t,
            points[i - 1][1] + (points[i][1] - points[i - 1][1]) * t];
        };
        out.push(at(a));
        for (var i = 1; i < points.length - 1; i += 1) {
          if (cum[i] > a && cum[i] < b) out.push([points[i][0], points[i][1]]);
        }
        out.push(at(b));
        return out;
      }

      function flowAnimState(reference, paths, width, height) {
        var key = vizPathsSignature(paths) + '|' + width + 'x' + height;
        var state = reference.flowAnim;
        if (!state || state.key !== key) {
          var entries = [];
          paths.forEach(function (path) {
            var cum = pathCumulativeLengths(path.points);
            var length = cum[cum.length - 1];
            // A pulse needs room to travel; skip stub trips.
            if (length > 50) entries.push({ path: path, cum: cum, length: length });
          });
          // The same corridor-count fields the ribbons are drawn from, kept
          // so a pulse can match the ribbon's width at its own position.
          var fields = {};
          var groups = groupVizPaths(paths);
          Object.keys(groups).forEach(function (color) {
            var lists = groups[color].map(function (p) { return p.points; });
            var flow = corridorCounts(lists, width, height, 26);
            var blurred = blurGrid(flow.counts, flow.cols, flow.rows);
            fields[color] = {
              counts: blurred, max: gridMax(blurred),
              cols: flow.cols, rows: flow.rows, cell: flow.cell
            };
          });
          state = reference.flowAnim = {
            key: key,
            entries: entries,
            fields: fields,
            totalLength: entries.reduce(function (s, e) { return s + e.length; }, 0),
            weightedMeanLength: (function () {
              var sum = 0, sq = 0;
              entries.forEach(function (e) { sum += e.length; sq += e.length * e.length; });
              return sum ? sq / sum : 300;
            }()),
            pulses: [],
            lastTime: 0
          };
        }
        return state;
      }

      function flowWidthAt(state, color, x, y) {
        var field = state.fields[color];
        if (!field) return 3 * pathWidthScale;
        var c = sampleGrid(field.counts, field.cols, field.rows,
          x / field.cell, y / field.cell);
        return flowWidthFor(c, field.max);
      }

      function drawFlowPulses(context, reference, paths, width, height, now) {
        var state = flowAnimState(reference, paths, width, height);
        if (!state.entries.length) return;
        var dt = state.lastTime ? Math.min(0.1, (now - state.lastTime) / 1000) : 0;
        state.lastTime = now;

        // advance, cull, maybe spawn
        state.pulses = state.pulses.filter(function (pulse) {
          pulse.dist += pulse.speed * flowPulseSpeed * dt;
          return pulse.dist < pulse.entry.length + pulse.len;
        });
        if (!flowPulseCount) {
          state.pulses = [];
        } else if (state.pulses.length < flowPulseCount * 1.6) {
          var lifetime = (state.weightedMeanLength + 6)
            / Math.max(1, 125 * flowPulseSpeed);
          var expected = (flowPulseCount / lifetime) * dt;
          var spawns = Math.floor(expected)
            + (Math.random() < expected % 1 ? 1 : 0);
          for (var s = 0; s < spawns; s += 1) {
            var pick = Math.random() * state.totalLength;
            var entry = state.entries[0];
            for (var i = 0; i < state.entries.length; i += 1) {
              if (pick < state.entries[i].length) { entry = state.entries[i]; break; }
              pick -= state.entries[i].length;
            }
            state.pulses.push({
              entry: entry,
              dist: -6,                             // eases in from the start
              len: 3.4 + Math.random() * 3,
              speed: 80 + Math.random() * 90
            });
          }
        }

        context.save();
        context.lineCap = 'round';
        context.lineJoin = 'round';
        state.pulses.forEach(function (pulse) {
          var entry = pulse.entry;
          var piece = subPolyline(entry.path.points, entry.cum,
            pulse.dist, pulse.dist + pulse.len);
          if (!piece) return;
          // Fade in over the first stretch of travel and out over the last,
          // so pulses appear and vanish softly instead of popping.
          var fade = Math.max(0, Math.min(1,
            (pulse.dist + pulse.len) / 40,
            (entry.length - pulse.dist) / 40));
          if (!fade) return;
          // The ribbon's own colour and width at this exact spot, simply at
          // full opacity -- the pulse reads as the line itself lighting up.
          var mid = piece[Math.floor(piece.length / 2)];
          context.globalAlpha = fade;
          context.strokeStyle = entry.path.color;
          context.lineWidth = flowWidthAt(state, entry.path.color, mid[0], mid[1]);
          strokePolyline(context, piece);
        });
        context.restore();
      }

      function drawPathViz(context, reference, width, height) {
        var paths = collectVizPaths(reference);
        if (!paths.length) return;
        // Bundle/flow/heat are static and not cheap; rendered once into an
        // offscreen layer and reused until the trips or the mode change.
        var key = pathVizMode + '|' + pathWidthScale + '|' + width + 'x' + height
          + '|' + vizPathsSignature(paths);
        if (!reference.vizCache || reference.vizCache.key !== key) {
          var layer = document.createElement('canvas');
          layer.width = width;
          layer.height = height;
          var lctx = layer.getContext('2d');
          var groups = groupVizPaths(paths);
          if (pathVizMode === 'flow') renderFlowViz(lctx, groups, width, height);
          else if (pathVizMode === 'regions') renderRegionViz(lctx, reference, paths, width, height);
          else renderPlainViz(lctx, groups);
          reference.vizCache = { key: key, canvas: layer };
        }
        context.drawImage(reference.vizCache.canvas, 0, 0);
        if (pathVizMode === 'flow') {
          drawFlowPulses(context, reference, paths, width, height,
            window.performance ? window.performance.now() : Date.now());
        }
      }

      function pulseFrame(now) {
        pulseTimer = window.requestAnimationFrame(pulseFrame);
        if (now - pulseLast < 33) return;   // ~30 fps is plenty for the glow
        pulseLast = now;
        references.forEach(function (reference) {
          if (reference.visible) paintReference(reference);
        });
      }

      function syncPulseLoop() {
        if (pathVizMode === 'flow' && !pulseTimer) {
          pulseTimer = window.requestAnimationFrame(pulseFrame);
        } else if (pathVizMode !== 'flow' && pulseTimer) {
          window.cancelAnimationFrame(pulseTimer);
          pulseTimer = 0;
        }
      }

      function setPathVizMode(mode) {
        pathVizMode = mode;
        Array.prototype.forEach.call(
          queryAll('.pathviz button[data-viz]'),
          function (button) {
            button.classList.toggle('is-active', button.dataset.viz === mode);
          }
        );
        references.forEach(function (reference) { reference.vizCache = null; });
        syncPulseLoop();
        if (mode !== 'regions') setStatus($('pathVizStatus'), '');
        references.forEach(paintReference);
      }

      Array.prototype.forEach.call(
        queryAll('.pathviz button[data-viz]'),
        function (button) {
          button.addEventListener('click', function () {
            setPathVizMode(pathVizMode === button.dataset.viz
              ? 'classic' : button.dataset.viz);
          });
        }
      );

      $('pulseCount').addEventListener('input', function () {
        flowPulseCount = Number(this.value) || 0;
        $('pulseCountVal').textContent = String(flowPulseCount);
      });
      $('pulseSpeed').addEventListener('input', function () {
        flowPulseSpeed = Number(this.value) || 1;
        $('pulseSpeedVal').innerHTML = flowPulseSpeed.toFixed(1) + '&times;';
      });

      $('pathWidth').addEventListener('input', function () {
        pathWidthScale = Number(this.value) || 1;
        $('pathWidthVal').innerHTML = pathWidthScale.toFixed(1) + '&times;';
        // Flow layers re-render from scratch, so coalesce a drag's worth of
        // input events into one repaint.
        window.clearTimeout(pathWidthTimer);
        pathWidthTimer = window.setTimeout(function () {
          references.forEach(function (reference) { reference.vizCache = null; });
          references.forEach(paintReference);
        }, 40);
      });

      // The marks live in their own layer now, but every path that repaints a
      // sheet is also a path that can have added, moved or filtered one, and
      // there are a dozen such paths. Wrapping the ink keeps the two in step
      // without threading a call through all of them.
      function paintReference(reference) {
        paintReferenceInk(reference);
        refreshStickerMarks();
        refreshManualPins();
        // Hand edits change what the row reports, and they all repaint here.
        if (reference && reference.row && !reference.photos.some(function (p) { return !p.done && !p.failed; })) {
          refreshReferenceRow(reference);
        }
      }

      function paintReferenceInk(reference) {
        // A restored session carries only the vectors, never the mask image,
          // so presence of a result is what counts here — not a raster to go
          // with it. The mask is used below only where it exists.
        var shown = reference.photos
          .filter(function (photo) { return photo.result; })
          .map(function (photo) { return photo.result; });
        var target = reference.canvas;
        var manual = reference.manual;
        var hasManual = Boolean(manual && (manual.markers.length || manual.strokes.length));
        if (!shown.length && !hasManual) {
          target.getContext('2d').clearRect(0, 0, target.width, target.height);
          if (map && typeof map.triggerRepaint === 'function') map.triggerRepaint();
          return;
        }
        var size = manualTargetSize(reference);
        var first = shown.length ? shown[0].classImage : null;
        if (!first) {
          for (var k = 0; k < shown.length && !first; k += 1) first = shown[k].classImage;
        }
        var width = first ? (first.naturalWidth || first.width) : size.w;
        var height = first ? (first.naturalHeight || first.height) : size.h;
        if (!width || !height) return;
        if (classCanvas.width !== width || classCanvas.height !== height) {
          classCanvas.width = width;
          classCanvas.height = height;
        }
        var cctx = classCanvas.getContext('2d', { willReadFrequently: true });
        cctx.globalCompositeOperation = 'source-over';
        var merged = null;
        shown.forEach(function (result) {
          if (!result.classImage) return;
          cctx.imageSmoothingEnabled = false;
          cctx.clearRect(0, 0, width, height);
          cctx.drawImage(result.classImage, 0, 0);
          var pixels = cctx.getImageData(0, 0, width, height);
          paintOneClassMask(pixels.data, result);
          if (!merged) {
            merged = pixels;
            return;
          }
          var into = merged.data;
          var from = pixels.data;
          for (var j = 0; j < from.length; j += 4) {
            if (!from[j + 3] || into[j + 3]) continue;
            into[j] = from[j];
            into[j + 1] = from[j + 1];
            into[j + 2] = from[j + 2];
            into[j + 3] = from[j + 3];
          }
        });
        cctx.clearRect(0, 0, width, height);
        if (merged) cctx.putImageData(merged, 0, 0);

        // Hand-drawn paths sit with the detected ones, then the eraser lifts
        // whatever it has been dragged over — detected or drawn, both at once.
        if (pathVizMode === 'classic' && !snapToStreets && manual && manual.strokes.length && enabledKinds.has('line')) {
          cctx.lineCap = 'round';
          cctx.lineJoin = 'round';
          manual.strokes.forEach(function (stroke) {
            if (stroke.points.length < 1) return;
            cctx.strokeStyle = stroke.color;
            cctx.lineWidth = stroke.width * pathWidthScale;
            cctx.beginPath();
            cctx.moveTo(stroke.points[0][0], stroke.points[0][1]);
            stroke.points.forEach(function (point) { cctx.lineTo(point[0], point[1]); });
            if (stroke.points.length === 1) cctx.lineTo(stroke.points[0][0] + 0.1, stroke.points[0][1]);
            cctx.stroke();
          });
        }
        if (manual && manual.erased) {
          cctx.globalCompositeOperation = 'destination-out';
          cctx.drawImage(manual.erased, 0, 0);
          cctx.globalCompositeOperation = 'source-over';
        }

        if (pathVizMode === 'classic' && !snapToStreets) {
          shown.forEach(function (result) { drawPathLines(cctx, result); });
        } else {
          // The mode draws hand strokes and detected paths together, after
          // the eraser, so switching modes changes the ink, never the data.
          drawPathViz(cctx, reference, width, height);
        }
        // The reference's own canvas is what maplibre samples, pinned to that
        // sheet's corners, so each sheet lands on its own patch of the world.
        if (target.width !== width || target.height !== height) {
          target.width = width;
          target.height = height;
        }
        var tctx = target.getContext('2d');
        tctx.globalCompositeOperation = 'source-over';
        tctx.clearRect(0, 0, width, height);
        tctx.imageSmoothingEnabled = true;
        tctx.drawImage(classCanvas, 0, 0);
        if (map && typeof map.triggerRepaint === 'function') map.triggerRepaint();
      }

      function paintOneClassMask(data, result) {
        var kindCodes = result.kindCodes || {};
        var kindAllowed = [];
        Object.keys(kindCodes).forEach(function (kind) {
          kindAllowed[kindCodes[kind]] = enabledKinds.has(kind);
        });
        var red = [], green = [], blue = [];
        (result.colors || []).forEach(function (item) {
          var slot = Number(item.index) + 1;
          var hex = String(item.color || '#d3302f').replace('#', '');
          red[slot] = parseInt(hex.slice(0, 2), 16);
          green[slot] = parseInt(hex.slice(2, 4), 16);
          blue[slot] = parseInt(hex.slice(4, 6), 16);
        });
        var stickerCode = kindCodes.sticker;
        var lineCode = kindCodes.line;

        for (var i = 0; i < data.length; i += 4) {
          var alpha = data[i + 3];
          if (!alpha) continue;
          var kindSlot = data[i];
          var colorSlot = data[i + 1];
          // Neither a sticker's pixels nor a path's are painted. Both are
          // drawn from what the export actually contains — a point for a
          // sticker, a simplified polyline for a path — so what is on screen
          // is what lands in the GeoJSON, not the ragged ink behind it.
          var hidden = kindSlot === stickerCode || kindSlot === lineCode ||
            !kindAllowed[kindSlot] || red[colorSlot] === undefined;
          if (hidden) {
            data[i + 3] = 0;
            continue;
          }
          data[i] = red[colorSlot];
          data[i + 1] = green[colorSlot];
          data[i + 2] = blue[colorSlot];
        }
      }

      // The traced route as a polyline, with its vertices shown, so what is on
      // screen is the geometry that will be exported rather than the ink it was
      // derived from. A white casing keeps it readable over the printed map.
      function drawPathLines(context, result) {
        var paths = result.paths || [];
        if (!paths.length || !enabledKinds.has('line')) return;
        context.save();
        context.lineCap = 'round';
        context.lineJoin = 'round';
        paths.forEach(function (path) {
          var points = path.points || [];
          if (points.length < 2) return;
          var weight = Math.max(1.2, (path.widthPx || 6) * 0.85 * pathWidthScale);
          context.beginPath();
          context.moveTo(points[0][0], points[0][1]);
          for (var i = 1; i < points.length; i += 1) {
            context.lineTo(points[i][0], points[i][1]);
          }
          context.strokeStyle = 'rgba(255,255,255,0.85)';
          context.lineWidth = weight + Math.max(2.5, weight * 0.7);
          context.stroke();
          context.strokeStyle = path.color;
          context.lineWidth = weight;
          context.stroke();
          context.fillStyle = path.color;
          points.forEach(function (point) {
            context.beginPath();
            context.arc(point[0], point[1], Math.max(1.6, weight * 0.42), 0, Math.PI * 2);
            context.fill();
          });
        });
        context.restore();
      }

      // A plus for a circle, a minus for a triangle, in the sticker's own
      // colour.
      //
      // These used to be drawn into the sheet's own canvas, which maplibre
      // pins to the four corners of the paper: the marks were fixed in metres,
      // so zooming in magnified them until a street was three plus signs wide,
      // and the canvas has only the sheet's own resolution to be magnified
      // with. As their own symbol layer they are sized in screen pixels and
      // drawn from glyphs, so they stay crisp and zooming in opens the map up
      // instead of burying it.
      var STICKER_MARK_SOURCE = 'sticker-marks';
      var STICKER_MARK_LAYER = 'sticker-marks-layer';

      function stickerMarkFeatures() {
        var features = [];
        if (!enabledKinds.has('sticker') || !showStickerMarks) return features;
        if (previzFilter && !previzFilter.stickers) return features;
        references.forEach(function (reference) {
          if (!reference.visible) return;
          function push(marker) {
            if (!stickerAllowed(marker)) return;
            if (previzFilter && previzFilter.stickerColour
              && marker.colorClass !== previzFilter.stickerColour) return;
            var lngLat = sheetPixelToLngLat(reference, marker.x, marker.y);
            if (!lngLat) return;
            features.push({
              type: 'Feature',
              geometry: { type: 'Point', coordinates: lngLat },
              properties: {
                colour: marker.color,
                mark: marker.shape === 'circle' ? '+' : '−'
              }
            });
          }
          reference.photos.forEach(function (photo) {
            if (photo.result) (photo.result.markers || []).forEach(push);
          });
          if (reference.manual) reference.manual.markers.forEach(push);
        });
        return features;
      }

      // Above the ink and the heatmap, below the street names -- the same
      // storey the sheets themselves sit on.
      function raiseStickerMarks() {
        if (!map.getLayer(STICKER_MARK_LAYER)) return;
        try { map.moveLayer(STICKER_MARK_LAYER, labelFloorId()); }
        catch (_error) { try { map.moveLayer(STICKER_MARK_LAYER); } catch (_ignored) {} }
      }

      function refreshStickerMarks() {
        if (!map || typeof map.getSource !== 'function') return;
        var data = { type: 'FeatureCollection', features: stickerMarkFeatures() };
        var source;
        try { source = map.getSource(STICKER_MARK_SOURCE); }
        catch (_error) { return; }        // mid style swap: the next paint retries
        if (source) {
          source.setData(data);
        } else {
          try { map.addSource(STICKER_MARK_SOURCE, { type: 'geojson', data: data }); }
          catch (_error) { return; }
        }
        if (!map.getLayer(STICKER_MARK_LAYER)) {
          addLayerUnderLabels({
            id: STICKER_MARK_LAYER,
            type: 'symbol',
            source: STICKER_MARK_SOURCE,
            layout: {
              'text-field': ['get', 'mark'],
              'text-font': ['Noto Sans Bold'],
              // One size in screen pixels, at every zoom. A mark is one
              // person's answer, not an area, so it has no size on the ground
              // to represent: it should read the same close in as far out, and
              // the map is what grows underneath it.
              'text-size': 23,
              // Every mark is a person's answer, so none of them is dropped
              // for colliding with another.
              'text-allow-overlap': true,
              'text-ignore-placement': true
            },
            paint: {
              'text-color': ['get', 'colour'],
              // The white underlay the canvas version painted by hand: it is
              // what keeps a yellow mark readable over pale ground.
              'text-halo-color': 'rgba(255,255,255,0.92)',
              'text-halo-width': 1.7
            }
          });
        }
        raiseStickerMarks();
      }

      // Hand-dropped pins: a point somebody named, drawn like a map pin with
      // its name beside it. They ride with the sheet, so they are stored in
      // its pixels like every other hand edit and projected the same way.
      var MANUAL_PIN_SOURCE = 'manual-pins';
      var MANUAL_PIN_LAYER = 'manual-pins-layer';

      function manualPinFeatures() {
        var features = [];
        references.forEach(function (reference) {
          if (!reference.visible || !reference.manual) return;
          (reference.manual.pins || []).forEach(function (pin) {
            var lngLat = sheetPixelToLngLat(reference, pin.x, pin.y);
            if (!lngLat) return;
            features.push({
              type: 'Feature',
              geometry: { type: 'Point', coordinates: lngLat },
              properties: { text: pin.text || '' }
            });
          });
        });
        return features;
      }

      function refreshManualPins() {
        if (!map || typeof map.getSource !== 'function') return;
        var data = { type: 'FeatureCollection', features: manualPinFeatures() };
        var source;
        try { source = map.getSource(MANUAL_PIN_SOURCE); }
        catch (_error) { return; }        // mid style swap: the next paint retries
        if (source) {
          source.setData(data);
        } else {
          try { map.addSource(MANUAL_PIN_SOURCE, { type: 'geojson', data: data }); }
          catch (_error) { return; }
        }
        if (!map.hasImage('dropped-pin')) {
          try { map.addImage('dropped-pin', pinImage(28), { pixelRatio: 2 }); }
          catch (_error) { /* raced with ensurePinLayer; either copy will do */ }
        }
        if (!map.getLayer(MANUAL_PIN_LAYER)) {
          addLayerUnderLabels({
            id: MANUAL_PIN_LAYER,
            type: 'symbol',
            source: MANUAL_PIN_SOURCE,
            layout: {
              // The workshop's dropped pins already draw the red teardrop; a
              // hand-dropped pin is that same object with a name on it.
              'icon-image': 'dropped-pin',
              'icon-size': 1,
              // The tip of the teardrop marks the spot, as on any map.
              'icon-anchor': 'bottom',
              'icon-allow-overlap': true,
              'icon-ignore-placement': true,
              'text-field': ['get', 'text'],
              'text-font': ['Noto Sans Bold'],
              'text-size': 14,
              'text-anchor': 'left',
              // Beside the head of the pin, not the tip, and clear of the
              // teardrop's widest point (~8 px either side of centre) so the
              // first letter is never under it. In ems of text-size.
              'text-offset': [1.25, -1.35],
              // A pin is a thing somebody chose to name; none is dropped for
              // colliding with a street label.
              'text-allow-overlap': true,
              'text-ignore-placement': true
            },
            paint: {
              'text-color': '#14181a',
              'text-halo-color': 'rgba(255,255,255,0.95)',
              'text-halo-width': 2.2
            }
          });
        }
        try { map.moveLayer(MANUAL_PIN_LAYER, labelFloorId()); }
        catch (_error) { try { map.moveLayer(MANUAL_PIN_LAYER); } catch (_ignored) {} }
      }

      function paintDrawingMask() {
        // The heatmap goes down first so the reference overlays, which are
        // moved to the top as they are ensured, keep their marks readable
        // above it.
        refreshStickerHeatmap();
        references.forEach(function (reference) {
          paintReference(reference);
          ensureReferenceLayer(reference);
        });
        raiseStickerMarks();       // the ink was just moved back over it
      }

      // ---- bivariate agreement surface, one per sticker colour ---------
      // Two readings share one map, so they share one colour. The area is
      // binned into hexagons and each is coloured from a 3x3 matrix: across for
      // how many pluses it holds, down for how many minuses. The far corner has
      // a colour of its own — deep purple — so a contested place is a positive
      // statement rather than the muddy blend two stacked layers produce.
      //
      // Agreement is blue rather than green: the basemap paints its parks and
      // gardens green, and a green overlay over a green park is unreadable.
      //
      // Stacking a green layer over a red one could not work: whichever is
      // drawn second wins outright, and where they do blend, red over green
      // makes grey, which reads as "nothing here" at exactly the spots that
      // matter most.
      //
      // Black stickers are left out; with the fill carrying the meaning, a
      // black sticker's own colour says nothing.
      var BIV_PREFIX = 'imobyl-biv-';
      // Rows are minus level 0..2, columns plus level 0..2.
      // Bilinear blend of four fixed corners — none, all-plus, all-minus, both
      // — so the middle cells are consistent rather than eyeballed.
      var BIV_MATRIX = [
        ['#e8e8e8', '#8cb5d2', '#3182bd'],
        ['#d89c9c', '#887992', '#37568a'],
        ['#c94f4f', '#833d52', '#3d2b56']
      ];
      var BIV_EXCLUDED = { black: true };
      // The overview step's surface is keyed like a colour, because every
      // piece of the heat machinery -- settings, layer ids, ranges, opacity --
      // is keyed by colour and none of it cares that this one is a sum.
      var BIV_ALL_KEY = 'all';
      var BIV_DEFAULTS = { enabled: false, binMetres: 220, perLevel: 1, opacity: 0.65 };
      var heatSettings = {};
      var heatKnownColours = [];
      // The fill breathes, and how brightly depends on how much is in the bin:
      // the busiest bins swing 0.6 to 1.0, the quietest 0.4 to 0.8, and
      // everything between is interpolated on its own sticker count.
      //
      // The phase is animated here rather than handed to a paint transition,
      // because the opacity is a data-driven expression and maplibre will not
      // reliably ease between two of those — it would snap, giving a hard flash
      // every few seconds instead of a breath.
      var BIV_PULSE_MS = 5000;
      var BIV_QUIET = [0.4, 0.8];      // trough and peak for the emptiest bin
      var BIV_BUSY = [0.6, 1.0];       // trough and peak for the fullest bin
      var BIV_PULSE_STEP_MS = 50;      // ~20 fps is ample for a five second cycle
      // Off: a bin is drawn only where a sticker landed in it, and the map
