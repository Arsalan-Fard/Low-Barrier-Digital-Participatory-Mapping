      // reads as scattered islands. On: every bin in the sheet takes a
      // distance-weighted reading of the stickers around it, so the surface is
      // continuous and a quiet street reads as quiet rather than as unvisited.
      var bivInterpolate = false;
      var bivPulse = false;
      var bivPulseFrame = null;
      var bivPulseAt = 0;
      var bivRanges = {};              // colourClass -> { min, max } sticker count
      // The last FeatureCollection built per colour, kept so the pointer's
      // hold can pick out the cells around the tag without re-binning.
      var bivLastData = {};

      // At phase 0 every bin sits at its trough, at phase 1 at its peak.
      function bivOpacityAt(colourClass, settings, phase) {
        if (bivInterpolate) {
          // The bins keep the opacity they always had; the ground spread out
          // around them fades with its own certainty, so a reading nobody gave
          // never looks as solid as one they did.
          var top = bivPulse
            ? BIV_BUSY[0] + (BIV_BUSY[1] - BIV_BUSY[0]) * phase
            : settings.opacity;
          return ['interpolate', ['linear'], ['get', 'strength'], 0, 0, 1, top];
        }
        if (!bivPulse) return settings.opacity;
        var range = bivRanges[colourClass];
        var quiet = BIV_QUIET[0] + (BIV_QUIET[1] - BIV_QUIET[0]) * phase;
        var busy = BIV_BUSY[0] + (BIV_BUSY[1] - BIV_BUSY[0]) * phase;
        if (!range || !(range.max > range.min)) return (quiet + busy) / 2;
        return [
          'interpolate', ['linear'], ['get', 'total'],
          range.min, quiet,
          range.max, busy
        ];
      }

      function bivBreathing() { return bivPulse; }

      function bivPulseTick(now) {
        if (!bivBreathing()) return;
        bivPulseFrame = window.requestAnimationFrame(bivPulseTick);
        if (now - bivPulseAt < BIV_PULSE_STEP_MS) return;
        bivPulseAt = now;
        // Cosine so the turns at each end are soft rather than abrupt.
        var phase = (1 - Math.cos(2 * Math.PI * (now % BIV_PULSE_MS) / BIV_PULSE_MS)) / 2;
        heatKnownColours.forEach(function (colourClass) {
          var settings = heatSettingsFor(colourClass);
          if (!settings.enabled) return;
          var layerId = heatIds(colourClass).layer;
          if (!map.getLayer(layerId)) return;
          map.setPaintProperty(
            layerId, 'fill-opacity', bivOpacityAt(colourClass, settings, phase)
          );
        });
      }

      function syncBivPulseLoop() {
        if (bivPulseFrame) window.cancelAnimationFrame(bivPulseFrame);
        bivPulseFrame = null;
        if (bivBreathing()) {
          bivPulseAt = 0;
          bivPulseFrame = window.requestAnimationFrame(bivPulseTick);
          return;
        }
        // Back to standing still -- which is not a flat number when the
        // surface is interpolated, so it goes through the same builder.
        heatKnownColours.forEach(function (colourClass) {
          var layerId = heatIds(colourClass).layer;
          if (!map.getLayer(layerId)) return;
          var settings = heatSettingsFor(colourClass);
          map.setPaintProperty(layerId, 'fill-opacity',
            bivOpacity(settings, colourClass));
        });
      }

      function setBivPulse(on) {
        bivPulse = on;
        syncBivPulseLoop();
      }

      function bivOpacity(settings, colourClass) {
        return bivOpacityAt(colourClass, settings, 0);
      }

      function heatSettingsFor(colourClass) {
        var current = heatSettings[colourClass];
        if (!current) {
          current = heatSettings[colourClass] = {
            enabled: BIV_DEFAULTS.enabled, binMetres: BIV_DEFAULTS.binMetres,
            perLevel: BIV_DEFAULTS.perLevel, opacity: BIV_DEFAULTS.opacity
          };
        }
        return current;
      }

      function heatIds(colourClass) {
        var base = BIV_PREFIX + colourClass;
        return { source: base, layer: base + '-fill' };
      }

      // Local metres about a reference point. A sheet spans a few kilometres,
      // so a flat approximation keeps every hexagon the same real size.
      function bivFrame(originLng, originLat) {
        var perLat = 110540;
        var perLng = 111320 * Math.cos(originLat * Math.PI / 180);
        return {
          toMetres: function (lng, lat) {
            return [(lng - originLng) * perLng, (lat - originLat) * perLat];
          },
          toLngLat: function (x, y) {
            return [originLng + x / perLng, originLat + y / perLat];
          }
        };
      }

      // Pointy-top hexagons on axial coordinates. `size` is the circumradius,
      // so the slider, quoted flat to flat, is sqrt(3) times it.
      function bivHexAt(x, y, size) {
        var q = (Math.sqrt(3) / 3 * x - y / 3) / size;
        var r = (2 / 3 * y) / size;
        var cx = q, cz = r, cy = -cx - cz;
        var rx = Math.round(cx), ry = Math.round(cy), rz = Math.round(cz);
        var dx = Math.abs(rx - cx), dy = Math.abs(ry - cy), dz = Math.abs(rz - cz);
        if (dx > dy && dx > dz) rx = -ry - rz;
        else if (dy > dz) ry = -rx - rz;
        else rz = -rx - ry;
        return [rx, rz];
      }

      function bivHexRing(q, r, size, frame) {
        var cx = size * Math.sqrt(3) * (q + r / 2);
        var cy = size * 1.5 * r;
        var ring = [];
        for (var i = 0; i < 6; i += 1) {
          var angle = Math.PI / 180 * (60 * i - 30);
          ring.push(frame.toLngLat(
            cx + size * Math.cos(angle), cy + size * Math.sin(angle)
          ));
        }
        ring.push(ring[0]);
        return [ring];
      }

      // Every sticker on a ticked sheet, grouped by colour. The colour chips
      // filter the marks on screen; this panel has a switch per colour of its
      // own, so they are deliberately not applied here.
      function stickerPointsByColour() {
        var byColour = {};
        references.forEach(function (reference) {
          if (!reference.visible) return;
          var c = reference.corners;
          if (!c || c.length !== 4) return;
          var size = manualTargetSize(reference);
          var spanLng = c[1][0] - c[0][0];
          var spanLat = c[3][1] - c[0][1];
          function push(marker) {
            if (BIV_EXCLUDED[marker.colorClass]) return;
            var u = size.w > 1 ? marker.x / (size.w - 1) : 0;
            var v = size.h > 1 ? marker.y / (size.h - 1) : 0;
            var entry = byColour[marker.colorClass];
            if (!entry) {
              entry = byColour[marker.colorClass] = {
                id: marker.colorClass, label: marker.colorLabel,
                color: marker.color, plus: 0, minus: 0, points: []
              };
            }
            var sign = marker.shape === 'circle' ? 'plus' : 'minus';
            entry[sign] += 1;
            entry.points.push({
              lng: c[0][0] + spanLng * u,
              lat: c[0][1] + spanLat * v,
              sign: sign
            });
          }
          reference.photos.forEach(function (photo) {
            if (photo.result) photo.result.markers.forEach(push);
          });
          if (reference.manual) reference.manual.markers.forEach(push);
        });
        return byColour;
      }

      function bivHexToRgb(hex) {
        var value = parseInt(String(hex).replace('#', ''), 16);
        return [(value >> 16) & 255, (value >> 8) & 255, value & 255];
      }

      function bivMix(from, to, t) {
        var a = bivHexToRgb(from), b = bivHexToRgb(to);
        return 'rgb(' + [0, 1, 2].map(function (channel) {
          return Math.round(a[channel] + (b[channel] - a[channel]) * t);
        }).join(', ') + ')';
      }

      // The binned map quantises to a 3x3 matrix, which is right when a cell
      // holds a countable handful of stickers. An interpolated cell does not:
      // a smooth kernel leaves a little of both signs almost everywhere, every
      // cell trips to level 1 on both axes, and the whole surface collapses
      // onto the matrix's centre -- measured, 61% of cells came out the same
      // muddy purple. So an interpolated cell is coloured continuously
      // instead, along the two axes that actually vary:
      //
      //   balance  -- which sign is winning here, red through purple to blue,
      //               anchored on the same three matrix corners the legend
      //               names, so purple still means evenly contested;
      //   strength -- how much was said here at all, which fades the colour
      //               out towards the empty tone where nothing was.
      // A spread cell holds an average, not a count, so the 3x3 matrix has
      // nothing to say about it: quantising it would put every such cell on
      // level 1 of both axes and turn the whole surface the one muddy purple
      // of the matrix's centre. It takes a colour off the balance instead --
      // which sign is winning here -- anchored on the same three corners the
      // legend names, so purple still means evenly contested. How sure the
      // cell is rides on its opacity, not on its hue.
      function bivSurfaceColor(plus, minus) {
        var total = plus + minus;
        if (!(total > 0)) return BIV_MATRIX[0][0];
        var balance = (plus - minus) / total;
        return balance >= 0
          ? bivMix(BIV_MATRIX[1][1], BIV_MATRIX[0][2], balance)
          : bivMix(BIV_MATRIX[1][1], BIV_MATRIX[2][0], -balance);
      }

      function bivLevel(count, perLevel) {
        if (count <= 0) return 0;
        return Math.min(2, Math.max(1, Math.ceil(count / Math.max(1, perLevel))));
      }

      // The ground the sheets cover, in the frame's metres -- the extent the
      // interpolated surface fills. Falls back to the stickers' own spread,
      // padded, if no sheet is on the map to ask.
      function bivSheetBox(frame, points, pad) {
        var box = null;
        function grow(lng, lat) {
          var xy = frame.toMetres(lng, lat);
          if (!box) box = { minX: xy[0], maxX: xy[0], minY: xy[1], maxY: xy[1] };
          else {
            box.minX = Math.min(box.minX, xy[0]);
            box.maxX = Math.max(box.maxX, xy[0]);
            box.minY = Math.min(box.minY, xy[1]);
            box.maxY = Math.max(box.maxY, xy[1]);
          }
        }
        references.forEach(function (reference) {
          if (!reference.visible || !reference.corners) return;
          reference.corners.forEach(function (corner) { grow(corner[0], corner[1]); });
        });
        if (!box) {
          points.forEach(function (point) { grow(point.lng, point.lat); });
          if (box) {
            box.minX -= pad; box.maxX += pad;
            box.minY -= pad; box.maxY += pad;
          }
        }
        return box;
      }

      // How much of a reading survives one hex further out from the stickers
      // that produced it -- the Spread fade slider -- and the point at which a
      // ring is too faint to be worth drawing. Six neighbours, pointy-top
      // axial coordinates: the same lattice bivHexAt bins onto and bivHexRing
      // draws.
      var bivSpreadDecay = 0.45;
      var BIV_SPREAD_FLOOR = 0.02;
      var BIV_HEX_STEPS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];

      // Carry the binned readings out over the empty hexes, one ring at a
      // time.
      //
      // Bins that hold stickers are left exactly as they are: this adds to the
      // map, it never restates it. Every empty hex touching them takes the
      // average of those neighbours -- two neighbours reading 2 make this one
      // 2, not 4 -- and is drawn fainter, because nobody put a sticker there.
      // The next ring averages that ring in turn and fades again, so certainty
      // falls away with distance without anything having to model it.
      //
      // Reading every cell off a distance kernel instead, as this first did,
      // states a value for ground nobody marked as confidently as for ground
      // they did, and smears the two together until neither is legible.
      function bivSpreadCells(cells, size, frame, points, settings) {
        var box = bivSheetBox(frame, points, Math.max(10, settings.binMetres) * 3);
        if (!box) return;
        var rowStep = size * 1.5, colStep = size * Math.sqrt(3), margin = size;

        function inside(q, r) {
          var y = r * rowStep, x = colStep * (q + r / 2);
          return x >= box.minX - margin && x <= box.maxX + margin
            && y >= box.minY - margin && y <= box.maxY + margin;
        }

        var frontier = Object.keys(cells).map(function (id) { return cells[id]; });
        var fade = 1;
        while (frontier.length && fade > BIV_SPREAD_FLOOR) {
          fade *= bivSpreadDecay;
          var ring = {};
          frontier.forEach(function (cell) {
            BIV_HEX_STEPS.forEach(function (step) {
              var q = cell.q + step[0], r = cell.r + step[1];
              var id = q + ',' + r;
              if (cells[id] || !inside(q, r)) return;   // already read, or off-sheet
              var bucket = ring[id];
              if (!bucket) bucket = ring[id] = { q: q, r: r, plus: 0, minus: 0, from: 0 };
              bucket.plus += cell.plus;
              bucket.minus += cell.minus;
              bucket.from += 1;
            });
          });
          frontier = Object.keys(ring).map(function (id) {
            var bucket = ring[id];
            cells[id] = {
              q: bucket.q, r: bucket.r,
              plus: bucket.plus / bucket.from,
              minus: bucket.minus / bucket.from,
              fade: fade, spread: true
            };
            return cells[id];
          });
        }
      }

      // The three extremes a colour's surface holds: the most positive place,
      // the most negative, the most contested. Read the way the colours
      // themselves are -- blue and red on which sign is ahead, purple on the
      function bivFeatures(entry, settings) {
        var points = entry.points;
        if (!points.length) return { type: 'FeatureCollection', features: [] };
        var size = Math.max(10, settings.binMetres) / Math.sqrt(3);
        var frame = bivFrame(points[0].lng, points[0].lat);
        var cells = {};
        points.forEach(function (point) {
          var xy = frame.toMetres(point.lng, point.lat);
          var cell = bivHexAt(xy[0], xy[1], size);
          var id = cell[0] + ',' + cell[1];
          var bucket = cells[id];
          if (!bucket) {
            bucket = cells[id] = { q: cell[0], r: cell[1], plus: 0, minus: 0, fade: 1 };
          }
          bucket[point.sign] += 1;
        });
        if (bivInterpolate) bivSpreadCells(cells, size, frame, points, settings);
        var features = [];
        Object.keys(cells).forEach(function (id) {
          var bucket = cells[id];
          var plusLevel = bivLevel(bucket.plus, settings.perLevel);
          var minusLevel = bivLevel(bucket.minus, settings.perLevel);
          if (!plusLevel && !minusLevel && !bucket.spread) return;  // an empty bin
          features.push({
            type: 'Feature',
            properties: {
              // A bin a sticker landed in is drawn exactly as it always was.
              fillColor: bucket.spread
                ? bivSurfaceColor(bucket.plus, bucket.minus)
                : BIV_MATRIX[minusLevel][plusLevel],
              plus: bucket.plus, minus: bucket.minus,
              // Drives how strongly this bin breathes when the pulse is on.
              total: bucket.plus + bucket.minus,
              // 1 where a sticker was actually placed, falling away by ring
              // over the ground the reading was carried out to.
              strength: bucket.fade,
              plusLevel: plusLevel, minusLevel: minusLevel,
              // Its place on the lattice, so the pointer's hold can name the
              // cells it keeps out of the breath.
              cell: id
            },
            geometry: {
              type: 'Polygon',
              coordinates: bivHexRing(bucket.q, bucket.r, size, frame)
            }
          });
        });
        var totals = features.map(function (f) { return f.properties.total; });
        bivRanges[entry.id] = totals.length
          ? { min: Math.min.apply(null, totals), max: Math.max.apply(null, totals) }
          : null;
        return { type: 'FeatureCollection', features: features };
      }

      // One surface built from all five questions at once. A hexagon on it
      // says whether a place drew approval or complaint overall -- the thing
      // no single question can answer, since a street can be beautiful and
      // frightening at the same time and each colour only sees its half.
      //
      // The signs are what carry over, not the colours: a plus is a plus
      // whichever question asked it, so the same bivariate matrix reads this
      // surface as it reads a single colour's.
      function aggregateStickerEntry(byColour) {
        var entry = {
          id: BIV_ALL_KEY, label: 'Toutes les dimensions',
          color: '#6f6f6f', plus: 0, minus: 0, points: []
        };
        Object.keys(byColour).forEach(function (name) {
          if (name === BIV_ALL_KEY) return;
          var source = byColour[name];
          if (!source) return;
          entry.plus += source.plus;
          entry.minus += source.minus;
          entry.points = entry.points.concat(source.points);
        });
        return entry;
      }

      function removeHeatLayers(colourClass) {
        var ids = heatIds(colourClass);
        if (map.getLayer(ids.layer)) map.removeLayer(ids.layer);
        if (map.getSource(ids.source)) map.removeSource(ids.source);
      }

      function refreshStickerHeatmap() {
        var byColour = stickerPointsByColour();
        // Built only while the overview step is up: it is the other five
        // colours' points over again, and nothing else on the page wants it.
        // When that step goes away the key leaves this list, which is what
        // makes the loop below drop its layer.
        if (heatSettings[BIV_ALL_KEY] && heatSettings[BIV_ALL_KEY].enabled) {
          byColour[BIV_ALL_KEY] = aggregateStickerEntry(byColour);
        }
        var colours = Object.keys(byColour).sort();

        heatKnownColours.forEach(function (colourClass) {
          if (colours.indexOf(colourClass) < 0) removeHeatLayers(colourClass);
        });
        heatKnownColours = colours;

        var shown = 0;
        colours.forEach(function (colourClass) {
          var entry = byColour[colourClass];
          var settings = heatSettingsFor(colourClass);
          var ids = heatIds(colourClass);
          var data = bivFeatures(entry, settings);
          bivLastData[colourClass] = data;
          var source = map.getSource(ids.source);
          if (source) {
            source.setData(data);
          } else if (settings.enabled) {
            map.addSource(ids.source, { type: 'geojson', data: data });
            addLayerUnderLabels({
              id: ids.layer,
              type: 'fill',
              source: ids.source,
              paint: {
                'fill-color': ['get', 'fillColor'],
                'fill-opacity': bivOpacity(settings, colourClass),
                // A hairline of the same colour closes the seams between
                // neighbouring bins without drawing a visible grid.
                'fill-outline-color': ['get', 'fillColor']
              }
            });
          }
          if (map.getLayer(ids.layer)) {
            map.setLayoutProperty(
              ids.layer, 'visibility', settings.enabled ? 'visible' : 'none'
            );
            // The spotlight's fade is a paint transition rather than a frame
            // loop; every other use wants the value to land at once, and a
            // transition left switched on would smear the pulse.
            map.setPaintProperty(ids.layer, 'fill-opacity-transition',
              { duration: 0, delay: 0 });
            map.setPaintProperty(
              ids.layer, 'fill-opacity', bivOpacity(settings, colourClass)
            );
          }
          if (settings.enabled) shown += data.features.length;
        });

        renderHeatSections(byColour, colours.filter(function (name) {
          return name !== BIV_ALL_KEY;
        }));
        setStatus($('heatStatus'), shown
          ? shown + ' bin' + (shown === 1 ? '' : 's') + ' shown.'
          : '', shown ? 'ok' : '');
        // The heat bins were just inserted, so the ink has to come back over
        // them -- but only as far as the label floor. Moving it with no
        // beforeId put it on top of the whole style, street names included,
        // and a corridor drawn over a neighbourhood then hid the names of the
        // streets it was made of.
        if (HOLD_LAYER && map.getLayer(HOLD_LAYER)) {
          try { map.moveLayer(HOLD_LAYER, labelFloorId()); } catch (_error) { /* mid swap */ }
        }
        references.forEach(function (reference) {
          if (!map.getLayer(reference.layerId)) return;
          try { map.moveLayer(reference.layerId, labelFloorId()); }
          catch (_error) { map.moveLayer(reference.layerId); }
        });
        raiseStickerMarks();
      }

      function rebuildHeatLayers(colourClass) {
        refreshStickerHeatmap();
      }

      function addHeatSlider(host, label, min, max, step, value, format, onInput) {
        var wrap = document.createElement('label');
        wrap.className = 'slider';
        wrap.appendChild(document.createTextNode(label));
        var input = document.createElement('input');
        input.type = 'range';
        input.min = String(min);
        input.max = String(max);
        input.step = String(step);
        input.value = String(value);
        var readout = document.createElement('span');
        readout.className = 'val';
        readout.textContent = format(value);
        input.addEventListener('input', function () {
          var next = Number(input.value);
          readout.textContent = format(next);
          onInput(next);
        });
        wrap.appendChild(input);
        wrap.appendChild(readout);
        host.appendChild(wrap);
      }

      function buildBivLegend(perLevel) {
        var legend = document.createElement('div');
        legend.className = 'biv-legend';
        var yAxis = document.createElement('span');
        yAxis.className = 'biv-axis-y';
        yAxis.textContent = '\u2212 more \u2192';
        var column = document.createElement('div');
        var grid = document.createElement('div');
        grid.className = 'biv-grid';
        for (var minusLevel = 0; minusLevel < 3; minusLevel += 1) {
          for (var plusLevel = 0; plusLevel < 3; plusLevel += 1) {
            var cell = document.createElement('i');
            cell.style.backgroundColor = BIV_MATRIX[minusLevel][plusLevel];
            cell.title = plusLevel + ' level +, ' + minusLevel + ' level \u2212';
            grid.appendChild(cell);
          }
        }
        var xAxis = document.createElement('div');
        xAxis.className = 'biv-axis-x';
        xAxis.textContent = '+ more \u2192';
        column.appendChild(grid);
        column.appendChild(xAxis);
        legend.appendChild(yAxis);
        legend.appendChild(column);
        var note = document.createElement('div');
        note.className = 'biv-note';
        // The top band begins one past the slider, not at twice it: a bin
        // reaches level 2 as soon as its count exceeds perLevel.
        note.textContent = 'Corner is both at once. Middle band 1–' +
          perLevel + ', top band ' + (perLevel + 1) + '+.';
        legend.appendChild(note);
        return legend;
      }

      function renderHeatSections(byColour, colours) {
        var host = $('heatSections');
        host.textContent = '';
        if (!colours.length) { host.hidden = true; return; }
        colours.forEach(function (colourClass) {
          var entry = byColour[colourClass];
          var settings = heatSettingsFor(colourClass);

          var box = document.createElement('div');
          box.className = 'heat-colour';

          var head = document.createElement('label');
          head.className = 'check';
          var toggle = document.createElement('input');
          toggle.type = 'checkbox';
          toggle.checked = settings.enabled;
          var swatch = document.createElement('span');
          swatch.className = 'swatch';
          swatch.style.backgroundColor = entry.color;
          var name = document.createElement('span');
          name.textContent = entry.label || colourClass;
          var tally = document.createElement('span');
          tally.className = 'tally';
          tally.textContent = entry.plus + ' + / ' + entry.minus + ' \u2212';
          head.appendChild(toggle);
          head.appendChild(swatch);
          head.appendChild(name);
          head.appendChild(tally);
          box.appendChild(head);

          var body = document.createElement('div');
          body.className = 'heat-body';
          body.hidden = !settings.enabled;
          addHeatSlider(body, 'Bin size', 40, 900, 10, settings.binMetres,
            function (v) { return v + ' m'; },
            function (v) { settings.binMetres = v; rebuildHeatLayers(colourClass); });
          addHeatSlider(body, 'Per level', 1, 8, 1, settings.perLevel,
            function (v) { return String(v); },
            function (v) { settings.perLevel = v; rebuildHeatLayers(colourClass); });
          addHeatSlider(body, 'Opacity', 0.05, 1, 0.05, settings.opacity,
            function (v) { return v.toFixed(2); },
            function (v) {
              settings.opacity = v;
              var layerId = heatIds(colourClass).layer;
              if (map.getLayer(layerId)) {
                map.setPaintProperty(
                  layerId, 'fill-opacity', bivOpacity(settings, colourClass)
                );
              }
            });
          body.appendChild(buildBivLegend(settings.perLevel));
          box.appendChild(body);

          toggle.addEventListener('change', function () {
            settings.enabled = toggle.checked;
            body.hidden = !settings.enabled;
            refreshStickerHeatmap();
          });
          host.appendChild(box);
        });
        host.hidden = false;
      }

      $('bivPulse').addEventListener('change', function (event) {
        setBivPulse(event.target.checked);
      });

      $('bivInterpolate').addEventListener('change', function (event) {
        bivInterpolate = event.target.checked;
        // The fade has nothing to act on with the spread switched off.
        $('bivSpread').disabled = !bivInterpolate;
        refreshStickerHeatmap();
      });

      $('bivSpread').addEventListener('input', function (event) {
        bivSpreadDecay = Number(event.target.value);
        $('bivSpreadVal').textContent = Math.round(bivSpreadDecay * 100) + '%';
        if (bivInterpolate) refreshStickerHeatmap();
      });

      $('showMarks').addEventListener('change', function (event) {
        showStickerMarks = event.target.checked;
        paintDrawingMask();
      });

      // The backend filters stickers by colour only, so ask it for every
      // colour that still has a shape switched on and drop the unwanted shapes
      // from the response here.
      function selectedStickerColors() {
        var colours = new Set();
        enabledStickerColors.forEach(function (key) { colours.add(key.split(':')[0]); });
        return lastStickerColors
          .filter(function (item) { return colours.has(item.id); })
          .map(function (item) { return item.id; });
      }

      function keepExportedFeature(feature) {
        var props = feature.properties || {};
        if (props.kind !== 'sticker') return true;
        return enabledStickerColors.has(stickerKey(props.colorClass, props.shape));
      }

      // One chip per colour of sticker actually on the sheet. Routes, areas and
      // symbols are switched by kind instead — their colour says nothing beyond
      // which pen happened to be free.
      // A sticker's meaning is its colour AND its shape, so each combination
      // that actually occurs gets its own chip: a green plus can be shown
      // without the green minuses coming with it.
      function stickerKey(colorClass, shape) { return colorClass + ':' + shape; }

      function stickerAllowed(marker) {
        return enabledStickerColors.has(stickerKey(marker.colorClass, marker.shape));
      }

      function renderStickerColorLegend(colors, stickerColors) {
        var legend = $('colorLegend');
        legend.textContent = '';
        lastColorClasses = Array.isArray(colors) ? colors : [];
        lastStickerColors = Array.isArray(stickerColors) ? stickerColors : [];

        var combos = [];
        lastStickerColors.forEach(function (item) {
          ['circle', 'triangle'].forEach(function (shape) {
            var total = Number(item[shape] || 0);
            if (total > 0) {
              combos.push({
                key: stickerKey(item.id, shape), id: item.id, shape: shape,
                label: item.label, color: item.color, count: total
              });
            }
          });
        });

        // Keep whatever was already unticked; only combinations that are new
        // since the last render start out on.
        var previous = enabledStickerColors;
        var seen = new Set(combos.map(function (combo) { return combo.key; }));
        enabledStickerColors = new Set();
        combos.forEach(function (combo) {
          if (!previous.size || previous.has(combo.key) || !lastRenderedStickerKeys.has(combo.key)) {
            enabledStickerColors.add(combo.key);
          }
        });
        lastRenderedStickerKeys = seen;

        if (!combos.length) {
          legend.hidden = true;
          return;
        }
        combos.forEach(function (combo) {
          var shapeWord = combo.shape === 'circle' ? 'round' : 'triangular';
          var chip = document.createElement('label');
          chip.className = 'color-chip';
          chip.title = combo.count + ' ' + shapeWord + ' ' +
            combo.label.toLowerCase() + ' sticker' + (combo.count === 1 ? '' : 's');

          var checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = enabledStickerColors.has(combo.key);
          checkbox.setAttribute(
            'aria-label', 'Show ' + shapeWord + ' ' + combo.label + ' stickers'
          );
          checkbox.addEventListener('change', function () {
            if (checkbox.checked) enabledStickerColors.add(combo.key);
            else enabledStickerColors.delete(combo.key);
            paintDrawingMask();
          });

          var dot = document.createElement('span');
          dot.className = 'dot';
          dot.style.backgroundColor = combo.color;
          // The chip carries the same mark the map draws: + for round,
          // − for triangular.
          var sign = document.createElement('span');
          sign.className = 'sign';
          sign.textContent = combo.shape === 'circle' ? '+' : '–';
          var text = document.createElement('span');
          text.textContent = combo.label + ' ' + combo.count;
          chip.appendChild(checkbox);
          chip.appendChild(dot);
          chip.appendChild(sign);
          chip.appendChild(text);
          legend.appendChild(chip);
        });
        legend.hidden = false;
      }

      // ---- what the drawing was understood to be -------------------------
      var KIND_LABELS = {
        sticker: { glyph: '●', one: 'sticker', many: 'stickers' },
        line: { glyph: '╱', one: 'path', many: 'paths' },
        area: { glyph: '◯', one: 'area', many: 'areas' }
      };

      // The chips are rebuilt from scratch whenever detection or a legend
      // refresh runs, so anything that switches a kind has to move the set and
      // the box together or the panel and the map disagree about what is on.
      var kindBoxes = {};

      function setKindEnabled(kind, on) {
        if (on) enabledKinds.add(kind);
        else enabledKinds.delete(kind);
        if (kindBoxes[kind]) kindBoxes[kind].checked = on;
      }

      // What belongs on screen for one scene, stated rather than inherited.
      // A trip scene that had to wait for someone to tick "paths" is a scene
      // that shows an empty map to a room.
      function applySceneKinds(wanted) {
        var kinds = wanted || [];
        Object.keys(KIND_LABELS).forEach(function (kind) {
          setKindEnabled(kind, kinds.indexOf(kind) >= 0);
        });
      }

      function selectedKinds() {
        return Object.keys(KIND_LABELS).filter(function (kind) {
          return enabledKinds.has(kind);
        });
      }

      function renderKindLegend(counts) {
        var legend = $('kindLegend');
        legend.textContent = '';
        kindBoxes = {};
        var kinds = counts ? Object.keys(KIND_LABELS).filter(function (kind) {
          return Number(counts[kind] || 0) > 0;
        }) : [];
        enabledKinds = new Set(kinds);
        if (!kinds.length) { legend.hidden = true; return; }
        kinds.forEach(function (kind) {
          var meta = KIND_LABELS[kind];
          var total = Number(counts[kind] || 0);
          var chip = document.createElement('label');
          chip.className = 'kind-chip';
          chip.title = 'Show ' + meta.many + ' on the map and include them in the export';

          var checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = true;
          checkbox.setAttribute('aria-label', 'Show ' + meta.many);
          checkbox.addEventListener('change', function () {
            setKindEnabled(kind, checkbox.checked);
            paintDrawingMask();
          });
          kindBoxes[kind] = checkbox;

          var glyph = document.createElement('span');
          glyph.className = 'glyph';
          glyph.textContent = meta.glyph;
          var text = document.createElement('span');
          var strong = document.createElement('b');
          strong.textContent = String(total);
          text.appendChild(strong);
          text.appendChild(document.createTextNode(
            ' ' + (total === 1 ? meta.one : meta.many)
          ));
          chip.appendChild(checkbox);
          chip.appendChild(glyph);
          chip.appendChild(text);
          legend.appendChild(chip);
        });
        legend.hidden = false;
      }

      function loadDrawingMask(dataUrl) {
        return new Promise(function (resolve, reject) {
          var image = new Image();
          image.onload = function () { resolve(image); };
          image.onerror = function () { reject(new Error('Could not read the detected drawing mask.')); };
          image.src = dataUrl;
        });
      }

      // Rectification and subtraction run on the backend, where the saved clean
      // map PNG can be compared with this exact photographed sheet. Only pixels
      // absent from that reference are returned as a transparent ink mask.
      async function renderInk(targetSheet) {
        if (drawingBusy) return false;
        var fs = frameSize();
        if (!fs.w || !fs.h || paperCorners.length !== 4) return false;
        drawingBusy = true;
        camCanvas.width = fs.w;
        camCanvas.height = fs.h;
        var cctx = camCanvas.getContext('2d');
        try {
          cctx.drawImage(camImg, 0, 0, fs.w, fs.h);
          var response = await fetch('/api/map-sheet-drawing', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              id: (targetSheet && targetSheet.sheetId)
                || (cameraSheet && cameraSheet.id) || (loadedMap && loadedMap.id) || scanSheetId,
              image: camCanvas.toDataURL('image/jpeg', 0.94),
              paperCorners: paperCorners,
              threshold: Number(thresholdInput.value)
            })
          });
          var data = await response.json();
          if (!response.ok || !data.ok) throw new Error(data.error || 'Drawing subtraction failed.');
          // Each photo keeps its own result rather than overwriting a single
          // shared one, so several sheets of the same map can be shown at once
          // and switched on and off individually.
          var result = {
            segmented: Boolean(data.colorMask),
            kindCodes: data.kindCodes || null,
            markers: Array.isArray(data.markers) ? data.markers : [],
            width: data.width,
            height: data.height,
            paths: Array.isArray(data.paths) ? data.paths : [],
            stickerDiameter: (data.alignment && data.alignment.stickerDiameterPx) || 24,
            colors: Array.isArray(data.colors) ? data.colors : [],
            stickerColors: Array.isArray(data.stickerColors) ? data.stickerColors : [],
            counts: data.counts || null,
            inkPixels: data.inkPixels || 0,
            eccRefined: Boolean(data.alignment && data.alignment.eccRefined),
            classImage: data.classMask ? await loadDrawingMask(data.classMask) : null,
            maskImage: await loadDrawingMask(data.colorMask || data.mask)
          };
          if (targetSheet) {
            targetSheet.result = result;
          } else if (cameraSheet || (usingCamera && loadedMap)) {
            // A live-camera capture is a page of its own: its sheet starts with
            // the first result, and later results replace that one photo.
            if (!cameraSheet) cameraSheet = await startSheetOfLoadedMap();
            var live = cameraSheet.photos.filter(function (p) { return p.live; })[0];
            if (!live) {
              live = {
                name: 'live camera', live: true, sheetId: cameraSheet.id,
                reference: cameraSheet, done: true, failed: false, result: null
              };
              cameraSheet.photos.push(live);
            }
            live.result = result;
            refreshReferenceRow(cameraSheet);
          } else {
            soloResult = result;
          }
          refreshLegends();
          paintDrawingMask();
          setStatus($('inkStatus'), aggregateStatus(), data.inkPixels ? 'ok' : '');
          return true;
        } catch (error) {
          setStatus($('inkStatus'), error.message || 'Drawing subtraction failed.', 'err');
          return false;
        } finally {
          drawingBusy = false;
        }
      }

      // Re-add after a basemap style switch wipes custom sources.
      function reAddInkLayer() {
        // A style switch drops every custom source, heatmaps and marks
        // included.
        heatKnownColours = [];
        try { refreshStickerHeatmap(); } catch (_e) {}
        references.forEach(function (reference) {
          if (map.getSource(reference.sourceId)) return;
          try { ensureReferenceLayer(reference); } catch (_e) {}
        });
        try { refreshStickerMarks(); } catch (_e) {}
      }

      // ==================== manual correction ====================
      // Detection is good but not perfect, so everything it produces can be
      // added to or rubbed out by hand. Edits live on the reference sheet
      // selected in the list, in that sheet's own mask pixel coordinates, so
      // they survive re-detection at a different threshold and land in the
      // export next to what was found automatically.
      //
      // The five sticker colours below are the palette the backend classifies
      // into; black and red are the two colours a path is ever drawn in.
      // `question` is what the colour asked on the workshop sheet, written as
      // "positive // negative". A slideshow scene puts the whole question up;
      // the transport button under it carries the positive half alone, which
      // is enough to name the view without a line of prose on a button.
      var MANUAL_STICKER_COLORS = [
        { id: 'yellow', label: 'Yellow', color: '#f7ea55',
          question: 'Lieu de sociabilité // lieu de non-regroupement' },
        { id: 'green', label: 'Green', color: '#5ba24f',
          question: 'Lieu esthétique // inesthétique' },
        { id: 'orange', label: 'Orange', color: '#f59a4a',
          question: 'Intéressant // inintéressant '},
        { id: 'cyan', label: 'Cyan', color: '#4acfff',
          question: 'Calme et tranquille // bruyant et stressant' },
        { id: 'pink', label: 'Pink', color: '#ffb7e0',
          question: 'Sécurisant // dangereux' }
      ];
      var MANUAL_PATH_COLORS = [
        { id: 'black', label: 'Black', color: '#252525' },
        { id: 'red', label: 'Red', color: '#eb6f73' }
      ];

      var activeTool = null;      // { kind:'sticker'|'path'|'eraser', ... }
      var editingReference = null;
      var drawingStroke = null;

      function manualStore(reference) {
        if (!reference.manual) {
          reference.manual = { markers: [], strokes: [], pins: [], erased: null };
        }
        // Sessions saved before pins existed restore without the array.
        if (!reference.manual.pins) reference.manual.pins = [];
        return reference.manual;
      }

      function manualTargetSize(reference) {
        var photo = reference.photos.filter(function (p) { return p.result; })[0];
        var image = photo && photo.result.classImage;
        if (image) {
          return {
            w: image.naturalWidth || image.width,
            h: image.naturalHeight || image.height
          };
        }
        // Restored sessions keep the size the vectors were measured in.
        if (photo && photo.result.width && photo.result.height) {
          return { w: photo.result.width, h: photo.result.height };
        }
        return { w: reference.canvas.width || INK_W, h: reference.canvas.height || INK_H };
      }

      // lng/lat -> that sheet's mask pixels. The sheet corners are an
      // axis-aligned rectangle in lng/lat, so the mapping is a plain linear
      // interpolation between them — the same blend the backend inverts when it
      // turns pixels back into coordinates.
      function lngLatToSheetPixel(reference, lngLat) {
        var c = reference.corners;
        if (!c || c.length !== 4) return null;
        var spanLng = c[1][0] - c[0][0];
        var spanLat = c[3][1] - c[0][1];
        if (!spanLng || !spanLat) return null;
        var size = manualTargetSize(reference);
        return {
          x: ((lngLat.lng - c[0][0]) / spanLng) * (size.w - 1),
          y: ((lngLat.lat - c[0][1]) / spanLat) * (size.h - 1),
          w: size.w,
          h: size.h
        };
      }

      function setActiveTool(tool) {
        activeTool = tool;
        Array.prototype.forEach.call(
          queryAll('#panelEdit .tool'),
          function (button) {
            button.classList.toggle('is-active', Boolean(tool) && button.dataset.toolKey === tool.key);
          }
        );
        var canvas = map.getCanvasContainer();
        canvas.classList.toggle('map-editing', Boolean(tool));
        if (tool) {
          map.dragPan.disable();
          map.doubleClickZoom.disable();
        } else {
          map.dragPan.enable();
          map.doubleClickZoom.enable();
        }
      }

      function selectReferenceForEditing(reference) {
        editingReference = reference;
        references.forEach(function (item) {
          item.row.classList.toggle('editing', item === reference);
        });
      }

      // Which sheet a hand edit lands on: the one clicked in the list, or the
      // one just loaded if nothing has been clicked yet.
      function editTarget() {
        return editingReference || currentReference;
      }

      function buildToolButton(host, key, label, render, onPick) {
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'tool';
        button.dataset.toolKey = key;
        button.title = label;
        button.setAttribute('aria-label', label);
        button.innerHTML = render;
        button.addEventListener('click', function () {
          if (activeTool && activeTool.key === key) { setActiveTool(null); return; }
          setActiveTool(onPick());
        });
        host.appendChild(button);
      }

      function stickerGlyph(color, shape) {
        var stroke = 'stroke="' + color + '" stroke-width="4" stroke-linecap="round"';
        var bars = shape === 'circle'
          ? '<line x1="10" y1="4" x2="10" y2="16" ' + stroke + ' />'
          : '';
        return '<svg width="20" height="20" viewBox="0 0 20 20">' +
          '<line x1="4" y1="10" x2="16" y2="10" ' + stroke + ' />' + bars + '</svg>';
      }

      MANUAL_STICKER_COLORS.forEach(function (entry) {
        buildToolButton(
          $('toolStickerCircle'), 'circle-' + entry.id, entry.label + ' round sticker',
          stickerGlyph(entry.color, 'circle'),
          function () {
            return {
              key: 'circle-' + entry.id, kind: 'sticker', shape: 'circle',
              color: entry.color, colorClass: entry.id, colorLabel: entry.label,
              label: entry.label + ' round sticker'
            };
          }
        );
        buildToolButton(
          $('toolStickerTriangle'), 'triangle-' + entry.id, entry.label + ' triangular sticker',
          stickerGlyph(entry.color, 'triangle'),
          function () {
            return {
              key: 'triangle-' + entry.id, kind: 'sticker', shape: 'triangle',
              color: entry.color, colorClass: entry.id, colorLabel: entry.label,
              label: entry.label + ' triangular sticker'
            };
          }
        );
      });

      MANUAL_PATH_COLORS.forEach(function (entry) {
        buildToolButton(
          $('toolPaths'), 'path-' + entry.id, entry.label + ' path',
          '<svg width="24" height="20" viewBox="0 0 24 20">' +
            '<path d="M3 15 C 8 3, 16 17, 21 5" fill="none" stroke="' + entry.color +
            '" stroke-width="3.5" stroke-linecap="round" /></svg>',
          function () {
            return {
              key: 'path-' + entry.id, kind: 'path',
              color: entry.color, colorClass: entry.id, colorLabel: entry.label,
              label: entry.label + ' path'
            };
          }
        );
      });

      buildToolButton(
        $('toolPin'), 'pin', 'Labelled pin',
        '<svg width="20" height="22" viewBox="0 0 20 22">'
          + '<path d="M10 1.6 C6 1.6 3 4.5 3 8.3 C3 13 10 20.4 10 20.4'
          + ' C10 20.4 17 13 17 8.3 C17 4.5 14 1.6 10 1.6 Z" fill="#f2c14e"'
          + ' stroke="#111" stroke-width="1.6" stroke-linejoin="round" />'
          + '<circle cx="10" cy="8.2" r="2.6" fill="#111" /></svg>',
        function () { return { key: 'pin', kind: 'pin', label: 'Labelled pin' }; }
      );

      buildToolButton(
        $('toolEraser'), 'eraser', 'Eraser',
        '<svg width="22" height="20" viewBox="0 0 22 20">' +
          '<path d="M4 15 L11 4 L18 9 L12 16 Z" fill="none" stroke="#ddd" stroke-width="2.2" ' +
          'stroke-linejoin="round" /><line x1="3" y1="17.5" x2="19" y2="17.5" stroke="#ddd" ' +
          'stroke-width="2.2" stroke-linecap="round" /></svg>',
        function () { return { key: 'eraser', kind: 'eraser', label: 'Eraser' }; }
      );

      $('penWidth').addEventListener('input', function () {
        $('penWidthVal').textContent = $('penWidth').value;
      });

      $('clearManualBtn').addEventListener('click', function () {
        var target = editTarget();
        if (!target) return;
        target.manual = { markers: [], strokes: [], pins: [], erased: null };
        paintReference(target);
        refreshLegends();
        refreshStickerHeatmap();
        refreshManualPins();
        setStatus($('editStatus'), 'Hand edits cleared on ' + sheetLabel(target.id) + '.', 'ok');
      });

      // Hand edits, expressed the same way the backend expresses detection: a
      // sticker is a Point with a colour and a shape, a path is a LineString.
      function manualGeoFeatures(reference) {
        if (!reference || !reference.manual) return [];
        var c = reference.corners;
        if (!c || c.length !== 4) return [];
        var size = manualTargetSize(reference);
        function toLngLat(x, y) {
          var u = size.w > 1 ? x / (size.w - 1) : 0;
          var v = size.h > 1 ? y / (size.h - 1) : 0;
          return [
            Number((c[0][0] + (c[1][0] - c[0][0]) * u).toFixed(8)),
            Number((c[0][1] + (c[3][1] - c[0][1]) * v).toFixed(8))
          ];
        }
        var features = [];
        reference.manual.markers.forEach(function (marker) {
          features.push({
            type: 'Feature',
            properties: {
              kind: 'sticker', shape: marker.shape, color: marker.color,
              colorClass: marker.colorClass, colorLabel: marker.colorLabel,
              source: 'manual'
            },
            geometry: { type: 'Point', coordinates: toLngLat(marker.x, marker.y) }
          });
        });
        (reference.manual.pins || []).forEach(function (pin) {
          features.push({
            type: 'Feature',
            properties: { kind: 'pin', text: pin.text || '', source: 'manual' },
            geometry: { type: 'Point', coordinates: toLngLat(pin.x, pin.y) }
          });
        });
        reference.manual.strokes.forEach(function (stroke) {
          if (stroke.points.length < 2) return;
          features.push({
            type: 'Feature',
            properties: {
              kind: 'line', color: stroke.color, colorClass: stroke.colorClass,
              colorLabel: stroke.colorLabel, strokeWidthPx: stroke.width,
              source: 'manual'
            },
            geometry: {
              type: 'LineString',
              coordinates: stroke.points.map(function (point) {
                return toLngLat(point[0], point[1]);
              })
            }
          });
        });
        return features;
      }

      // ---- pointer handling on the map ---------------------------------
      // Where the eraser's circle crosses a segment, expressed as fractions
      // along it. Cutting at the rim rather than at the nearest vertex matters
      // because a traced path can run straight for hundreds of pixels: rubbing
      // out its middle has to leave both ends, not the whole line or nothing.
      function segmentCircleCuts(a, b, cx, cy, radius) {
        var dx = b[0] - a[0];
        var dy = b[1] - a[1];
        var lengthSq = dx * dx + dy * dy;
        if (!lengthSq) return [];
        var fx = a[0] - cx;
        var fy = a[1] - cy;
        var half = fx * dx + fy * dy;
        var disc = half * half - lengthSq * (fx * fx + fy * fy - radius * radius);
        if (disc <= 0) return [];
        var root = Math.sqrt(disc);
        return [(-half - root) / lengthSq, (-half + root) / lengthSq]
          .filter(function (t) { return t > 0 && t < 1; })
          .sort(function (x, y) { return x - y; });
      }

      // One polyline in, the stretches of it left outside the circle out --
      // zero, one, or several, since a rub through the middle splits a line
      // in two. Runs of a single point are dropped: a line needs two.
      function erasePolyline(points, cx, cy, radius) {
        if (!points || points.length < 2) return [];
        function covers(point) {
          return Math.hypot(point[0] - cx, point[1] - cy) <= radius;
        }
        var runs = [];
        var inside = covers(points[0]);
        var run = inside ? [] : [points[0].slice()];
        for (var i = 1; i < points.length; i += 1) {
          var a = points[i - 1];
          var b = points[i];
          segmentCircleCuts(a, b, cx, cy, radius).forEach(function (t) {
            var cut = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
            if (inside) {
              run = [cut];                    // leaving the circle: a new run
            } else {
              run.push(cut);                  // entering it: close this one
              if (run.length > 1) runs.push(run);
              run = [];
            }
            inside = !inside;
          });
          // Re-read the state from the vertex itself, so a root that landed
          // exactly on the rim cannot leave the walk inverted for the rest of
          // the line.
          if (covers(b)) {
            if (!inside) {
              if (run.length > 1) runs.push(run);
              run = [];
              inside = true;
            }
          } else {
            if (inside) { run = []; inside = false; }
            run.push(b.slice());
          }
        }
        if (run.length > 1) runs.push(run);
        return runs;
      }

      function polylineTouchesCircle(points, cx, cy, radius) {
        for (var i = 0; i < points.length; i += 1) {
          if (Math.hypot(points[i][0] - cx, points[i][1] - cy) <= radius) return true;
          if (i && segmentCircleCuts(points[i - 1], points[i], cx, cy, radius).length) {
            return true;
          }
        }
        return false;
      }

      // The surviving stretches replace the original path, keeping whatever
      // else it carried -- colour, width, the detector's own fields. The list
      // itself comes back untouched when the circle missed everything, which
      // is the common case on a drag and the caller's test for "nothing
      // changed here".
      function erasePaths(paths, cx, cy, radius) {
        var list = paths || [];
        var out = [];
        var changed = false;
        list.forEach(function (path) {
          var points = path.points || [];
          if (points.length < 2 || !polylineTouchesCircle(points, cx, cy, radius)) {
            out.push(path);
            return;
          }
          changed = true;
          erasePolyline(points, cx, cy, radius).forEach(function (run) {
            var piece = {};
            Object.keys(path).forEach(function (key) { piece[key] = path[key]; });
            piece.points = run;
            out.push(piece);
          });
        });
        return changed ? out : paths;   // the very same list, missing nothing
      }

      // The sticker legend is built from these tallies, so a rubbed-out
      // sticker has to stop being counted or the chips would keep advertising
      // marks that are no longer on the sheet. Colours keep their labels; only
      // the numbers are recounted from the markers that remain.
      function tallyStickerColors(markers, previous) {
        var byId = {};
        (previous || []).forEach(function (item) {
          byId[item.id] = {
            id: item.id, label: item.label, color: item.color,
            count: 0, circle: 0, triangle: 0
          };
        });
        markers.forEach(function (marker) {
          var entry = byId[marker.colorClass];
          if (!entry) {
            entry = {
              id: marker.colorClass, label: marker.colorLabel || marker.colorClass,
              color: marker.color, count: 0, circle: 0, triangle: 0
            };
            byId[marker.colorClass] = entry;
          }
          entry.count += 1;
          entry[marker.shape] = (entry[marker.shape] || 0) + 1;
        });
        return Object.keys(byId)
          .map(function (key) { return byId[key]; })
          .filter(function (item) { return item.count > 0; });
      }

      function eraseAt(reference, point) {
        var store = manualStore(reference);
        var radius = Math.max(8, Number($('penWidth').value) * 1.6);
        store.markers = store.markers.filter(function (marker) {
          return Math.hypot(marker.x - point.x, marker.y - point.y) > radius;
        });
        store.pins = (store.pins || []).filter(function (pin) {
          return Math.hypot(pin.x - point.x, pin.y - point.y) > radius;
        });
        // Hand-drawn lines lose the stretch that was rubbed over, not merely
        // the pixels showing it: the points are what gets saved and exported,
        // so cutting them is the only way an erasure outlives a repaint.
        store.strokes = erasePaths(store.strokes, point.x, point.y, radius);

        // Detected marks are edited exactly the same way, and deleted rather
        // than suppressed so re-detecting cannot quietly bring back something
        // already rubbed out. The mask below only lifts the detection raster,
        // which a restored session does not carry at all -- so until the two
        // lines here, the eraser looked on a loaded map like it worked on
        // hand-drawn marks alone.
        reference.photos.forEach(function (photo) {
          if (!photo.result) return;
          var result = photo.result;
          var markers = (result.markers || []).filter(function (marker) {
            return Math.hypot(marker.x - point.x, marker.y - point.y) > radius;
          });
          var paths = erasePaths(result.paths, point.x, point.y, radius);
          if (markers.length !== (result.markers || []).length) {
            result.markers = markers;
            result.stickerColors = tallyStickerColors(markers, result.stickerColors);
            if (result.counts) result.counts.sticker = markers.length;
          }
          if (paths !== result.paths) {
            result.paths = paths;
            // A rub through the middle of a line leaves two, so this is a
            // recount rather than a decrement.
            if (result.counts) result.counts.line = paths.length;
          }
        });

        if (!store.erased) {
          store.erased = document.createElement('canvas');
          store.erased.width = point.w;
          store.erased.height = point.h;
        }
        var ectx = store.erased.getContext('2d');
        ectx.fillStyle = '#fff';
        ectx.beginPath();
        ectx.arc(point.x, point.y, radius, 0, Math.PI * 2);
        ectx.fill();
      }

      function onEditPointerDown(event) {
        // Alt belongs to the layer-shift drag; a stroke must not start under it.
        if (event.originalEvent && event.originalEvent.altKey) return;
        if (!activeTool) return;
        var target = editTarget();
        // The first mark on a loaded map starts that page's sheet. The eraser
        // has nothing to act on there, so it never does.
        if (!target && loadedMap && activeTool.kind !== 'eraser') target = startSheetForHandEdit();
        if (!target) {
          setStatus($('editStatus'), 'Load a reference map first.', 'err');
          return;
        }
        event.preventDefault();
        var point = lngLatToSheetPixel(target, event.lngLat);
        if (!point) return;
        if (activeTool.kind === 'sticker') {
          manualStore(target).markers.push({
            x: point.x, y: point.y, shape: activeTool.shape,
            color: activeTool.color, colorClass: activeTool.colorClass,
            colorLabel: activeTool.colorLabel, manual: true
          });
          paintReference(target);
          refreshLegends();
          refreshStickerHeatmap();
          setStatus($('editStatus'), 'Added a ' + activeTool.label.toLowerCase() + '.', 'ok');
          return;
        }
        if (activeTool.kind === 'pin') {
          var text = String($('pinLabel').value || '').trim();
          if (!text) {
            setStatus($('editStatus'), 'Type a name for the pin first.', 'err');
            $('pinLabel').focus();
            return;
          }
          manualStore(target).pins.push({ x: point.x, y: point.y, text: text });
          paintReference(target);
          refreshManualPins();
          setStatus($('editStatus'), 'Pin "' + text + '" added.', 'ok');
          return;
        }
        if (activeTool.kind === 'eraser') {
          drawingStroke = { erasing: true, reference: target };
          eraseAt(target, point);
          paintReference(target);
          return;
        }
        drawingStroke = {
          reference: target,
          points: [[point.x, point.y]],
          color: activeTool.color,
          colorClass: activeTool.colorClass,
          colorLabel: activeTool.colorLabel,
          width: Number($('penWidth').value)
        };
        manualStore(target).strokes.push(drawingStroke);
        // Enable the "line" kind before the first move paints, or the stroke
        // stays invisible until the drag ends and the legend catches up.
        refreshLegends();
        paintReference(target);
      }

      function onEditPointerMove(event) {
        if (!drawingStroke) return;
        var target = drawingStroke.reference;
        var point = lngLatToSheetPixel(target, event.lngLat);
        if (!point) return;
        if (drawingStroke.erasing) eraseAt(target, point);
        else drawingStroke.points.push([point.x, point.y]);
        paintReference(target);
      }

      function onEditPointerUp() {
        if (!drawingStroke) return;
        var target = drawingStroke.reference;
        drawingStroke = null;
        paintReference(target);
        refreshLegends();
        refreshStickerHeatmap();
        setStatus($('editStatus'), 'Edit saved on map ' + target.id + '.', 'ok');
      }


      // ==================== alt-drag: slide the digitised layer ====================
      // Hold Alt and drag on the map: every visible sheet's content -- strokes,
      // stickers, pins, heat -- slides with the mouse while the MAP stays put.
      // The manual remedy for a scan registered against a sheet whose framing
      // was a few dozen metres off: line the drawing back up with the streets
      // by eye. Committing edits the references' corners, and everything the
      // sheets carry is stored in sheet-pixel space, so one corner shift moves
      // all of it coherently -- and saving the session keeps it.
      var altShift = null;   // { start: LngLat, dLng, dLat }

      function altShiftRefs() {
        return references.filter(function (reference) {
          return reference.visible !== false
            && reference.corners && reference.corners.length === 4;
        });
      }

      function altShiftPreview(dLng, dLat) {
        altShiftRefs().forEach(function (reference) {
          var source;
          try { source = map.getSource(reference.sourceId); } catch (_e) { return; }
          if (source && typeof source.setCoordinates === 'function') {
            source.setCoordinates(reference.corners.map(function (corner) {
              return [corner[0] + dLng, corner[1] + dLat];
            }));
          }
        });
      }

      function altShiftCommit() {
        if (!altShift) return;
        var dLng = altShift.dLng, dLat = altShift.dLat;
        altShift = null;
        map.getCanvas().style.cursor = '';
        if (!dLng && !dLat) return;
        altShiftRefs().forEach(function (reference) {
          reference.corners = reference.corners.map(function (corner) {
            return [corner[0] + dLng, corner[1] + dLat];
          });
          // The path visualisations cache on geometry derived from the
          // corners; a stale cache would leave the flow where the ink was.
          reference.vizCache = null;
          if (reference.flowAnim) reference.flowAnim = null;
          ensureReferenceLayer(reference);
        });
        refreshManualPins();
        paintDrawingMask();
        refreshStickerHeatmap();
        references.forEach(paintReference);
        var metres = Math.round(Math.hypot(
          dLng * 111320 * Math.cos(map.getCenter().lat * Math.PI / 180),
          dLat * 110540));
        setStatus($('inkStatus'),
          'Layer shifted ' + metres + ' m \u2014 save the session to keep it.', 'ok');
      }

      map.on('mousedown', function (event) {
        if (!event.originalEvent || !event.originalEvent.altKey) return;
        if (!altShiftRefs().length) return;
        event.preventDefault();          // the ink moves; the map holds still
        altShift = { start: event.lngLat, dLng: 0, dLat: 0 };
        map.getCanvas().style.cursor = 'grabbing';
      });
      map.on('mousemove', function (event) {
        if (!altShift) return;
        altShift.dLng = event.lngLat.lng - altShift.start.lng;
        altShift.dLat = event.lngLat.lat - altShift.start.lat;
        altShiftPreview(altShift.dLng, altShift.dLat);
      });
      // Committed wherever the button comes up -- over the map or off it.
      map.on('mouseup', altShiftCommit);
      window.addEventListener('mouseup', altShiftCommit);

      map.on('mousedown', onEditPointerDown);
      map.on('mousemove', onEditPointerMove);
      map.on('mouseup', onEditPointerUp);
      map.on('touchstart', onEditPointerDown);
      map.on('touchmove', onEditPointerMove);
      map.on('touchend', onEditPointerUp);

      // ==================== photos from a phone ==========================
      // A phone on the same network (or through the quick tunnel) opens
      // /phone-capture, types the map ID, and sends a photo. The server gives
      // every photo its own sheet number on arrival ("7_4") -- one map has as
      // many pages as people, and the phone cannot know which page it is. This
      // end polls for those, loads the map's reference, and drops the photo
      // into the very same queue the drop-zone uses -- so a phone capture and
      // a dragged file are indistinguishable from here on, alignment,
      // detection and all.
      //
      // Each sheet is saved into a session file of its own, named for the
      // sheet, so a workshop ends with one file per page digitised and
      // reopening the page picks up where it left off.
      var captureWatchOn = false;
      var captureSeq = 0;
      var captureTimer = 0;
      var captureBusy = false;
      var captureDone = 0;

      function captureSessionId(sheetId) {
        return 'auto-map-' + String(sheetId).replace(/[^A-Za-z0-9_-]/g, '');
      }

      // Persist the sheet's work under its own id. The reference must be the
      // only one in the payload, or two sheets open at once would each write
      // the other's marks into their file.
      async function saveCaptureSession(reference) {
        var state = collectSessionState();
        state.references = (state.references || []).filter(function (entry) {
          return String(entry.id) === String(reference.id);
        });
        if (!state.references.length) return;
        state.name = sheetLabel(reference.id) + ' (phone capture)';
        // The ids must describe the SHEET this file is for, not whatever is
        // typed in the reference box: reopening the session resolves its
        // primary sheet from them, and the phone may well have been shooting
        // a different map than the one the laptop last loaded by hand.
        state.mapId = mapIdOf(reference.id);
        state.sheetId = String(reference.id);
        var response = await fetch('/api/imobyl/sessions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: captureSessionId(reference.id),
            name: state.name,
            state: state
          })
        });
        var data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || 'save failed');
      }

      // Wait for the queue to finish this photo. runQueue() is fire-and-forget,
      // so completion is observed on the sheet entry it fills in rather than
      // awaited directly.
      function waitForSheet(sheet, timeoutMs) {
        var deadline = Date.now() + (timeoutMs || 180000);
        return new Promise(function (resolve) {
          var tick = window.setInterval(function () {
            if (sheet.done || sheet.failed || Date.now() > deadline) {
              window.clearInterval(tick);
              resolve(Boolean(sheet.result));
            }
          }, 400);
        });
      }

      async function ingestCapture(capture) {
        // Numbered by the server on arrival. A capture queued by an older
        // phone page names only its map, and is numbered here instead.
        var sheetId = String(capture.sheetId || '');
        if (sheetId.indexOf('_') < 0) {
          sheetId = await startDigitizedSheet(mapIdOf(capture.mapId || sheetId));
        }
        var label = sheetLabel(sheetId);
        setStatus($('captureStatus'), label + ': loading reference…', 'busy');
        var reference = findReference(sheetId);
        if (!reference) {
          // A new page: fetch its map's georeferencing exactly as "Load
          // reference" would.
          await loadMapSheet(sheetId, false);
          reference = addReference(sheetId, mapCorners);
          scanSheetId = sheetId;
          selectReferenceForEditing(reference);
          refreshReferenceRow(reference);
        }
        currentReference = reference;

        var response = await fetch('/api/captures/' + encodeURIComponent(capture.id) + '/image');
        if (!response.ok) throw new Error('image ' + response.status);
        var blob = await response.blob();

        var sheet = {
          name: 'phone ' + capture.id,
          url: URL.createObjectURL(blob),
          sheetId: reference.id,
          reference: reference,
          done: false,
          failed: false,
          result: null
        };
        reference.photos.push(sheet);
        sheets.push(sheet);
        refreshReferenceRow(reference);
        setStatus($('captureStatus'), label + ': digitising…', 'busy');
        runQueue();

        var ok = await waitForSheet(sheet);
        if (!ok) throw new Error('detection failed');
        await saveCaptureSession(reference);
        captureDone += 1;
        setStatus($('captureStatus'),
          captureDone + ' captured · last: ' + label, 'ok');
      }

      async function pollCaptures() {
        if (!captureWatchOn || captureBusy) return;
        captureBusy = true;
        try {
          var response = await fetch('/api/captures?since=' + captureSeq,
            { cache: 'no-store' });
          var data = await response.json();
          if (!data.ok) throw new Error(data.error || 'poll failed');
          for (var i = 0; i < (data.captures || []).length; i += 1) {
            var capture = data.captures[i];
            if (!captureWatchOn) break;
            try {
              await ingestCapture(capture);
            } catch (error) {
              setStatus($('captureStatus'),
                sheetLabel(capture.sheetId || capture.mapId) + ': '
                  + (error.message || 'failed'), 'err');
            }
            // Consumed either way: a photo that cannot be processed would
            // otherwise be retried on every poll for the rest of the session.
            captureSeq = Math.max(captureSeq, capture.seq);
            try {
              await fetch('/api/captures/' + encodeURIComponent(capture.id) + '/done',
                { method: 'POST' });
            } catch (_error) { /* the seq guard already prevents a repeat */ }
          }
        } catch (error) {
          setStatus($('captureStatus'), error.message || 'Poll failed.', 'err');
        } finally {
          captureBusy = false;
        }
      }

      // A quick tunnel normally connects within ten seconds or so. Past this,
      // the Wi-Fi address is shown after all -- flagged as such -- while the
      // tunnel keeps being checked for in the background.
      var TUNNEL_WAIT_MS = 45000;
      var captureTargetTimer = 0;

      // Started with --cloudflare-tunnel, the QR must carry the tunnel address:
      // a Wi-Fi-only QR shown while cloudflared is still connecting strands
      // every phone that is not on this network. So until the tunnel answers,
      // a placeholder holds the QR's place. The address itself is on the QR's
      // tooltip rather than printed under it.
      async function showCaptureTarget(waitingSince) {
        window.clearTimeout(captureTargetTimer);
        captureTargetTimer = 0;
        if (!captureWatchOn) return;
        var began = waitingSince || Date.now();
        var qr = $('captureQr');
        var data;
        try {
          data = await (await fetch('/api/capture-target', { cache: 'no-store' })).json();
        } catch (_error) {
          qr.textContent = '';
          delete qr.dataset.url;
          setStatus($('captureHint'), 'Could not reach the server for the phone address.', 'err');
          return;
        }
        if (!captureWatchOn) return;
        var waited = Date.now() - began;
        var connecting = !data.tunnel && data.tunnelStatus === 'starting';
        if (connecting && waited < TUNNEL_WAIT_MS) {
          delete qr.dataset.url;
          qr.title = 'Waiting for the Cloudflare tunnel to connect';
          showQrPlaceholder('Connecting tunnel… ' + Math.round(waited / 1000) + ' s');
          setStatus($('captureHint'), '');
          captureTargetTimer = window.setTimeout(function () {
            void showCaptureTarget(began);
          }, 1000);
          return;
        }

        var lan = (data.lan || [])[0] || '';
        var url = (data.tunnel || lan || window.location.origin) + '/phone-capture';
        if (qr.dataset.url !== url) {
          qr.dataset.url = url;
          qr.title = url;
          drawCaptureQr(url);
        }
        if (data.tunnel) {
          setStatus($('captureHint'), 'via the Cloudflare tunnel — works off this network too', 'ok');
        } else if (connecting) {
          setStatus($('captureHint'), 'The tunnel is still not connected — this QR works on the same Wi-Fi only. It switches to the tunnel as soon as it connects.', 'warn');
          captureTargetTimer = window.setTimeout(function () {
            void showCaptureTarget(began);
          }, 3000);
        } else if (data.tunnelStatus === 'error' || data.tunnelStatus === 'unavailable') {
          setStatus($('captureHint'), (data.tunnelStatus === 'unavailable'
            ? 'cloudflared is not installed'
            : 'The tunnel failed' + (data.tunnelError ? ' (' + data.tunnelError + ')' : ''))
            + ' — same Wi-Fi only.', 'err');
        } else {
          setStatus($('captureHint'), lan
            ? 'same Wi-Fi only (no tunnel running)'
            : 'no reachable address found', '');
        }
      }

      function showQrPlaceholder(text) {
        var host = $('captureQr');
        var box = host.querySelector('.qr-wait');
        if (!box) {
          host.textContent = '';
          box = document.createElement('div');
          box.className = 'qr-wait';
          host.appendChild(box);
        }
        box.textContent = text;
      }

      function drawCaptureQr(url) {
        var host = $('captureQr');
        host.textContent = '';
        // The CDN script is optional; without it the address has to be typed,
        // so it takes the QR's place.
        if (!window.QRCode) { showQrPlaceholder(url); return; }
        try {
          new window.QRCode(host, {
            text: url, width: 148, height: 148,
            colorDark: '#101010', colorLight: '#ffffff'
          });
        } catch (_error) { showQrPlaceholder(url); }
      }

      // The launcher-level shortcut: show the QR without having to open a
      // panel first. It reuses /api/capture-target, so it hands out the same
      // address the receiver does -- tunnel when one is up, LAN otherwise.
      $('captureWatchBtn').addEventListener('click', function () {
        captureWatchOn = !captureWatchOn;
        this.classList.toggle('is-active', captureWatchOn);
        $('capturePair').hidden = !captureWatchOn;
        this.textContent = captureWatchOn ? 'Listening…' : 'Listen for phone';
        if (captureWatchOn) {
          void showCaptureTarget();
          // Start from the newest capture: photos taken before anyone pressed
          // Listen are history, not a backlog to replay.
          fetch('/api/captures?since=0', { cache: 'no-store' })
            .then(function (r) { return r.json(); })
            .then(function (data) {
              captureSeq = Number(data.seq) || 0;
              setStatus($('captureStatus'), 'Waiting for photos…', 'busy');
              captureTimer = window.setInterval(pollCaptures, 2500);
            })
            .catch(function () {
              setStatus($('captureStatus'), 'Could not reach the server.', 'err');
            });
        } else {
          window.clearInterval(captureTimer);
          captureTimer = 0;
          window.clearTimeout(captureTargetTimer);
          captureTargetTimer = 0;
          delete $('captureQr').dataset.url;
          $('captureQr').textContent = '';
          setStatus($('captureHint'), '');
          setStatus($('captureStatus'), '');
        }
      });

      // ==================== paper window ====================
      // A sheet of A3 with AprilTags in its border is a window onto the
      // street. The camera calibrated on the workshop page sees the sheet on
      // the projected table, and every tag comes back from /api/tags with its
      // corners in surface uv -- the unit square of the projected screen. From
      // the tags in the border this fits the sheet's pose, paints its outline
      // black (so the printed tags keep their contrast under the projector)
      // and projects a street-level view into the white inside. Where the
      // view is FROM is a second tag on the map, printed on the frame's
      // second page; its id comes from the layout, never from here.
      //
      // Nothing here touches the calibration. The corners set on the workshop
      // page live in the backend, which turns camera pixels into uv for every
      // tag before this page sees them; the only assumption made here is that
      // this page is what is being projected, so uv times the window size is
      // a screen pixel -- the same assumption the workshop page makes.
      var PW_POLL_MS = 80;
      var PW_HOLD_MS = 1800;          // keep the last pose this long once the sheet is lost
      // A single tag extrapolates twenty times its own size to reach the far
      // corner of the sheet, and jitters accordingly; two is the floor.
      var PW_MIN_TAGS = 2;
      var PW_SMOOTH = 0.4;            // per-poll blend toward the freshly fitted quad
      var PW_MOVE_M = 6;              // re-ask for imagery once the pointer has moved this far
      var PW_SEARCH_M = 80;
      var PW_HEADING_OFFSET = 0;      // if "tag up" should mean something other than north
      // The camera reads a resting tag's angle a degree or two differently
      // from frame to frame. The view holds until the tag has turned this
      // far, and only then follows -- smoothly, from wherever it was.
      var PW_HEADING_STEP = 3;
      // The panorama turns on its own, slowly, so a window left alone still
      // shows the whole street. The tag's heading is where the turn is
      // measured from, so turning the tag still swings the view.
      var PW_SPIN_DEG_S = 6;          // a full turn a minute
      var pwSpin = 0;
      // Likewise the sheet: a fitted corner has to move this far before the
      // window is redrawn, or it creeps by fractions of a pixel all day.
      var PW_STILL_PX = 1.5;
      var PW_VIEW_W = 960;            // the panel's own width before the warp
      // Tapping the window shows the next street view from the same hexagon.
      // One hexagon usually holds several places worth standing; the pointer
      // only ever picks one of them, so a tap walks the rest and wraps.
      var PW_HEX_VIEWS = 5;           // how many to keep per hexagon
      var PW_TAP_DWELL_MS = 450;      // a tag must rest this long to count as a tap
      var PW_TAP_COOLDOWN_MS = 900;   // and this long before it can tap again

      var pwLayout = null;
      var pwOn = false;
