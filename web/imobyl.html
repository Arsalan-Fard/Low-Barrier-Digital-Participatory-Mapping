      var pwTimer = 0;
      var pwBusy = false;
      var pwQuad = null;              // the inside, four screen points
      var pwCellQuads = null;         // one four-point quad per tag cell
      var pwLastSeen = 0;
      var pwPointer = null;           // { lng, lat, heading }
      var pwPointerTagSeenAt = 0;     // when tag 24 itself was last in view
      // The hexagon whose views have been collected, the views themselves, and
      // where in the loop we are. Keyed "q,r" so crossing into a new hexagon
      // throws the old list away and hands the window back to the pointer.
      var pwHexViews = { id: '', list: [], index: 0, loading: false };
      // While set, pwAim stops asking for the nearest imagery: the operator has
      // chosen one of the hexagon's views and it must stay chosen.
      var pwManualCell = '';
      var pwTapState = { since: 0, fired: false, last: 0 };
      var pwHeading = 0;              // what the view is turned to
      var pwHeadingHeld = null;       // the last heading the tag was allowed to set
      var pwPano = null;
      var pwMode = 'note';
      var pwSdkPromise = null;
      var pwAsking = false;
      var pwAskedAt = null;           // where imagery was last asked for
      var pwAskedWhen = 0;

      // ---- geometry: pure, so it can be tested without a camera ----------
      // Gaussian elimination with partial pivoting; null when singular.
      function pwSolve(M, r) {
        var n = r.length;
        var A = M.map(function (row, i) { return row.concat([r[i]]); });
        for (var col = 0; col < n; col += 1) {
          var pivot = col;
          for (var i = col + 1; i < n; i += 1) {
            if (Math.abs(A[i][col]) > Math.abs(A[pivot][col])) pivot = i;
          }
          if (Math.abs(A[pivot][col]) < 1e-12) return null;
          var swap = A[col]; A[col] = A[pivot]; A[pivot] = swap;
          for (var k = col + 1; k < n; k += 1) {
            var f = A[k][col] / A[col][col];
            if (!f) continue;
            for (var j = col; j <= n; j += 1) A[k][j] -= f * A[col][j];
          }
        }
        var x = new Array(n);
        for (var i2 = n - 1; i2 >= 0; i2 -= 1) {
          var acc = A[i2][n];
          for (var j2 = i2 + 1; j2 < n; j2 += 1) acc -= A[i2][j2] * x[j2];
          x[i2] = acc / A[i2][i2];
        }
        return x;
      }

      // Least-squares homography from (x, y) to (u, v) with h33 fixed at 1:
      // four or more correspondences, solved through the normal equations.
      // `scale` divides x and y first, which keeps millimetres and pixels
      // from swamping the unit-square side of the system.
      function pwHomography(pairs, scale) {
        if (!pairs || pairs.length < 4) return null;
        var M = [], r = [];
        for (var i = 0; i < 8; i += 1) { M.push([0, 0, 0, 0, 0, 0, 0, 0]); r.push(0); }
        pairs.forEach(function (p) {
          var x = p.x / scale, y = p.y / scale, u = p.u, v = p.v;
          [[x, y, 1, 0, 0, 0, -x * u, -y * u, u],
           [0, 0, 0, x, y, 1, -x * v, -y * v, v]].forEach(function (row) {
            for (var a = 0; a < 8; a += 1) {
              for (var b = 0; b < 8; b += 1) M[a][b] += row[a] * row[b];
              r[a] += row[a] * row[8];
            }
          });
        });
        var h = pwSolve(M, r);
        if (!h || h.some(function (value) { return !isFinite(value); })) return null;
        return {
          h: h,
          apply: function (x, y) {
            x /= scale; y /= scale;
            var d = h[6] * x + h[7] * y + 1;
            return [(h[0] * x + h[1] * y + h[2]) / d, (h[3] * x + h[4] * y + h[5]) / d];
          },
          // The same map in unscaled units, for CSS.
          raw: [h[0] / scale, h[1] / scale, h[2], h[3] / scale, h[4] / scale, h[5],
                h[6] / scale, h[7] / scale, 1]
        };
      }

      // The sheet's pose from whichever border tags are in view: the inside
      // and the outline as four screen points each, or null. Every visible
      // tag contributes its four corners, paired with where those corners
      // were printed, so two tags already give eight correspondences.
      function pwSheetPose(layout, tags, width, height) {
        var byId = {};
        (tags || []).forEach(function (tag) {
          if (tag && Array.isArray(tag.uvCorners) && tag.uvCorners.length === 4) byId[tag.id] = tag;
        });
        var pairs = [];
        var seen = 0;
        var ids = [];
        layout.tags.forEach(function (tag) {
          var live = byId[tag.id];
          if (!live) return;
          var ok = true;
          var mine = tag.corners.map(function (corner, i) {
            var uv = live.uvCorners[i];
            if (!uv || !isFinite(uv.u) || !isFinite(uv.v)) ok = false;
            return { x: corner[0], y: corner[1], u: uv ? uv.u : 0, v: uv ? uv.v : 0 };
          });
          if (!ok) return;
          seen += 1;
          ids.push(tag.id);
          Array.prototype.push.apply(pairs, mine);
        });
        if (seen < PW_MIN_TAGS) return { seen: seen, ids: ids, quad: null, page: null };
        var H = pwHomography(pairs, 100);
        if (!H) return { seen: seen, ids: ids, quad: null, page: null };
        function toScreen(x, y) {
          var uv = H.apply(x, y);
          return [uv[0] * width, uv[1] * height];
        }
        var I = layout.interiorMm;
        var P = layout.pageMm;
        // Every cell, seen or not: the pose places the whole sheet, and a
        // cell whose tag the camera has lost still needs to be kept dark.
        var half = (layout.cellMm || layout.borderMm) / 2;
        var cells = layout.tags.map(function (tag) {
          return [toScreen(tag.cx - half, tag.cy - half), toScreen(tag.cx + half, tag.cy - half),
                  toScreen(tag.cx + half, tag.cy + half), toScreen(tag.cx - half, tag.cy + half)];
        });
        return {
          seen: seen,
          ids: ids,
          quad: [toScreen(I[0], I[1]), toScreen(I[2], I[1]), toScreen(I[2], I[3]), toScreen(I[0], I[3])],
          page: [toScreen(0, 0), toScreen(P[0], 0), toScreen(P[0], P[1]), toScreen(0, P[1])],
          cells: cells
        };
      }

      // A CSS transform taking the panel's own w x h rectangle onto a quad.
      function pwMatrix3d(w, h, quad) {
        var H = pwHomography([
          { x: 0, y: 0, u: quad[0][0], v: quad[0][1] },
          { x: w, y: 0, u: quad[1][0], v: quad[1][1] },
          { x: w, y: h, u: quad[2][0], v: quad[2][1] },
          { x: 0, y: h, u: quad[3][0], v: quad[3][1] }
        ], w);
        if (!H) return '';
        var m = H.raw;
        return 'matrix3d(' + [m[0], m[3], 0, m[6], m[1], m[4], 0, m[7], 0, 0, 1, 0, m[2], m[5], 0, 1]
          .map(function (value) { return Number(value.toFixed(8)); }).join(',') + ')';
      }

      // A tag's uv is normalised across the PROJECTED surface, i.e. across the
      // viewport. Everything drawn here lives inside #projectionWarp, which the
      // page warp bends, so a uv has to be un-warped to find the layer point
      // that ends up under the tag. Without a warp this is just uv x viewport.
      function pwUvPx(u, v, width, height) {
        if (window.CompactPageWarp && typeof window.CompactPageWarp.uvToLayer === 'function') {
          var p = window.CompactPageWarp.uvToLayer(u, v, width, height);
          return [p.x, p.y];
        }
        return [Number(u) * width, Number(v) * height];
      }

      // Where the pointer tag stands and which way it faces, in screen
      // pixels: "up" runs from the middle of its bottom edge to the middle
      // of its top edge, and a bearing is measured clockwise from north.
      function pwPointerFrom(tag, width, height, bearing) {
        if (!tag || !tag.uv || !isFinite(tag.uv.u) || !isFinite(tag.uv.v)) return null;
        if (!Array.isArray(tag.uvCorners) || tag.uvCorners.length !== 4) return null;
        var c = tag.uvCorners.map(function (q) { return pwUvPx(q.u, q.v, width, height); });
        var top = [(c[0][0] + c[1][0]) / 2, (c[0][1] + c[1][1]) / 2];
        var bottom = [(c[2][0] + c[3][0]) / 2, (c[2][1] + c[3][1]) / 2];
        var dx = top[0] - bottom[0], dy = top[1] - bottom[1];
        var heading = Math.atan2(dx, -dy) * 180 / Math.PI + (bearing || 0) + PW_HEADING_OFFSET;
        return {
          px: pwUvPx(tag.uv.u, tag.uv.v, width, height),
          heading: ((heading % 360) + 360) % 360
        };
      }

      // The heading the view should follow, given where it is held and what
      // the tag now says: the held value until the tag has turned by the
      // step, then the new one. Pure, so it can be tested.
      function pwHoldHeading(target, held, step) {
        if (held === null || held === undefined) return target;
        var gap = Math.abs(((target - held + 540) % 360) - 180);
        return gap >= step ? target : held;
      }

      function pwMoved(old, fresh, byPx) {
        if (!old) return true;
        return fresh.some(function (point, i) {
          return Math.hypot(point[0] - old[i][0], point[1] - old[i][1]) >= byPx;
        });
      }

      function pwBlend(old, fresh) {
        if (!old) return fresh;
        return fresh.map(function (point, i) {
          return [old[i][0] + (point[0] - old[i][0]) * PW_SMOOTH,
                  old[i][1] + (point[1] - old[i][1]) * PW_SMOOTH];
        });
      }

      function pwMetres(a, b) {
        var mid = (a.lat + b.lat) / 2 * Math.PI / 180;
        var dx = (b.lng - a.lng) * 111320 * Math.cos(mid);
        var dy = (b.lat - a.lat) * 110540;
        return Math.sqrt(dx * dx + dy * dy);
      }

      // ---- the view inside the sheet -------------------------------------
      function pwHost() { return $('paperWindow'); }
      function pwPart(selector) { return pwHost().querySelector(selector); }

      function pwShowMode(mode) {
        pwMode = mode;
        pwPart('.pw-pano').style.visibility = mode === 'pano' ? 'visible' : 'hidden';
        pwPart('.pw-still').hidden = mode !== 'still';
        pwPart('.pw-note').hidden = mode !== 'note';
      }

      function pwNote(text) {
        pwPart('.pw-note').textContent = text;
        pwShowMode('note');
        pwPart('.pw-caption').hidden = true;
      }

      function pwCaption(text) {
        var plate = pwPart('.pw-caption');
        plate.textContent = text || '';
        plate.hidden = !text;
      }

      function pwSdk() {
        if (window.google && window.google.maps && window.google.maps.StreetViewPanorama) {
          return Promise.resolve(window.google.maps);
        }
        if (pwSdkPromise) return pwSdkPromise;
        pwSdkPromise = fetch('/api/google-maps-key', { cache: 'no-store' })
          .then(function (response) { return response.json(); })
          .then(function (data) {
            var key = data && data.ok && data.key ? String(data.key).trim() : '';
            if (!key) return null;
            return new Promise(function (resolve) {
              var tag = document.createElement('script');
              tag.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key);
              tag.async = true;
              tag.addEventListener('load', function () {
                resolve(window.google && window.google.maps ? window.google.maps : null);
              });
              tag.addEventListener('error', function () { resolve(null); });
              document.head.appendChild(tag);
            });
          })
          .catch(function () { return null; });
        return pwSdkPromise;
      }

      // Mapillary gives a still, so it cannot be turned with the pointer --
      // but a photograph of the place still beats a note saying there is none.
      function pwMapillary(at) {
        var query = '/api/mapillary/near?lng=' + encodeURIComponent(at.lng)
          + '&lat=' + encodeURIComponent(at.lat) + '&radius=' + PW_SEARCH_M + '&limit=8';
        return fetch(query, { cache: 'no-store' })
          .then(function (response) { return response.json(); })
          .then(function (data) {
            var best = null, bestAway = Infinity;
            ((data && data.images) || []).forEach(function (image) {
              if (!image || !image.url) return;
              var away = isFinite(image.lng) && isFinite(image.lat)
                ? pwMetres(at, { lng: Number(image.lng), lat: Number(image.lat) }) : Infinity;
              if (away < bestAway) { best = image; bestAway = away; }
            });
            if (!best) { pwNote('Pas d\u2019image de rue ici'); return; }
            var still = pwPart('.pw-still');
            still.src = best.url;
            pwShowMode('still');
            pwCaption('');
          })
          .catch(function () { pwNote('Pas d\u2019image de rue ici'); });
      }

      // Asks before showing: dropping a panorama on a spot with no imagery
      // renders Google's grey "no imagery" screen, which reads as a broken
      // window rather than as an honest absence.
      function pwAskImagery(at, heading) {
        if (pwAsking) return;
        pwAsking = true;
        pwAskedAt = { lng: at.lng, lat: at.lat };
        pwAskedWhen = Date.now();
        pwSdk().then(function (maps) {
          // No OUTDOOR source means no way to keep interiors out, so treat it
          // like having no SDK rather than searching unfiltered.
          if (!maps || !maps.StreetViewService || !maps.StreetViewPanorama
              || !maps.StreetViewSource || !maps.StreetViewSource.OUTDOOR) {
            pwAsking = false;
            return pwMapillary(at);
          }
          var service = new maps.StreetViewService();
          var ask = {
            location: { lat: at.lat, lng: at.lng }, radius: PW_SEARCH_M,
            source: maps.StreetViewSource.OUTDOOR
          };
          service.getPanorama(ask, function (data, status) {
            pwAsking = false;
            if (status !== 'OK' || !data || !data.location || !data.location.pano) {
              pwMapillary(at);
              return;
            }
            var host = pwPart('.pw-pano');
            if (!pwPano) {
              pwPano = new maps.StreetViewPanorama(host, {
                pano: data.location.pano,
                pov: { heading: heading, pitch: 0 },
                zoom: 0,
                disableDefaultUI: true,
                addressControl: false, fullscreenControl: false, linksControl: false,
                panControl: false, zoomControl: false, enableCloseButton: false,
                motionTracking: false, motionTrackingControl: false,
                showRoadLabels: false, clickToGo: false, scrollwheel: false,
                visible: true
              });
            } else if (pwPano.getPano() !== data.location.pano) {
              pwPano.setPano(data.location.pano);
            }
            pwPano.setPov({ heading: heading, pitch: 0 });
            pwShowMode('pano');
            pwCaption(data.location.shortDescription || data.location.description || '');
          });
        });
      }

      // ---- the hexagon's other street views -------------------------------
      // Is a screen point inside the projected window? The window is an
      // arbitrary quadrilateral (it is a photographed sheet), so this is a
      // plain ray-crossing test rather than a bounding box.
      function pwPointInPoly(px, poly) {
        var inside = false;
        for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
          var xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
          if ((yi > px[1]) !== (yj > px[1])
              && px[0] < (xj - xi) * (px[1] - yi) / (yj - yi) + xi) {
            inside = !inside;
          }
        }
        return inside;
      }

      // tetherQuad already knows which quad the window occupies -- the fitted
      // sheet, or the debug pane standing in for it -- so the tap works the
      // same whether there is paper on the table or ctrl+shift+S is previewing.
      function pwWindowHit(px) {
        var quad = tetherQuad('street');
        return !!quad && pwPointInPoly(px, quad);
      }

      // Points to ask about inside one hexagon: its centre, then six spread
      // two thirds of the way to each corner. Asking only at the centre finds
      // the one panorama the pointer would have found anyway.
      function pwHexProbes(cell) {
        var probes = [{ lng: cell.centre.lng, lat: cell.centre.lat }];
        (cell.ring[0] || []).slice(0, 6).forEach(function (corner) {
          probes.push({
            lng: cell.centre.lng + (corner[0] - cell.centre.lng) * 0.66,
            lat: cell.centre.lat + (corner[1] - cell.centre.lat) * 0.66
          });
        });
        return probes;
      }

      function pwInCell(cell, lngLat) {
        return pwPointInPoly([lngLat.lng, lngLat.lat],
          (cell.ring[0] || []).map(function (c) { return [c[0], c[1]]; }));
      }

      // Google first, because a panorama can be turned with the tag. Mapillary
      // stills fill in behind it so a hexagon Street View never drove through
      // still has something to cycle.
      function pwCollectGoogle(cell) {
        return pwSdk().then(function (maps) {
          if (!maps || !maps.StreetViewService
              || !maps.StreetViewSource || !maps.StreetViewSource.OUTDOOR) return [];
          var service = new maps.StreetViewService();
          var probes = pwHexProbes(cell);
          return Promise.all(probes.map(function (at) {
            return new Promise(function (resolve) {
              var ask = {
                location: { lat: at.lat, lng: at.lng }, radius: PW_SEARCH_M,
                source: maps.StreetViewSource.OUTDOOR
              };
              service.getPanorama(ask, function (data, status) {
                if (status !== 'OK' || !data || !data.location || !data.location.pano) {
                  return resolve(null);
                }
                var loc = data.location.latLng;
                var at2 = loc
                  ? { lng: typeof loc.lng === 'function' ? loc.lng() : loc.lng,
                      lat: typeof loc.lat === 'function' ? loc.lat() : loc.lat }
                  : at;
                resolve({
                  kind: 'pano', pano: data.location.pano, lng: at2.lng, lat: at2.lat,
                  caption: data.location.shortDescription || data.location.description || ''
                });
              });
            });
          })).then(function (found) {
            var seen = {}, out = [];
            found.forEach(function (item) {
              if (!item || seen[item.pano]) return;
              // A probe near an edge can match a panorama in the next hexagon;
              // the promise of the tap is "another view in THIS hexagon".
              if (!pwInCell(cell, item)) return;
              seen[item.pano] = true;
              out.push(item);
            });
            return out;
          });
        }).catch(function () { return []; });
      }

      function pwCollectMapillary(cell) {
        var span = pwMetres(cell.centre, {
          lng: (cell.ring[0] || [[cell.centre.lng, cell.centre.lat]])[0][0],
          lat: (cell.ring[0] || [[cell.centre.lng, cell.centre.lat]])[0][1]
        }) || PW_SEARCH_M;
        var query = '/api/mapillary/near?lng=' + encodeURIComponent(cell.centre.lng)
          + '&lat=' + encodeURIComponent(cell.centre.lat)
          + '&radius=' + Math.round(span) + '&limit=20';
        return fetch(query, { cache: 'no-store' })
          .then(function (response) { return response.json(); })
          .then(function (data) {
            var out = [];
            ((data && data.images) || []).forEach(function (image) {
              if (!image || !image.url || !isFinite(image.lng) || !isFinite(image.lat)) return;
              var at = { lng: Number(image.lng), lat: Number(image.lat) };
              if (!pwInCell(cell, at)) return;
              out.push({ kind: 'still', url: image.url, lng: at.lng, lat: at.lat, caption: '' });
            });
            return out;
          })
          .catch(function () { return []; });
      }

      // Collected once per hexagon and kept, so the second tap is instant.
      function pwEnsureHexViews(cell) {
        var id = cell.q + ',' + cell.r;
        if (pwHexViews.id === id && !pwHexViews.loading) return Promise.resolve(pwHexViews.list);
        if (pwHexViews.id === id && pwHexViews.loading) return Promise.resolve(null);
        pwHexViews = { id: id, list: [], index: 0, loading: true };
        return pwCollectGoogle(cell).then(function (panos) {
          if (panos.length >= PW_HEX_VIEWS) return panos;
          return pwCollectMapillary(cell).then(function (stills) {
            return panos.concat(stills);
          });
        }).then(function (all) {
          if (pwHexViews.id !== id) return null;      // pointer left while asking
          pwHexViews.list = all.slice(0, PW_HEX_VIEWS);
          pwHexViews.loading = false;
          return pwHexViews.list;
        });
      }

      function pwShowCollected(item) {
        if (!item) return;
        pwManualCell = pwHexViews.id;
        if (item.kind === 'still') {
          pwPart('.pw-still').src = item.url;
          pwShowMode('still');
          pwCaption('');
          return;
        }
        pwSdk().then(function (maps) {
          if (!maps || !maps.StreetViewPanorama) return;
          var host = pwPart('.pw-pano');
          if (!pwPano) {
            pwPano = new maps.StreetViewPanorama(host, {
              pano: item.pano,
              pov: { heading: (pwHeading + pwSpin) % 360, pitch: 0 },
              zoom: 0,
              disableDefaultUI: true,
              addressControl: false, fullscreenControl: false, linksControl: false,
              panControl: false, zoomControl: false, enableCloseButton: false,
              motionTracking: false, motionTrackingControl: false,
              showRoadLabels: false, clickToGo: false, scrollwheel: false,
              visible: true
            });
          } else if (pwPano.getPano() !== item.pano) {
            pwPano.setPano(item.pano);
          }
          pwPano.setPov({ heading: (pwHeading + pwSpin) % 360, pitch: 0 });
          pwShowMode('pano');
          pwCaption(item.caption || '');
        });
      }

      // A tap on the window: step to the next view this hexagon holds, and
      // wrap. Where the tap landed does not matter -- the whole window is the
      // button -- so the hexagon is the one the POINTER is standing in, which
      // is the one the close-up window is already framing.
      function pwCycleView() {
        if (!pwPointer) return;
        var cell = zwCellAt({ lng: pwPointer.lng, lat: pwPointer.lat });
        var id = cell.q + ',' + cell.r;
        var known = pwHexViews.id === id && !pwHexViews.loading;
        pwEnsureHexViews(cell).then(function (list) {
          if (!list || !list.length) {
            pwCaption('Une seule vue ici');
            return;
          }
          // The first tap on a fresh hexagon moves off whatever the pointer
          // had found; later taps just advance.
          pwHexViews.index = known ? (pwHexViews.index + 1) % list.length : 0;
          // list[0] is the centre probe, which is usually the very panorama the
          // pointer already picked -- a tap that changes nothing reads as a
          // dead button, so step past it.
          var showing = pwPano && pwMode === 'pano' ? pwPano.getPano() : '';
          var candidate = list[pwHexViews.index];
          if (list.length > 1 && candidate && candidate.pano && candidate.pano === showing) {
            pwHexViews.index = (pwHexViews.index + 1) % list.length;
            candidate = list[pwHexViews.index];
          }
          pwShowCollected(candidate);
        });
      }

      // Every poll: turn the view with the tag; only ask for new imagery
      // once the tag has actually moved somewhere else.
      function pwAim() {
        if (!pwPointer) return;
        // The tag has to turn by the step before the view follows at all,
        // and then it turns smoothly rather than snapping: a panorama that
        // twitches with every frame's reading is tiring to look at.
        pwHeadingHeld = pwHoldHeading(pwPointer.heading, pwHeadingHeld, PW_HEADING_STEP);
        var delta = ((pwHeadingHeld - pwHeading + 540) % 360) - 180;
        pwHeading = (pwHeading + delta * 0.35 + 360) % 360;
        // A view chosen by tapping holds until the pointer walks into another
        // hexagon; the tag still turns it, it just stops being re-chosen.
        if (pwManualCell) {
          var nowCell = zwCellAt({ lng: pwPointer.lng, lat: pwPointer.lat });
          if (nowCell.q + ',' + nowCell.r === pwManualCell) {
            if (pwPano && pwMode === 'pano') {
              try { pwPano.setPov({ heading: (pwHeading + pwSpin) % 360, pitch: 0 }); }
              catch (_error) { /* torn down */ }
            }
            return;
          }
          pwManualCell = '';
        }
        var moved = !pwAskedAt || pwMetres(pwAskedAt, pwPointer) >= PW_MOVE_M;
        if (moved && Date.now() - pwAskedWhen > 400) {
          pwAskImagery(pwPointer, (pwHeading + pwSpin) % 360);
        } else if (pwPano && pwMode === 'pano') {
          try { pwPano.setPov({ heading: (pwHeading + pwSpin) % 360, pitch: 0 }); }
          catch (_error) { /* torn down */ }
        }
      }

      // ---- drawing the sheet ---------------------------------------------
      function pwRender(visible) {
        var host = pwHost();
        // The debug pane owns the window while it is up, so a poll that has
        // lost the sheet cannot pull it out from under the cursor.
        if (pwDebugAt) { pwDebugRender(); return; }
        host.classList.remove('is-debug');
        if (!visible) { host.hidden = true; return; }
        host.hidden = false;
        function points(quad) {
          return quad.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
        }
        var cellLayer = pwPart('.pw-cells');
        var cellNodes = cellLayer.querySelectorAll('polygon');
        (pwCellQuads || []).forEach(function (cell, i) {
          var node = cellNodes[i];
          if (!node) {
            node = document.createElementNS(PW_SVG_NS, 'polygon');
            cellLayer.appendChild(node);
          }
          node.setAttribute('points', points(cell));
        });
        var I = pwLayout.interiorMm;
        var viewH = Math.round(PW_VIEW_W * (I[3] - I[1]) / (I[2] - I[0]));
        var view = pwPart('.pw-view');
        view.style.width = PW_VIEW_W + 'px';
        view.style.height = viewH + 'px';
        view.style.transform = pwMatrix3d(PW_VIEW_W, viewH, pwQuad);
        if (pwPano && pwMode === 'pano' && !view.dataset.sized) {
          // The panorama measured its host once, when it was created; tell
          // it the host is real now.
          view.dataset.sized = '1';
          try { window.google.maps.event.trigger(pwPano, 'resize'); } catch (_error) { /* fine */ }
        }
      }

      // The paper window has no panel section: it starts by itself whenever
      // the backend has a camera (see the /api/tags check below), so its
      // problems go to the console rather than to a status line.
      function pwStatus(text, kind) {
        if (text && kind === 'err' && window.console) console.warn('[paper window] ' + text);
      }

      // ---- debug: the windows without the paper --------------------------
      // The real thing needs two printed sheets, a camera and a calibrated
      // table. These put the same two windows on screen at the mouse instead,
      // so the views themselves can be worked on at a desk. Both are toggles:
      // the shortcut that opens one closes it.
      var DEBUG_STREET_SIZE = [620, 380];
      var DEBUG_ZOOM_SIZE = [560, 420];
      var pwCursor = { x: 0, y: 0 };
      var pwDebugAt = null;

      document.addEventListener('mousemove', function (event) {
        pwCursor.x = event.clientX;
        pwCursor.y = event.clientY;
      }, { passive: true });

      // A screen-aligned rectangle near the cursor, kept wholly on screen.
      // Returned as a quad so it goes through the same warp as a real sheet.
      function debugQuad(at, size) {
        var w = size[0], h = size[1];
        var x = Math.min(Math.max(at.x - w / 2, 8), Math.max(8, window.innerWidth - w - 8));
        var y = Math.min(Math.max(at.y - h - 28, 8), Math.max(8, window.innerHeight - h - 8));
        return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
      }

      function pwDebugRender() {
        var host = pwHost();
        host.hidden = false;
        host.classList.add('is-debug');
        // No paper, so nothing to mask and no cells to keep dark.
        var cells = pwPart('.pw-cells');
        while (cells.firstChild) cells.removeChild(cells.firstChild);
        var w = DEBUG_STREET_SIZE[0], h = DEBUG_STREET_SIZE[1];
        var view = pwPart('.pw-view');
        view.style.width = w + 'px';
        view.style.height = h + 'px';
        view.style.transform = pwMatrix3d(w, h, debugQuad(pwDebugAt, DEBUG_STREET_SIZE));
      }

      function pwDebugToggle() {
        if (pwDebugAt) {
          pwDebugAt = null;
          pwHost().classList.remove('is-debug');
          if (!pwOn) pwHost().hidden = true;
          pwStatus('Street-view debug off.', '');
          return;
        }
        pwDebugAt = { x: pwCursor.x, y: pwCursor.y };
        var at = map.unproject([pwDebugAt.x, pwDebugAt.y]);
        pwDebugRender();
        pwNote('Chargement\u2026');
        // Ask again even if the last ask was near here: the point of the
        // shortcut is to look at whatever is under the cursor now.
        pwAskedAt = null;
        pwAsking = false;
        pwAskImagery({ lng: at.lng, lat: at.lat }, map.getBearing());
        pwStatus('Street view at the cursor \u2014 ctrl+shift+S again to close.', 'ok');
      }

      // ---- detection cues ---------------------------------------------------
      var PW_SVG_NS = 'http://www.w3.org/2000/svg';
      function pwApply(data) {
        var tags = Array.isArray(data.tags) ? data.tags : [];
        var corners = Array.isArray(data.corners) ? data.corners : [];
        var calibrated = corners.length === 4 && corners.every(Boolean);
        var now = Date.now();
        var pose = pwSheetPose(pwLayout, tags, window.innerWidth, window.innerHeight);
        if (pose.quad) {
          if (pwMoved(pwQuad, pose.quad, PW_STILL_PX)) {
            pwQuad = pwBlend(pwQuad, pose.quad);
            pwCellQuads = pose.cells.map(function (cell, i) {
              return pwBlend(pwCellQuads ? pwCellQuads[i] : null, cell);
            });
          }
          pwLastSeen = now;
        }
        var live = null;
        tags.forEach(function (tag) { if (tag && tag.id === pwLayout.pointerTagId) live = tag; });
        var pointer = live ? pwPointerFrom(live, window.innerWidth, window.innerHeight, map.getBearing()) : null;
        if (pointer) pwPointerTagSeenAt = now;
        // Read after the sheet's pose, so a pinch knows where the window is.
        var pen = penTick(tags, now);
        if (fakePointer) {
          // The simulation wins while it is on, so a debug session cannot be
          // yanked around by a tag someone left lying on the table.
          pwPointer = { lng: fakePointer.lng, lat: fakePointer.lat, heading: fakePointer.heading };
          pwAim();
        } else if (pointer) {
          var at = map.unproject(pointer.px);
          pwPointer = { lng: at.lng, lat: at.lat, heading: pointer.heading };
          pwAim();
        } else if (pen && pen.placing && now - pwPointerTagSeenAt >= PEN_TAG_AWAY_MS) {
          // Tag 24 is off the table, so the pen's pinch stands in for it.
          var penAt = map.unproject([pen.tip.x, pen.tip.y]);
          pwPointer = { lng: penAt.lng, lat: penAt.lat, heading: penHeading(pen) };
          pwAim();
        }
        var visible = Boolean(pwQuad) && (now - pwLastSeen) < PW_HOLD_MS;
        pwRender(visible);
        // The close-up sheet rides the same poll and the same pointer.
        var zoomPose = zwApply(tags, now, pwPointer);
        expoPointerTick(tags, now, pen);

        if (!calibrated) {
          pwStatus('Set the four camera corners on the workshop page first.', 'warn');
        } else if (!tags.length) {
          pwStatus('Camera on \u2014 no tags in view.', '');
        } else {
          pwStatus('Frame: ' + pose.seen + '/' + pwLayout.tags.length + ' tags'
            + (visible ? '' : ' \u2014 need ' + PW_MIN_TAGS)
            + ' \u00b7 pointer: ' + (pointer ? 'on map' : (pwPointer ? 'lost, holding' : 'not seen')),
            visible ? 'ok' : '');
        }
      }


      // ==================== the close-up window ==========================
      // The second printed sheet. The street window shows what the pointer is
      // looking at; this one shows the ground it is standing on -- the hexagon
      // under it, drawn large, tilted, with the buildings standing up, and the
      // number of stickers that landed in that hexagon.
      //
      // It rides the same poll and the same pointer as the street window. Its
      // own border ids are what make it a different sheet to the camera.
      var ZW_VIEW_W = 900;            // the panel's own width before the warp
      var ZW_ZOOM = 17.1;
      var ZW_PITCH = 50;              // enough tilt for the blocks to read as blocks
      var ZW_ORBIT_DEG_S = 4;         // the camera circles the hexagon, a turn every minute and a half
      var ZW_POINTS_TTL = 1500;       // how long a flattened sticker list is reused
      var ZW_STICKER_SOURCE = 'zw-stickers';
      // What the buildings say about the hexagon under the pointer: pastel
      // red where the minuses win, blue where the pluses do, purple where
      // they tie, and the basemap's own stone where nobody said anything.
      var ZW_TINT = { none: '#ded8cf', minus: '#d9a09a', plus: '#9fb8d3', even: '#b8a6c9' };
      // The ground the blocks stand on: IGN's BD ORTHO, free and keyless
      // from the Geoplateforme. France only -- outside it every tile answers
      // 404, maplibre draws nothing, and the vector basemap underneath comes
      // through unchanged, so a workshop held elsewhere loses the photograph
      // and nothing else. Set ZW_ORTHO false for the flat stone ground.
      var ZW_ORTHO = true;
      var ZW_ORTHO_LAYER = 'zw-ortho';
      var ZW_ORTHO_MAXZOOM = 19;      // IGN's deepest level; past it maplibre stretches z19
      var ZW_ORTHO_OPACITY = 0.15;    // ghosted, so the photograph reads through the blocks
      var ZW_ORTHO_URL = 'https://data.geopf.fr/wmts'
        + '?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0'
        + '&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&TILEMATRIXSET=PM'
        + '&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=image/jpeg';
      var zwBuildingLayers = [];      // the extrusion layer(s) the tint is painted on
      var zwTint = ZW_TINT.none;
      var zwStickerData = null;
      var zwStickerAt = 0;
      var zwLayout = null;
      var zwQuad = null;
      var zwCellQuads = null;
      var zwLastSeen = 0;
      var zwMap = null;
      var zwMapReady = false;
      var zwCellId = null;
      var zwSized = '';
      var zwDebugAt = null;
      var zwPoints = null;
      var zwPointsAt = 0;

      function zwHost() { return $('zoomWindow'); }
      function zwPart(selector) { return zwHost().querySelector(selector); }

      // A second GL map, deliberately: the close-up is tilted with its
      // buildings up while the table map stays flat and read from above, and
      // one camera cannot be in two places.
      function zwEnsureMap() {
        if (zwMap) return zwMap;
        var style = PAPER_MAPLIBRE_STYLE;
        // maplibre takes ownership of a style object it is handed, so the two
        // maps must not be given the same one.
        if (style && typeof style === 'object') {
          try { style = JSON.parse(JSON.stringify(style)); } catch (_error) { /* url */ }
        }
        zwMap = new mapboxgl.Map({
          container: zwPart('.zw-map'),
          style: style,
          center: map.getCenter(),
          zoom: ZW_ZOOM,
          pitch: ZW_PITCH,
          bearing: map.getBearing(),
          interactive: false,
          attributionControl: false,
          fadeDuration: 0
        });
        zwMap.on('style.load', function () {
          zwMapReady = true;
          zwShowBuildings();
          // after zwShowBuildings: the insert point is the layer it just found
          zwShowOrtho();
          zwEnsureStickerLayers();
          // The first aim happens while this style is still loading, so what
          // it decided has to be put down again now there are layers to put
          // it on.
          zwApplyTint();
          zwRefreshStickers();
        });
        return zwMap;
      }

      // The one view that wants the blocks standing up. Both basemaps carry
      // an extrusion layer switched off by default -- liberty calls it
      // building-3d, the bundled one buildings-3d -- so turn on whichever is
      // here, and build one on the same source if neither is.
      function zwShowBuildings() {
        var found = false;
        zwBuildingLayers = [];
        BUILDINGS_3D_LAYERS.forEach(function (id) {
          if (!zwMap.getLayer(id)) return;
          found = true;
          zwBuildingLayers.push(id);
          try { zwMap.setLayoutProperty(id, 'visibility', 'visible'); }
          catch (_error) { /* mid style swap */ }
        });
        if (found) return;
        try {
          zwBuildingLayers.push('zw-buildings-3d');
          zwMap.addLayer({
            id: 'zw-buildings-3d',
            type: 'fill-extrusion',
            source: 'openmaptiles',
            'source-layer': 'building',
            minzoom: 14,
            paint: {
              'fill-extrusion-color': '#ded8cf',
              'fill-extrusion-height': ['get', 'render_height'],
              'fill-extrusion-base': ['get', 'render_min_height'],
              'fill-extrusion-opacity': 0.78
            }
          });
        } catch (_error) { /* a style with no building source; the map still reads */ }
      }

      // Under the blocks, over everything else. liberty draws its flat
      // `building` fill only to z14 and stands the blocks up past it, so at
      // the close-up's own zoom the extrusions are the only thing that has to
      // stay on top: slide the photograph in directly beneath them and the
      // roads, water and landcover disappear under it while the labels above
      // survive to name the streets.
      function zwShowOrtho() {
        if (!ZW_ORTHO) return;
        try {
          if (!zwMap.getSource(ZW_ORTHO_LAYER)) {
            zwMap.addSource(ZW_ORTHO_LAYER, {
              type: 'raster',
              tiles: [ZW_ORTHO_URL],
              tileSize: 256,
              // Asking past IGN's deepest level answers 404 for every tile;
              // capping the source here stretches z19 instead.
              maxzoom: ZW_ORTHO_MAXZOOM,
              attribution: '&copy; <a href="https://geoservices.ign.fr/">IGN</a>'
            });
          }
          if (!zwMap.getLayer(ZW_ORTHO_LAYER)) {
            zwMap.addLayer({
              id: ZW_ORTHO_LAYER,
              type: 'raster',
              source: ZW_ORTHO_LAYER,
              paint: { 'raster-fade-duration': 0 }
            }, zwOrthoBefore());
          }
          // A pastel at 0.8 reads over stone; over a photograph it silts up,
          // and the tint is what the hexagon says, not decoration.
          zwBuildingLayers.forEach(function (id) {
            if (!zwMap.getLayer(id)) return;
            zwMap.setPaintProperty(id, 'fill-extrusion-opacity', ZW_ORTHO_OPACITY);
          });
        } catch (_error) { /* mid style swap: the next style.load retries */ }
      }

      // Which layer the photograph stops under. zwShowBuildings has just run,
      // so this is whichever layer the blocks ended up in -- the style's own
      // or the one the page had to build -- and failing that the first label,
      // so an unfamiliar style still gets its imagery under the names rather
      // than over them.
      function zwOrthoBefore() {
        for (var i = 0; i < zwBuildingLayers.length; i++) {
          if (zwMap.getLayer(zwBuildingLayers[i])) return zwBuildingLayers[i];
        }
        var layers = (zwMap.getStyle() || {}).layers || [];
        for (var j = 0; j < layers.length; j++) {
          if (layers[j].type === 'symbol') return layers[j].id;
        }
        return undefined;
      }

      // A minus sticker, as it is drawn on the sheet: a triangle in the
      // colour of its question, with the same dark rim the circles get.
      function zwTriangleImage(color) {
        var size = 36, canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        var ctx = canvas.getContext('2d');
        ctx.beginPath();
        ctx.moveTo(size / 2, 3);
        ctx.lineTo(size - 3, size - 4);
        ctx.lineTo(3, size - 4);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 3;
        ctx.lineJoin = 'round';
        ctx.fill();
        ctx.stroke();
        return { width: size, height: size, data: ctx.getImageData(0, 0, size, size).data };
      }

      // The stickers themselves, on the close-up: a circle for a plus, a
      // triangle for a minus, each in its question's colour. Laid flat on the
      // ground so they tilt with it, and above the buildings so none is lost
      // behind a block.
      function zwEnsureStickerLayers() {
        var empty = { type: 'FeatureCollection', features: [] };
        try {
          if (!zwMap.getSource(ZW_STICKER_SOURCE)) {
            zwMap.addSource(ZW_STICKER_SOURCE, { type: 'geojson', data: empty });
          }
          if (!zwMap.getLayer('zw-sticker-plus')) {
            zwMap.addLayer({
              id: 'zw-sticker-plus', type: 'circle', source: ZW_STICKER_SOURCE,
              filter: ['==', ['get', 'sign'], 'plus'],
              paint: {
                'circle-radius': 7, 'circle-color': ['get', 'color'],
                'circle-stroke-color': '#111', 'circle-stroke-width': 1.5,
                'circle-pitch-alignment': 'map'
              }
            });
          }
          if (!zwMap.getLayer('zw-sticker-minus')) {
            zwMap.addLayer({
              id: 'zw-sticker-minus', type: 'symbol', source: ZW_STICKER_SOURCE,
              filter: ['==', ['get', 'sign'], 'minus'],
              layout: {
                'icon-image': ['concat', 'zw-tri-', ['get', 'id']],
                'icon-size': 1, 'icon-allow-overlap': true,
                'icon-ignore-placement': true, 'icon-pitch-alignment': 'map'
              }
            });
          }
        } catch (_error) { /* mid style swap: the next style.load retries */ }
      }

      // Every sticker with its colour and sign, rebuilt at most every second
      // and a half: it only changes when somebody loads a session.
      function zwRefreshStickers() {
        if (!zwMap || !zwMapReady) return;
        var now = Date.now();
        if (!zwStickerData || now - zwStickerAt > ZW_POINTS_TTL) {
          var byColour = stickerPointsByColour();
          var features = [];
          Object.keys(byColour).forEach(function (name) {
            var entry = byColour[name];
            var image = 'zw-tri-' + entry.id;
            try {
              if (!zwMap.hasImage(image)) {
                zwMap.addImage(image, zwTriangleImage(entry.color), { pixelRatio: 2 });
              }
            } catch (_error) { /* the circles still draw */ }
            entry.points.forEach(function (point) {
              features.push({
                type: 'Feature',
                geometry: { type: 'Point', coordinates: [point.lng, point.lat] },
                properties: { id: entry.id, color: entry.color, sign: point.sign }
              });
            });
          });
          zwStickerData = { type: 'FeatureCollection', features: features };
          zwStickerAt = now;
        }
        var source = zwMap.getSource(ZW_STICKER_SOURCE);
        if (source) source.setData(zwStickerData);
      }

      // Which way the hexagon leans, as a colour for its buildings.
      function zwTintFor(plus, minus) {
        if (!plus && !minus) return ZW_TINT.none;
        if (minus > plus) return ZW_TINT.minus;
        if (plus > minus) return ZW_TINT.plus;
        return ZW_TINT.even;
      }

      function zwApplyTint() {
        if (!zwMap || !zwMapReady) return;
        zwBuildingLayers.forEach(function (id) {
          if (!zwMap.getLayer(id)) return;
          try {
            zwMap.setPaintProperty(id, 'fill-extrusion-color-transition', { duration: 350, delay: 0 });
            zwMap.setPaintProperty(id, 'fill-extrusion-color', zwTint);
          } catch (_error) { /* mid swap */ }
        });
      }

      // Every sticker on every ticked sheet, flattened once and reused: this
      // runs on the poll, and walking the references at 12 Hz to answer a
      // question whose answer only changes when somebody loads a session is
      // work for nothing.
      function zwStickerPoints() {
        var now = Date.now();
        if (zwPoints && now - zwPointsAt < ZW_POINTS_TTL) return zwPoints;
        zwPoints = aggregateStickerEntry(stickerPointsByColour()).points;
        zwPointsAt = now;
        return zwPoints;
      }

      // Which hexagon a point falls in, and what landed in it.
      //
      // The lattice has to be the one the table is already showing, or the
      // close-up would frame a hexagon that is not on the map: same bin size
      // as the round steps, same origin as the overview surface, which is the
      // first sticker of the first colour.
      function zwCellAt(lngLat) {
        var points = zwStickerPoints();
        var size = Math.max(10, PREVIZ_BIN_METRES) / Math.sqrt(3);
        var origin = points.length ? points[0] : lngLat;
        var frame = bivFrame(origin.lng, origin.lat);
        var here = frame.toMetres(lngLat.lng, lngLat.lat);
        var cell = bivHexAt(here[0], here[1], size);
        var plus = 0, minus = 0;
        points.forEach(function (point) {
          var xy = frame.toMetres(point.lng, point.lat);
          var at = bivHexAt(xy[0], xy[1], size);
          if (at[0] !== cell[0] || at[1] !== cell[1]) return;
          if (point.sign === 'plus') plus += 1; else minus += 1;
        });
        var ring = bivHexRing(cell[0], cell[1], size, frame);
        var cx = 0, cy = 0;
        ring[0].slice(0, 6).forEach(function (corner) { cx += corner[0]; cy += corner[1]; });
        return {
          q: cell[0], r: cell[1], ring: ring,
          centre: { lng: cx / 6, lat: cy / 6 },
          plus: plus, minus: minus, total: plus + minus
        };
      }

      // The reading is not written on the window any more; it is the colour
      // of the buildings. The stickers say the rest.
      function zwSetReading(cell) {
        zwPart('.zw-note').hidden = true;
        zwTint = zwTintFor(cell.plus, cell.minus);
        zwApplyTint();
        zwRefreshStickers();
      }

      // Frame the hexagon the pointer is in. The reading is refreshed every
      // call; the camera only moves when the pointer crosses into a new one,
      // so a hand resting inside one hexagon leaves the view still.
      function zwAimAt(lngLat) {
        var cell = zwCellAt(lngLat);
        zwSetReading(cell);
        var id = cell.q + ',' + cell.r;
        if (id === zwCellId) return;
        zwCellId = id;
        var m = zwEnsureMap();
        m.easeTo({
          center: [cell.centre.lng, cell.centre.lat],
          zoom: ZW_ZOOM, pitch: ZW_PITCH, bearing: m.getBearing(),
          duration: 600
        });
      }

      // Sizing the panel is also telling the map its canvas changed, so it is
      // done once per size rather than every frame.
      function zwSizeView(w, h, quad) {
        var view = zwPart('.zw-view');
        var key = w + 'x' + h;
        view.style.width = w + 'px';
        view.style.height = h + 'px';
        view.style.transform = pwMatrix3d(w, h, quad);
        if (zwSized !== key) {
          zwSized = key;
          if (zwMap) { try { zwMap.resize(); } catch (_error) { /* torn down */ } }
        }
      }

      function zwDebugRender() {
        var host = zwHost();
        host.hidden = false;
        host.classList.add('is-debug');
        var cells = zwPart('.zw-cells');
        while (cells.firstChild) cells.removeChild(cells.firstChild);
        zwSizeView(DEBUG_ZOOM_SIZE[0], DEBUG_ZOOM_SIZE[1],
                   debugQuad(zwDebugAt, DEBUG_ZOOM_SIZE));
      }

      function zwRender(visible) {
        var host = zwHost();
        if (zwDebugAt) { zwDebugRender(); return; }
        host.classList.remove('is-debug');
        if (!visible) { host.hidden = true; return; }
        host.hidden = false;
        function points(quad) {
          return quad.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' ');
        }
        var cellLayer = zwPart('.zw-cells');
        var cellNodes = cellLayer.querySelectorAll('polygon');
        (zwCellQuads || []).forEach(function (cell, i) {
          var node = cellNodes[i];
          if (!node) {
            node = document.createElementNS(PW_SVG_NS, 'polygon');
            cellLayer.appendChild(node);
          }
          node.setAttribute('points', points(cell));
        });
        var I = zwLayout.interiorMm;
        zwSizeView(ZW_VIEW_W, Math.round(ZW_VIEW_W * (I[3] - I[1]) / (I[2] - I[0])), zwQuad);
      }

      // Called from the street window's poll, on the same tags.
      function zwApply(tags, now, pointer) {
        if (!zwLayout) return null;
        var pose = pwSheetPose(zwLayout, tags, window.innerWidth, window.innerHeight);
        if (pose.quad) {
          if (pwMoved(zwQuad, pose.quad, PW_STILL_PX)) {
            zwQuad = pwBlend(zwQuad, pose.quad);
            zwCellQuads = pose.cells.map(function (cell, i) {
              return pwBlend(zwCellQuads ? zwCellQuads[i] : null, cell);
            });
          }
          zwLastSeen = now;
        }
        var visible = Boolean(zwQuad) && (now - zwLastSeen) < PW_HOLD_MS;
        if (visible) {
          zwEnsureMap();
          if (pointer) zwAimAt(pointer);
        }
        zwRender(visible);
        return pose;
      }

      function zwDebugToggle() {
        if (zwDebugAt) {
          zwDebugAt = null;
          zwHost().classList.remove('is-debug');
          if (!zwQuad) zwHost().hidden = true;
          pwStatus('Close-up debug off.', '');
          return;
        }
        zwDebugAt = { x: pwCursor.x, y: pwCursor.y };
        zwEnsureMap();
        zwCellId = null;              // always re-aim, even at the same hexagon
        zwRender(true);
        zwAimAt(map.unproject([zwDebugAt.x, zwDebugAt.y]));
        pwStatus('Close-up at the cursor \u2014 ctrl+shift+D again to close.', 'ok');
      }


      // ==================== pointer 24 announcing itself ==================
      // Two effects hang off the pointer, both driven by one animation loop.
      //
      // The breath: on the sticker steps the whole surface fades out and
      // back, every cell together, each from its own opacity down to nothing
      // and up again. What stops it is the tag: the hexagons within a few
      // rings of the pointer are held at their true colour from the moment
      // it lands, so a hand putting the tag down sees the neighbourhood
      // answer at once while the rest of the map keeps breathing round it.
      //
      // The hold is not a repaint. The cells near the tag are filtered OUT
      // of the breathing layer and drawn again by a copy layer at exactly the
      // opacity the surface gave them, so a held cell is pixel for pixel the
      // still surface, and nothing is composited twice.
      //
      // The tether: an electric line from the pointer to each open window,
      // sagging like a cable and jittering like a spark. It never goes away;
      // its weight is what says whether things are moving. While either end
      // moves it runs three times as thick, and once both are still it thins
      // back to a wire, so a change is stated and a rest is not shouted.
      var BREATH_PERIOD_MS = 3200;      // out and back
      var HOLD_RADIUS_HEX = 2.5;        // rings of hexagons kept still round the tag
      var FX_TICK_MS = 33;              // ~30 fps
      var HOLD_SOURCE = 'pointer-hold';
      var HOLD_LAYER = 'pointer-hold-fill';
      var FX_EMPTY = { type: 'FeatureCollection', features: [] };
      var breathWas = false;
      var holdKey = '';
      var holdData = null;
      var holdColour = null;
      var fxLastTick = 0;
      var fxLastNow = 0;

      var fakePointer = null;           // ctrl+shift+F: ID 24 without the table

      // Both effects follow whatever stands for the pointer: the simulated
      // one while it is on, otherwise the tag the camera last saw.
      function pointerAnchor() {
        if (fakePointer) return fakePointer;
        return pwOn ? pwPointer : null;
      }

      // The surface that breathes: the one colour a sticker step has up.
      // Nothing breathes outside the round, and nothing breathes while the
      // operator's own pulse is animating the same property.
      function breathingSurface() {
        if (!previzRunning() || previzIndex <= 0 || bivPulse) return null;
        var names = Object.keys(heatSettings);
        for (var i = 0; i < names.length; i += 1) {
          var name = names[i];
          if (!heatSettings[name].enabled || !bivLastData[name]) continue;
          if (!map.getLayer(heatIds(name).layer)) continue;
          return name;
        }
        return null;
      }

      function scaledOpacity(base, k) {
        return typeof base === 'number' ? base * k : ['*', base, k];
      }

      function breathFrame(now, colour) {
        if (!colour) {
          if (!breathWas) return;
          // Back to standing still, through the same builder the surface
          // uses, so nothing is left half-faded for the operator's panel.
          breathWas = false;
          heatKnownColours.forEach(function (name) {
            var layerId = heatIds(name).layer;
            if (!map.getLayer(layerId)) return;
            map.setPaintProperty(layerId, 'fill-opacity',
              bivOpacity(heatSettingsFor(name), name));
          });
          return;
        }
        // Cosine from 1: a scene comes up whole and only then lets go.
        var breath = (1 + Math.cos(2 * Math.PI * (now % BREATH_PERIOD_MS) / BREATH_PERIOD_MS)) / 2;
        map.setPaintProperty(heatIds(colour).layer, 'fill-opacity',
          scaledOpacity(bivOpacity(heatSettingsFor(colour), colour), breath));
        breathWas = true;
      }

      function holdEnsureLayer(heatLayer) {
        try {
          if (!map.getSource(HOLD_SOURCE)) {
            map.addSource(HOLD_SOURCE, { type: 'geojson', data: FX_EMPTY });
          }
          if (!map.getLayer(HOLD_LAYER)) {
            addLayerUnderLabels({
              id: HOLD_LAYER, type: 'fill', source: HOLD_SOURCE,
              paint: {
                'fill-color': ['get', 'fillColor'],
                'fill-opacity': 1,
                'fill-outline-color': ['get', 'fillColor']
              }
            });
          }
          // Directly above the surface it stands in for -- not under the
          // labels, which would put it over the ink and the marks.
          var layers = map.getStyle().layers;
          for (var i = 0; i < layers.length; i += 1) {
            if (layers[i].id !== heatLayer) continue;
            var next = layers[i + 1] ? layers[i + 1].id : undefined;
            if (next !== HOLD_LAYER) map.moveLayer(HOLD_LAYER, next);
            break;
          }
        } catch (_error) { return false; }
        return true;
      }

      function holdRelease() {
        if (holdColour && map.getLayer(heatIds(holdColour).layer)) {
          try { map.setFilter(heatIds(holdColour).layer, null); } catch (_error) { /* gone */ }
        }
        try {
          var source = map.getSource(HOLD_SOURCE);
          if (source) source.setData(FX_EMPTY);
        } catch (_error) { /* mid swap */ }
        holdKey = '';
        holdData = null;
        holdColour = null;
      }

      function holdFrame(colour, anchor) {
        if (!colour || !anchor) {
          if (holdColour) holdRelease();
          return;
        }
        var data = bivLastData[colour];
        var heatLayer = heatIds(colour).layer;
        var reach = HOLD_RADIUS_HEX * Math.max(10, PREVIZ_BIN_METRES);
        var ids = [], held = [];
        data.features.forEach(function (feature) {
          var ring = feature.geometry.coordinates[0];
          var cx = 0, cy = 0;
          for (var k = 0; k < 6; k += 1) { cx += ring[k][0]; cy += ring[k][1]; }
          if (pwMetres(anchor, { lng: cx / 6, lat: cy / 6 }) > reach) return;
          ids.push(feature.properties.cell);
          held.push(feature);
        });
        var key = colour + '|' + ids.join(';');
        var filter = ids.length ? ['!', ['in', ['get', 'cell'], ['literal', ids]]] : null;
        if (key !== holdKey || data !== holdData) {
          if (holdColour && holdColour !== colour) holdRelease();
          holdKey = key;
          holdData = data;
          holdColour = colour;
          if (!holdEnsureLayer(heatLayer)) return;
          map.getSource(HOLD_SOURCE).setData({ type: 'FeatureCollection', features: held });
          map.setPaintProperty(HOLD_LAYER, 'fill-opacity',
            bivOpacity(heatSettingsFor(colour), colour));
          map.setFilter(heatLayer, filter);
        } else if (filter && !map.getFilter(heatLayer)) {
          // The surface was rebuilt under us and came back unfiltered.
          map.setFilter(heatLayer, filter);
        }
      }

      // ---- the tether ----------------------------------------------------
      var TETHER_FADE_MS = 900;       // how long the line takes to thin once both ends rest
      var TETHER_STILL_PX = 2.5;
      var TETHER_WIDTH = { glow: 7, core: 2 };   // at rest
      var TETHER_SWELL = 3;           // times thicker while an end is moving
      var TETHER_OPACITY = '0.85';
      var TETHER_N = 18;              // samples along the arc
      var tetherStates = {
        street: { act: 0, prevP: null, prevW: null },
        zoom: { act: 0, prevP: null, prevW: null }
      };

      function tetherGroup(kind) {
        var id = 'tether-' + kind;
        var g = document.getElementById(id);
        if (g) return g;
        g = document.createElementNS(PW_SVG_NS, 'g');
        g.setAttribute('id', id);
        ['glow', 'core'].forEach(function (part) {
          var path = document.createElementNS(PW_SVG_NS, 'path');
          path.setAttribute('class', 'tether-' + part + ' full');
          path.setAttribute('stroke-width', String(TETHER_WIDTH[part]));
          path.setAttribute('stroke-opacity', TETHER_OPACITY);
          g.appendChild(path);
        });
        $('tetherMarks').appendChild(g);
        return g;
      }

      // Which quad a window currently occupies -- the fitted sheet, or the
      // debug pane standing in for it.
      function tetherQuad(kind) {
        if (kind === 'street') {
          if (pwHost().hidden) return null;
          return pwDebugAt ? debugQuad(pwDebugAt, DEBUG_STREET_SIZE) : pwQuad;
        }
        if (zwHost().hidden) return null;
        return zwDebugAt ? debugQuad(zwDebugAt, DEBUG_ZOOM_SIZE) : zwQuad;
      }

      // The point on the window's edge nearest the pointer: the line lands
      // on the frame, not in the middle of the picture.
      function tetherPort(quad, p) {
        var best = null, near = Infinity;
        for (var i = 0; i < 4; i += 1) {
          var a = quad[i], b = quad[(i + 1) % 4];
          var vx = b[0] - a[0], vy = b[1] - a[1];
          var t = ((p[0] - a[0]) * vx + (p[1] - a[1]) * vy) / (vx * vx + vy * vy || 1);
          t = Math.max(0, Math.min(1, t));
          var q = [a[0] + vx * t, a[1] + vy * t];
          var d = Math.hypot(p[0] - q[0], p[1] - q[1]);
          if (d < near) { near = d; best = q; }
        }
        return best;
      }

      // A cable's sag plus a spark's jitter: a quadratic droop between the
      // ends, with a perpendicular wobble that grows with activity so a
      // moving line crackles and a resting wire only shimmers.
      function tetherPoints(P, W, act, now, seed) {
        var dx = W[0] - P[0], dy = W[1] - P[1];
        var span = Math.hypot(dx, dy) || 1;
        var sag = Math.min(90, span * 0.14);
        var nx = -dy / span, ny = dx / span;
        var pts = [];
        for (var i = 0; i <= TETHER_N; i += 1) {
          var t = i / TETHER_N;
          var arc = Math.sin(Math.PI * t);
          var jit = (2 + act * 7) * arc
            * Math.sin(now / 43 + i * 2.1 + seed)
            * Math.sin(now / 97 + i * 1.3);
          pts.push([P[0] + dx * t + nx * jit,
                    P[1] + dy * t + arc * sag + ny * jit]);
        }
        return pts;
      }

      function tetherD(pts, from, to) {
        var d = '';
        for (var i = from; i <= to; i += 1) {
          d += (i === from ? 'M' : 'L') + pts[i][0].toFixed(1) + ' ' + pts[i][1].toFixed(1);
        }
        return d;
      }

      function tetherTick(now, dt) {
        var anchor = pointerAnchor();
        var shown = false;
        ['street', 'zoom'].forEach(function (kind) {
          var st = tetherStates[kind];
          var quad = anchor ? tetherQuad(kind) : null;
          var g = tetherGroup(kind);
          if (!quad) {
            g.setAttribute('display', 'none');
            st.prevP = st.prevW = null;
            return;
          }
          var proj = map.project([anchor.lng, anchor.lat]);
          var P = [proj.x, proj.y];
          var W = tetherPort(quad, P);
          var moved = !st.prevP
            || Math.hypot(P[0] - st.prevP[0], P[1] - st.prevP[1]) > TETHER_STILL_PX
            || Math.hypot(W[0] - st.prevW[0], W[1] - st.prevW[1]) > TETHER_STILL_PX;
          st.prevP = P;
          st.prevW = W;
          st.act = moved ? 1 : Math.max(0, st.act - dt / TETHER_FADE_MS);
          var pts = tetherPoints(P, W, st.act, now, kind === 'street' ? 0 : 3.7);
          var d = tetherD(pts, 0, TETHER_N);
          // Weight, not opacity, carries the motion: 1x at rest, 3x moving.
          var swell = 1 + (TETHER_SWELL - 1) * st.act;
          ['glow', 'core'].forEach(function (part) {
            var path = g.querySelector('.tether-' + part);
            path.setAttribute('d', d);
            path.setAttribute('stroke-width', (TETHER_WIDTH[part] * swell).toFixed(2));
          });
          g.removeAttribute('display');
          shown = true;
        });
        $('tetherLayer').hidden = !shown;
      }

      // One loop for all three, throttled to ~30 fps. The hold goes first so
      // the cells it takes are out of the breath before the breath is set.
      function pointerFxTick(now) {
        window.requestAnimationFrame(pointerFxTick);
        if (now - fxLastTick < FX_TICK_MS) return;
        var dt = Math.min(150, now - (fxLastNow || now));
        fxLastTick = now;
        fxLastNow = now;
        try {
          var colour = breathingSurface();
          holdFrame(colour, pointerAnchor());
          breathFrame(now, colour);
          tetherTick(now, dt);
          spinTick(dt);
        } catch (_error) { /* mid style swap: next tick retries */ }
      }

      // The two windows turning: the panorama on its heading, the close-up
      // around its hexagon. Neither turns while hidden, and the close-up
      // waits out the ease that re-frames it so the two motions never fight.
      function spinTick(dt) {
        pwSpin = (pwSpin + PW_SPIN_DEG_S * dt / 1000) % 360;
        if (pwPano && pwMode === 'pano' && !pwHost().hidden) {
          try { pwPano.setPov({ heading: (pwHeading + pwSpin) % 360, pitch: 0 }); }
          catch (_error) { /* torn down */ }
        }
        if (zwMap && zwMapReady && !zwHost().hidden && !zwMap.isEasing()) {
          try { zwMap.setBearing(zwMap.getBearing() + ZW_ORBIT_DEG_S * dt / 1000); }
          catch (_error) { /* mid swap */ }
        }
      }
      window.requestAnimationFrame(pointerFxTick);

      // ---- ctrl+shift+F: the pointer without the table -------------------
      function fakePointerToggle() {
        if (fakePointer) {
          fakePointer = null;
          pwStatus('Pointer 24 simulation off.', '');
          return;
        }
        var at = map.unproject([pwCursor.x, pwCursor.y]);
        fakePointer = { lng: at.lng, lat: at.lat, heading: map.getBearing() };
        // Everything downstream of the tag follows the simulation at once:
        // the street window aims from it, the close-up frames its hexagon,
        // and the hold and tether pick it up on their next tick.
        pwPointer = { lng: at.lng, lat: at.lat, heading: fakePointer.heading };
        pwAskedAt = null;
        pwHeadingHeld = null;
        if (!pwHost().hidden) pwAim();
        if (!zwHost().hidden) { zwCellId = null; zwAimAt(fakePointer); }
        pwStatus('Pointer 24 simulated at the cursor -- ctrl+shift+F again to release.', 'ok');
      }

      // ---- the debug shortcuts ------------------------------------------
      // ctrl+shift+S, ctrl+shift+D and ctrl+shift+F, on e.code so they land
      // on the same physical keys whatever the keyboard layout.
      window.addEventListener('keydown', function (event) {
        if (!event.ctrlKey || !event.shiftKey || event.altKey) return;
        var tag = event.target && event.target.tagName
          ? event.target.tagName.toLowerCase() : '';
        if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
        if (event.code === 'KeyS') { event.preventDefault(); pwDebugToggle(); }
        else if (event.code === 'KeyD') { event.preventDefault(); zwDebugToggle(); }
        else if (event.code === 'KeyF') { event.preventDefault(); fakePointerToggle(); }
        else if (event.code === 'KeyA') { event.preventDefault(); expoFlipToggle(); }
      });

      async function pwPoll() {
        if (!pwOn || pwBusy) return;
        pwBusy = true;
        try {
          var response = await fetch('/api/tags', { cache: 'no-store' });
          if (!response.ok) throw new Error('tags ' + response.status);
          pwApply(await response.json());
        } catch (_error) {
          pwStatus('Camera not reachable.', 'err');
        } finally {
          pwBusy = false;
        }
      }

      async function pwStart() {
        if (!pwLayout) {
          var data = await (await fetch('/api/imobyl/frame', { cache: 'no-store' })).json();
          if (!data || !data.ok) throw new Error('layout');
          pwLayout = data;
        }
        if (!zwLayout) {
          // Not fatal: a marker family with too few free ids has no close-up
          // sheet, and the street window is still worth running.
          try {
            var zoom = await (await fetch('/api/imobyl/frame?kind=zoom',
                                          { cache: 'no-store' })).json();
            if (zoom && zoom.ok) zwLayout = zoom;
          } catch (_error) { /* the street window stands alone */ }
        }
        pwOn = true;
        pwNote('Posez le pointeur sur la carte');
        pwTimer = window.setInterval(pwPoll, PW_POLL_MS);
        pwStatus('Watching\u2026', 'busy');
      }

      // The window itself has pointer-events:none so the map stays usable
      // underneath, so the click is caught on the way down and hit-tested
      // against the window's own quad.
      window.addEventListener('click', function (event) {
        if (!pwWindowHit([event.clientX, event.clientY])) return;
        event.preventDefault();
        event.stopPropagation();
        pwCycleView();
      }, true);

      // Watching starts on its own whenever the backend has a camera: a
      // projected page that shows nothing until a button in another window is
      // pressed gives no way to tell "not started" from "not detected".
      fetch('/api/tags', { cache: 'no-store' })
        .then(function (response) { return response.json(); })
        .then(function (data) {
          var live = data && data.frame && Number(data.frame.width) > 0;
          if (live && !pwOn) {
            pwStart().catch(function () {
              pwStatus('Could not load the frame layout.', 'err');
            });
          }
        })
        .catch(function () { /* no backend, no camera: nothing to watch */ });

      window.addEventListener('resize', function () {
        // The quads are in screen pixels; a resize invalidates them and the
        // next poll refits.
        pwQuad = null;
        pwCellQuads = null;
      });

      // ==================== the views ====================================
      // Seven scenes, chosen rather than played: the roads everyone drew, one
      // per sticker colour, then every colour at once. Each is a disc along
      // the bottom of the table
      // that a pointer tag (or a click) selects, and a scene stays up until
      // another is chosen -- a room takes as long as it takes.
      //
      // The scenes are derived from the data every time -- nothing here is a
      // saved camera position -- so the same set works for another workshop
      // in another city without being re-authored.
      // The three answers a hexagon can carry and the words for them, taken
      // from the extremes of BIV_MATRIX itself -- all plus, all minus, and its
      // centre for an even split -- so a swatch cannot drift from the surface
      // it names.
      var PREVIZ_TONES = [
        { fill: BIV_MATRIX[0][2], label: 'Surtout des +' },
        { fill: BIV_MATRIX[2][0], label: 'Surtout des −' },
        { fill: BIV_MATRIX[1][1], label: 'Autant des deux — lieu contesté' }
      ];

      // Likewise the two modes: the swatch is the colour the paths are drawn
      // in, not a second copy of it.
      function previzModeLegend() {
        return [
          { colour: displayPathColor('#eb6f73'), label: 'À pied' },
          { colour: displayPathColor('#252525'), label: 'À vélo' }
        ];
      }

      // The two poles of the question this colour asked, in its own words --
      // the positive one first, because that is the one the blue means. With
      // the question spelled out here the scene needs no plaque above it.
      function previzStickerLegend(question) {
        var poles = String(question || '').split(' // ');
        var spoken = [poles[0], poles[1]].map(function (text) {
          text = String(text || '').trim();
          return text ? text.charAt(0).toUpperCase() + text.slice(1) : '';
        });
        return PREVIZ_TONES.map(function (tone, index) {
          return { colour: tone.fill, label: spoken[index] || tone.label };
        });
      }

      function previzShowLegend(rows) {
        var host = $('previzLegend');
        host.textContent = '';
        if (!rows || !rows.length) { host.hidden = true; return; }
        rows.forEach(function (row) {
          var line = document.createElement('div');
          line.className = 'row';
          var swatch = document.createElement('span');
          swatch.className = 'sw';
          // The hexagon's fill is the inset ::before, which reads it from here.
          swatch.style.setProperty('--sw', row.colour);
          var text = document.createElement('span');
          text.textContent = row.label;
          line.appendChild(swatch);
          line.appendChild(text);
          host.appendChild(line);
        });
        host.hidden = false;
      }
      var previzIndex = -1;
      // A scene states what belongs on screen rather than inheriting whatever
      // the operator last left switched on. Without this the walking scene
      // showed cycling trips and every sticker too, so the camera move was the
      // only thing distinguishing it -- which is not a scene, just a caption.
      //   null            -> the page's own settings, outside the slideshow
      //   {paths, colour, stickers} -> exactly this, for the duration
      var previzFilter = null;

      function previzSetContent(filter) {
        previzFilter = filter;
        references.forEach(function (reference) {
          reference.vizCache = null;
          reference.flowAnim = null;
        });
        references.forEach(paintReference);
      }

      // ---- geometry: sheet pixels back to the world ----------------------
      function sheetPixelToLngLat(reference, x, y) {
        var c = reference.corners;
        if (!c || c.length !== 4) return null;
        var size = manualTargetSize(reference);
        var u = size.w > 1 ? x / (size.w - 1) : 0;
        var v = size.h > 1 ? y / (size.h - 1) : 0;
        return [
          c[0][0] + (c[1][0] - c[0][0]) * u,
          c[0][1] + (c[3][1] - c[0][1]) * v
        ];
      }

      // Liberty calls its extrusion layer building-3d; the exhibition style
      // called it buildings-3d. Both are tried so the page does not quietly
      // stop having buildings when the basemap is swapped.
      var BUILDINGS_3D_LAYERS = ['building-3d', 'buildings-3d'];

      function setBuildings3d(on) {
        BUILDINGS_3D_LAYERS.forEach(function (id) {
          // Asked for rather than attempted: a missing layer makes maplibre
          // FIRE an error rather than throw one, so a try/catch here would
          // catch nothing and the console would fill up.
          if (!map.getLayer || !map.getLayer(id)) return;
          try { map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none'); }
          catch (_error) { /* mid style swap */ }
        });
      }

      // The extrusions have a minzoom of their own, below which the city goes
      // flat -- and a scene built on building massing is not worth showing
      // without it. So that minzoom becomes the camera's floor: the map cannot
      // be zoomed out past the point where the buildings would drop out.
      // Read from the style rather than written here, so a restyled basemap
      // carries its own floor with it.
      function capZoomToBuildings() {
        var floor = 14;
        try {
          (map.getStyle().layers || []).forEach(function (layer) {
            if (BUILDINGS_3D_LAYERS.indexOf(layer.id) >= 0
                && typeof layer.minzoom === 'number') {
              floor = layer.minzoom;
            }
          });
          // setMinZoom pulls the camera up with it if it is already below.
          if (map.getMinZoom() !== floor) map.setMinZoom(floor);
        } catch (_error) { /* mid style swap: the next style.load retries */ }
      }

      // The finest bin the panel offers. A sticker scene is about where a
      // feeling actually sits, and at 40 m a bin is roughly a building
      // frontage: the surface follows the streets instead of averaging a whole
      // block into one answer, which is what the coarser default does.
      // The bin width the round steps read at, in metres. This is the
      // hexagon's size on the ground: the surface is drawn on a lattice of
      // this pitch, so doubling it doubles the hexagon. The spread rings that
      // carry a reading out over unmarked ground are counted in cells, not
      // metres, so they reach twice as far at this size too -- which is what
      // makes a coarser bin read as a broader neighbourhood rather than a
      // blockier version of the same patch.
      var PREVIZ_BIN_METRES = 80;

      // Interpolation is a panel switch, so the switch itself moves with it --
      // a scene that silently disagreed with the checkbox beside it would be
      // the harder thing to debug later.
      function previzSetInterpolate(on) {
        bivInterpolate = on;
        $('bivInterpolate').checked = on;
        $('bivSpread').disabled = !on;
      }

      // Both the slideshow and the colour round drive the heatmap for their
      // own ends, so whichever takes it borrows it: the operator's own
      // settings are noted once and handed back when the show stops. They
      // never run together -- the big button is disabled during a round -- so
      // one snapshot covers both.
      var viewBorrowed = null;

      function borrowView() {
        if (viewBorrowed) return;
        viewBorrowed = {
          interpolate: bivInterpolate,
          kinds: selectedKinds(),
          colours: {}
        };
        Object.keys(heatSettings).forEach(function (name) {
          viewBorrowed.colours[name] = {
            enabled: heatSettings[name].enabled,
            binMetres: heatSettings[name].binMetres
          };
        });
      }

      function returnView() {
        if (!viewBorrowed) return;
        Object.keys(viewBorrowed.colours).forEach(function (name) {
          if (!heatSettings[name]) return;
          heatSettings[name].enabled = viewBorrowed.colours[name].enabled;
          heatSettings[name].binMetres = viewBorrowed.colours[name].binMetres;
        });
        previzSetInterpolate(viewBorrowed.interpolate);
        applySceneKinds(viewBorrowed.kinds);
        viewBorrowed = null;
        refreshStickerHeatmap();
        paintDrawingMask();
      }

      // Bumped whenever the shown colour changes, so a fade still on its way
      // in knows it belongs to a step already gone.
      var heatStepToken = 0;

      // Every colour's bins off. Deliberately not a refreshStickerHeatmap:
      // that rebuilds the surface for all five colours whether they are shown
      // or not, and a scene that does not want the heatmap should not pay to
      // recompute one.
      function hideHeatColours() {
        heatStepToken += 1;      // drops any fade still waiting to start
        Object.keys(heatSettings).forEach(function (name) {
          heatSettings[name].enabled = false;
        });
        heatKnownColours.forEach(function (colourClass) {
          var layerId = heatIds(colourClass).layer;
          if (map.getLayer(layerId)) {
            map.setLayoutProperty(layerId, 'visibility', 'none');
          }
        });
      }

      // This colour's stickers alone, spread across the ground, at the finest
      // bin -- the view a sticker scene and a round step both want. The scene
      // used to show the ten fullest bins as isolated hexagons, which answers
      // "where are the most stickers": a different question from the one the
      // colour asked, and one an audience cannot read a neighbourhood off.
      //
      function showHeatColour(colourClass) {
        heatStepToken += 1;
        borrowView();
        var settings = heatSettingsFor(colourClass);
        // heatSettingsFor may have just invented this colour's settings, in
        // which case borrowView never saw them to put back.
        if (!viewBorrowed.colours[colourClass]) {
          viewBorrowed.colours[colourClass] = {
            enabled: false, binMetres: settings.binMetres
          };
        }
        Object.keys(heatSettings).forEach(function (name) {
          heatSettings[name].enabled = (name === colourClass);
        });
        settings.binMetres = PREVIZ_BIN_METRES;
        previzSetInterpolate(true);
        refreshStickerHeatmap();
      }

      function stickerScene(colourClass) {
        var entry = MANUAL_STICKER_COLORS.filter(function (item) {
          return item.id === colourClass;
        })[0] || {};
        return {
