          title: entry.question || (entry.label || colourClass) + ' stickers',
          // The legend says the question in full, so a plaque above the map
          // would only be saying it twice.
          showTitle: false,
          // The surface is the scene; trips drawn across it are another
          // workshop's answer to another question.
          kinds: [],
          legend: previzStickerLegend(entry.question),
          run: function () {
            // Flat. A sticker scene is a surface read from above -- extruded
            // blocks throw the hexagons into shadow and hide the ones behind
            // them, which is the opposite of what the scene is for. Only the
            // trips scene, which is about the shape of the streets, keeps them.
            setBuildings3d(false);
            previzSetContent({
              paths: false, colour: null, stickers: false, stickerColour: colourClass
            });
            showHeatColour(colourClass);
          }
        };
      }

      // Every question's stickers on one surface. It keeps its title, unlike
      // a sticker scene: there is no single question for the legend to state,
      // so the plaque is the only thing that says what is being shown.
      function aggregateScene() {
        return {
          title: 'Toutes les dimensions réunies',
          kinds: [],
          legend: previzStickerLegend(''),
          run: function () {
            setBuildings3d(false);
            previzSetContent({ paths: false, colour: null, stickers: false });
            showHeatColour(BIV_ALL_KEY);
          }
        };
      }

      // Built fresh each run: a workshop that used three colours gets three
      // sticker scenes, not five empty ones.
      // One scene per disc, in the discs' order.
      function buildPrevizScenes() {
        return EXPO_PARTS.map(function (part) {
          if (part.roads) return roadsScene();
          if (part.aggregate) return aggregateScene();
          return stickerScene(part.key);
        });
      }

      function roadsScene() {
        return {
          title: "Vue d'ensemble de la mobilité",
          kinds: ['line'],
          legend: previzModeLegend(),
          run: function () {
            setBuildings3d(false);
            previzSetContent({ paths: true, colour: null, stickers: false });
            $('pulseCount').value = 40;
            $('pulseCount').dispatchEvent(new Event('input'));
            $('pathWidth').value = 0.4;
            $('pathWidth').dispatchEvent(new Event('input'));
            setPathVizMode('flow');
            // Deliberately NOT snapping to the street network. Flow width now
            // carries the corridors on its own, and snapping rewrote the lines
            // people actually drew -- the point of the overview is to show the
            // trips as they were drawn. Whatever the operator set stands.
          }
        };
      }

      var PREVIZ_SCENES = [];


      // The scene titles are questions now, and the longest runs three times
      // the shortest. Rather than size the banner for the worst case and leave
      // the short ones small, each title is measured once and stepped down only
      // as far as that one needs to hold its single line.
      function fitSceneTitle() {
        var banner = $('expoTimer');
        banner.style.fontSize = '';
        if (banner.hidden) return;
        var room = window.innerWidth * 0.94 - 52;      // the padding either side
        var natural = $('expoTimerText').getBoundingClientRect().width;
        if (!natural || natural <= room) return;
        var size = parseFloat(window.getComputedStyle(banner).fontSize) || 24;
        banner.style.fontSize = Math.max(13, size * room / natural) + 'px';
      }

      window.addEventListener('resize', fitSceneTitle);

      function previzShow(index) {
        previzIndex = index;
        var scene = PREVIZ_SCENES[index];
        if (!scene) return;
        // A scene states what belongs on screen, and the heatmap is part of
        // that: it starts off, and only a scene that wants it turns it on.
        // Clearing it once at the start of the show was not enough -- the
        // moment the round looped past a sticker scene it carried that
        // colour's hexagons under every scene after it.
        hideHeatColours();
        applySceneKinds(scene.kinds);
        try {
          scene.run();
        } catch (error) {
          console.error('scene "' + scene.title + '" failed:', error);
        }
        // A scene puts its title up and nothing else -- unless its legend
        // already carries the words, in which case it puts up nothing.
        $('expoTimer').hidden = scene.showTitle === false;
        if (scene.showTitle !== false) {
          $('expoTimerText').textContent = scene.title;
          fitSceneTitle();
        }
        previzShowLegend(scene.legend);
        expoMarkActive(index);
      }

      function previzRunning() { return previzIndex >= 0; }

      function previzStop() {
        previzIndex = -1;
        setBuildings3d(false);
        $('previzLegend').hidden = true;
        $('expoTimer').hidden = true;
        // Snapping is the operator's setting alone -- no scene changes it, so
        // the show has nothing to put back.
        if (previzFilter) previzSetContent(null);
        returnView();
        expoMarkActive(-1);
      }

      function previzStart(index) {
        previzStop();

        previzShow(index);
      }

      // ---- the discs ----------------------------------------------------
      // Five wedges, one per question, so the disc says "all of them" without
      // a caption. Read off the palette so a colour added there appears here.
      var EXPO_ALL_DISC = 'conic-gradient(' + MANUAL_STICKER_COLORS.map(
        function (entry, index, list) {
          var wedge = 360 / list.length;
          return entry.color + ' ' + (index * wedge) + 'deg '
            + ((index + 1) * wedge) + 'deg';
        }).join(', ') + ')';

      var EXPO_PARTS = [{ key: 'roads', label: 'Trajets', colour: '#2b2f33', roads: true }]
        .concat(MANUAL_STICKER_COLORS.map(function (entry) {
          return {
            key: entry.id, colour: entry.color,
            // The positive pole of the question is the name of the view.
            label: String(entry.question || entry.label).split(' // ')[0].trim()
          };
        }))
        // Last, because it is the one that only makes sense after the five.
        .concat([{
          key: BIV_ALL_KEY, label: 'Toutes les dimensions',
          colour: EXPO_ALL_DISC, aggregate: true
        }]);
      var EXPO_ROADS_GLYPH = '<svg viewBox="0 0 32 32" aria-hidden="true">'
        + '<path d="M9 29 L13 3 M23 29 L19 3" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>'
        + '<path d="M16 6 V26" stroke="#fff" stroke-width="2.4" stroke-dasharray="4 4" stroke-linecap="round"/></svg>';

      function expoParts() {
        return Array.prototype.slice.call($('expoBar').querySelectorAll('.part'));
      }

      function expoBuildBar() {
        var bar = $('expoBar');
        bar.textContent = '';
        EXPO_PARTS.forEach(function (part, index) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'part';
          button.dataset.index = String(index);
          button.title = part.label;
          var disc = document.createElement('span');
          disc.className = 'disc';
          disc.style.background = part.colour;
          if (part.roads) disc.innerHTML = EXPO_ROADS_GLYPH;
          var name = document.createElement('span');
          name.className = 'name';
          name.textContent = part.label;
          button.appendChild(disc);
          button.appendChild(name);
          button.addEventListener('click', function () { expoSelect(index); });
          bar.appendChild(button);
        });
        expoRefreshEmpty();
      }

      // A colour with no stickers on any ticked sheet is dimmed, not hidden:
      // the row of discs is the vocabulary of the workshop, and a gap in it
      // would read as a view missing rather than as a question nobody answered.
      function expoRefreshEmpty() {
        var present = stickerPointsByColour();
        expoParts().forEach(function (button, index) {
          var part = EXPO_PARTS[index];
          var empty;
          if (part.roads) {
            empty = false;
          } else if (part.aggregate) {
            // The sum is empty only when every question is.
            empty = !Object.keys(present).some(function (name) {
              return present[name].points.length > 0;
            });
          } else {
            empty = !(present[part.key] && present[part.key].points.length);
          }
          button.classList.toggle('is-empty', empty);
        });
      }

      function expoMarkActive(index) {
        expoParts().forEach(function (button, i) {
          button.classList.toggle('is-active', i === index);
        });
      }

      // Choosing the view already up puts it away, so the same gesture that
      // opens a scene also closes it.
      function expoSelect(index) {
        if (index < 0 || index >= EXPO_PARTS.length) return;
        expoRefreshEmpty();
        if (previzRunning() && previzIndex === index) { previzStop(); return; }
        if (!previzRunning()) previzStart(index);
        else previzShow(index);
      }

      // ---- selecting with the workshop's pointer -------------------------
      // The tag is the one the marker settings call the first Pointer, so
      // the object that draws on the workshop page chooses views here. It has
      // to rest on a disc for a moment before the choice is made -- a tag
      // carried across the row must not open every view it passes -- and
      // resting there longer changes nothing, so a hand can be left in place.
      var EXPO_DWELL_MS = 350;
      var EXPO_REACH = 1.35;            // the disc's hit area, as a multiple of its size
      var expoPointerId = 11;
      var expoHover = { index: -1, since: 0, fired: false };

      fetch('/api/marker-settings', { cache: 'no-store' })
        .then(function (response) { return response.json(); })
        .then(function (data) {
          var slot = ((data && data.slots) || []).filter(function (item) {
            return item && item.tool === 'draw' && isFinite(Number(item.tagId));
          })[0];
          if (!slot) return;
          expoPointerId = Number(slot.tagId);
          // The same slot describes the whole pointer: the two tags hinged
          // into a pen and how far past the hinge the nib sits. Whatever the
          // workshop is set up with is what works here.
          penSetup = {
            a: Number(slot.tagId),
            b: slot.tagId2 !== null && isFinite(Number(slot.tagId2)) ? Number(slot.tagId2) : null,
            offsetCm: isFinite(Number(slot.offsetCm)) ? Number(slot.offsetCm) : 3,
            tagSizeCm: isFinite(Number(data.tagSizeCm)) ? Number(data.tagSizeCm) : 3
          };
        })
        .catch(function () { /* the defaults stand */ });


      // ==================== the workshop's pen, on this table ============
      // The workshop's drawing pointer is not one tag but a folding card: two
      // tags hinged together, pinched open and let shut again. Its ids, the
      // nib offset and the tag size come from the marker settings, so this
      // page follows whatever the workshop is set up with; the hinge maths is
      // CompactFoldGeometry, the module whose own header says the math lives
      // in one place.
      //
      // Here the pen does not draw: it is a second pointer 24.
      //   - Resting the nib on a disc still chooses that view.
      //   - A pinch that starts on the street window steps to its next view.
      //   - A pinch anywhere else on the map puts the pointer there -- the
      //     street window and the close-up look from that spot, the way the
      //     pen points -- and holding the pinch drags it along.
      // Tag 24 wins whenever it is on the table; the pen only places the
      // pointer once 24 has been out of sight for a moment.
      var FOLD_EDGE_INDEX = 2;          // the decoded bottom edge, as the workshop offsets from
      var FOLD_OPEN_DEG = 10;           // pinched at or above this hinge angle
      var FOLD_CLOSE_DEG = 8;           // and let go again below it: hysteresis, or it chatters
      // The nib sits this many times further out than on the workshop page,
      // so the dot clears the hand holding the card.
      var PEN_TIP_REACH = 2;
      // Detection drops the odd frame, so a tag 24 lying on the table must be
      // gone this long before the pen may move the pointer.
      var PEN_TAG_AWAY_MS = 1000;

      var penSetup = null;              // filled from the marker settings
      var foldLatch = false;            // the hinge is open (hysteresis, anti-chatter)
      var penPinch = '';                // what the pinch in progress does: 'map', 'street' or 'none'

      function penCornersPx(tag) {
        if (!tag || !Array.isArray(tag.uvCorners) || tag.uvCorners.length !== 4) return null;
        var out = [];
        for (var i = 0; i < 4; i += 1) {
          var q = tag.uvCorners[i];
          if (!q || !isFinite(q.u) || !isFinite(q.v)) return null;
          var px = pwUvPx(q.u, q.v, window.innerWidth, window.innerHeight);
          out.push({ x: px[0], y: px[1] });
        }
        return out;
      }

      function penCentre(corners) {
        var x = 0, y = 0;
        for (var i = 0; i < 4; i += 1) { x += corners[i].x; y += corners[i].y; }
        return { x: x / 4, y: y / 4 };
      }

      // A folded pair, as the workshop reads one: the hinge angle says open or
      // shut, and the nib is the mean of each tag's fixed edge pushed out
      // along its own normal by the configured offset (further, on this page).
      function penFold(cornersA, cornersB, wasOpen) {
        var FG = window.CompactFoldGeometry;
        if (!FG || !cornersA || !cornersB) return null;
        var edgesA = FG.tagEdges(cornersA);
        var edgesB = FG.tagEdges(cornersB);
        var hinge = FG.hinge(edgesA, edgesB);
        var ea = FG.fixedEdge(edgesA, FOLD_EDGE_INDEX);
        var eb = FG.fixedEdge(edgesB, FOLD_EDGE_INDEX);
        if (!hinge || !ea || !eb) return null;
        var scale = PEN_TIP_REACH * Math.max(0, Math.min(20, penSetup.offsetCm)) / (penSetup.tagSizeCm || 3);
        var oa = FG.edgeOffset(ea, scale * FG.meanSide(cornersA));
        var ob = FG.edgeOffset(eb, scale * FG.meanSide(cornersB));
        return {
          angle: hinge.angle,
          open: wasOpen ? hinge.angle > FOLD_CLOSE_DEG : hinge.angle >= FOLD_OPEN_DEG,
          tip: { x: (oa.x + ob.x) / 2, y: (oa.y + ob.y) / 2 },
          centre: {
            x: (penCentre(cornersA).x + penCentre(cornersB).x) / 2,
            y: (penCentre(cornersA).y + penCentre(cornersB).y) / 2
          }
        };
      }

      // The way the pen points, as a map bearing: from the middle of the card
      // out to the nib. Measured the way pwPointerFrom measures tag 24.
      function penHeading(pen) {
        var dx = pen.tip.x - pen.centre.x, dy = pen.tip.y - pen.centre.y;
        var heading = Math.atan2(dx, -dy) * 180 / Math.PI + map.getBearing() + PW_HEADING_OFFSET;
        return ((heading % 360) + 360) % 360;
      }

      function zwWindowHit(px) {
        var quad = tetherQuad('zoom');
        return !!quad && pwPointInPoly(px, quad);
      }

      // ---- one poll ------------------------------------------------------
      // The pen as { tip, centre, open, placing }, or null while its two tags
      // are not both in view. `placing` means the pinch in progress started on
      // open map, so the nib is where the pointer should be.
      function penTick(tags, now) {
        if (!penSetup || !window.CompactFoldGeometry) return null;
        var byId = {};
        (tags || []).forEach(function (tag) {
          if (tag) byId[tag.id] = penCornersPx(tag);
        });
        var tipNode = $('penTip');
        var a = byId[penSetup.a];
        var bTag = penSetup.b !== null ? byId[penSetup.b] : null;
        if (!a || !bTag) {
          // A single tag is still a pointer -- it just cannot pinch. Discs and
          // the street window are chosen by resting on them, as they always were.
          foldLatch = false;
          penPinch = '';
          tipNode.hidden = true;
          return null;
        }
        var pen = penFold(a, bTag, foldLatch);
        if (!pen) { penPinch = ''; tipNode.hidden = true; return null; }
        foldLatch = pen.open;

        var at = [pen.tip.x, pen.tip.y];
        if (pen.open && !penPinch) {
          // What a pinch does is settled where it starts, so dragging out of
          // the window never turns a view change into a move, or back. The
          // discs choose by resting and the close-up sheet covers the ground it
          // shows, so a pinch on either does nothing.
          if (expoPartAt(at) >= 0 || zwWindowHit(at)) {
            penPinch = 'none';
          } else if (pwWindowHit(at)) {
            penPinch = 'street';
            pwCycleView();
          } else {
            penPinch = 'map';
          }
        } else if (!pen.open) {
          penPinch = '';
        }
        pen.placing = penPinch === 'map';

        tipNode.hidden = false;
        tipNode.style.left = pen.tip.x + 'px';
        tipNode.style.top = pen.tip.y + 'px';
        tipNode.classList.toggle('is-down', pen.open);
        return pen;
      }

      function expoPartAt(px) {
        var parts = expoParts();
        for (var i = 0; i < parts.length; i += 1) {
          var rect = parts[i].querySelector('.disc').getBoundingClientRect();
          var cx = rect.left + rect.width / 2;
          var cy = rect.top + rect.height / 2;
          if (Math.hypot(px[0] - cx, px[1] - cy) <= rect.width / 2 * EXPO_REACH) return i;
        }
        return -1;
      }

      function expoPointerTick(tags, now, pen) {
        var live = null;
        tags.forEach(function (tag) { if (tag && tag.id === expoPointerId) live = tag; });
        var hit = -1;
        // With a folded pen the nib is what is being aimed, not the middle of
        // one of its two tags; a lone tag falls back to its own centre.
        if (pen && pen.tip) {
          hit = expoPartAt([pen.tip.x, pen.tip.y]);
        } else if (live && live.uv && isFinite(live.uv.u) && isFinite(live.uv.v)) {
          hit = expoPartAt(pwUvPx(live.uv.u, live.uv.v, window.innerWidth, window.innerHeight));
        }
        // A tag at the discs' own edge is a hand there: the row comes out for
        // it exactly as it does for the mouse, or a tag could never reach a row
        // that only appears when a hand is near it. Which edge that is follows
        // the flip, so the discs stay reachable by tag on either side.
        var edgeY = pen && pen.tip ? pen.tip.y
          : (live && live.uv && isFinite(live.uv.v)
              ? pwUvPx(live.uv.u, live.uv.v, window.innerWidth, window.innerHeight)[1] : null);
        if (edgeY !== null) {
          var nearTop = expoFlipped();
          var reached = nearTop
            ? edgeY <= EDGE_PEEK_BOTTOM
            : edgeY >= window.innerHeight - EDGE_PEEK_BOTTOM;
          if (reached) document.body.classList.add(nearTop ? 'peek-top' : 'peek-bottom');
        }
        // Resting a lone pointer tag on the projected street view taps it, the
        // way resting on a disc chooses it. The cooldown is what makes a hand
        // left in place step once, not forever. The folding pen taps by
        // pinching instead (penTick), so it is left out here: resting it on
        // the window while lining up a pinch must not step twice.
        var tapAt = !pen && live && live.uv && isFinite(live.uv.u) && isFinite(live.uv.v)
          ? pwUvPx(live.uv.u, live.uv.v, window.innerWidth, window.innerHeight) : null;
        if (tapAt && hit < 0 && pwWindowHit(tapAt)) {
          if (!pwTapState.since) pwTapState.since = now;
          if (!pwTapState.fired && now - pwTapState.since >= PW_TAP_DWELL_MS
              && now - pwTapState.last >= PW_TAP_COOLDOWN_MS) {
            pwTapState.fired = true;
            pwTapState.last = now;
            pwCycleView();
          }
        } else {
          pwTapState.since = 0;
          pwTapState.fired = false;
        }

        if (hit !== expoHover.index) {
          expoHover = { index: hit, since: now, fired: false };
        } else if (hit >= 0 && !expoHover.fired && now - expoHover.since >= EXPO_DWELL_MS) {
          expoHover.fired = true;
          expoSelect(hit);
        }
        expoParts().forEach(function (button, i) {
          button.classList.toggle('is-hover', i === hit);
        });
      }

      expoBuildBar();
      syncExpoBarHeight();
      window.addEventListener('resize', syncExpoBarHeight);

      // Pointer near an edge reveals that edge's controls. A generous band,
      // because at an exhibition people aim roughly.
      var EDGE_PEEK = 110;
      // The bottom edge carries two stacked bars during a slideshow, so its
      // band reaches high enough to cover the overlap slider as well -- a
      // slider that hides itself the moment you reach for it is unusable.
      var EDGE_PEEK_BOTTOM = 200;
      var edgeHideTimer = 0;

      function updateEdgePeek(x, y) {
        var body = document.body;
        body.classList.toggle('peek-left', x <= EDGE_PEEK);
        body.classList.toggle('peek-right', x >= window.innerWidth - EDGE_PEEK);
        body.classList.toggle('peek-bottom', y >= window.innerHeight - EDGE_PEEK_BOTTOM);
        body.classList.toggle('peek-top', y <= EDGE_PEEK_BOTTOM);
      }

      // Which edge the row of view discs lives on. Ctrl+Shift+A swaps it: the
      // discs move to the far side of the table and turn 180 degrees, so the
      // person standing there reads them the right way up instead of upside
      // down. Reveal it on the way, since the edge it just moved to is not the
      // edge anyone's hand happens to be near.
      function expoFlipped() {
        return document.body.classList.contains('expo-top');
      }

      // offsetHeight is the laid-out height, so the rotate/translate the row
      // carries do not distort it. Published as a custom property because the
      // title's offset is expressed in CSS.
      function syncExpoBarHeight() {
        var bar = $('expoBar');
        if (!bar) return;
        var height = bar.offsetHeight;
        if (height > 0) document.body.style.setProperty('--expo-bar-h', height + 'px');
      }

      function expoFlipToggle() {
        var body = document.body;
        var top = body.classList.toggle('expo-top');
        body.classList.remove('peek-top', 'peek-bottom');
        body.classList.add(top ? 'peek-top' : 'peek-bottom');

        fitSceneTitle();
      }

      window.addEventListener('mousemove', function (event) {
        updateEdgePeek(event.clientX, event.clientY);
      });
      window.addEventListener('touchstart', function (event) {
        var touch = event.touches && event.touches[0];
        if (!touch) return;
        updateEdgePeek(touch.clientX, touch.clientY);

        edgeHideTimer = window.setTimeout(function () {
          updateEdgePeek(window.innerWidth / 2, window.innerHeight / 2);
        }, 4000);
      }, { passive: true });

      // Show everything briefly on arrival, so the controls are discoverable
      // before they tuck themselves away.
      document.body.classList.add('peek-left', 'peek-right', 'peek-bottom', 'peek-top');
      window.setTimeout(function () {
        updateEdgePeek(window.innerWidth / 2, window.innerHeight / 2);
      }, 2600);

      // The keyboard is the operator's pointer: 1 to 6 choose a view, 0
      // puts it away.
      window.addEventListener('keydown', function (e) {
        var tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : '';
        if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
        if (/^[1-7]$/.test(e.key)) expoSelect(Number(e.key) - 1);
        if (e.key === '0' && previzRunning()) previzStop();
      });

      // ==================== sessions ====================
      // What gets written is the vector result — sticker points, traced
      // polylines, hand edits — not the detection raster. That keeps a session
      // to a few hundred kilobytes of readable JSON, and the page already draws
      // everything from those vectors, so a restored session looks the same as
      // a freshly detected one. Files live on the server rather than in the
      // browser, so the expo survives a cleared cache or a change of machine.
      function collectSessionState() {
        return {
          name: String($('sessionName').value || '').trim(),
          threshold: Number(thresholdInput.value),
          mapId: String($('digitizeMapId').value || ''),
          heat: heatSettings,
          // The sheet being digitised when this was saved; reopening selects it.
          sheetId: scanSheetId,
          references: references.map(function (reference) {
            return {
              id: reference.id,
              corners: reference.corners,
              visible: reference.visible !== false,
              photos: reference.photos
                .filter(function (photo) { return photo.result; })
                .map(function (photo) {
                  var result = photo.result;
                  return {
                    name: photo.name,
                    width: result.width,
                    height: result.height,
                    stickerDiameter: result.stickerDiameter,
                    counts: result.counts,
                    colors: result.colors,
                    stickerColors: result.stickerColors,
                    markers: result.markers,
                    paths: result.paths,
                    inkPixels: result.inkPixels
                  };
                }),
              manual: reference.manual
                ? {
                  markers: reference.manual.markers,
                  pins: reference.manual.pins || [],
                  strokes: reference.manual.strokes.map(function (stroke) {
                    return {
                      points: stroke.points, color: stroke.color,
                      colorClass: stroke.colorClass, colorLabel: stroke.colorLabel,
                      width: stroke.width
                    };
                  })
                }
                : { markers: [], strokes: [], pins: [] }
            };
          })
        };
      }

      async function applySessionState(state) {
        references.slice().forEach(removeReference);
        sheets.length = 0;
        soloResult = null;
        clearSelectedReference();
        if (state.threshold) {
          thresholdInput.value = String(state.threshold);
          $('thresholdVal').textContent = String(state.threshold);
        }
        if (state.mapId) $('digitizeMapId').value = state.mapId;
        if (state.heat && typeof state.heat === 'object') {
          heatSettings = {};
          Object.keys(state.heat).forEach(function (key) {
            var saved = state.heat[key] || {};
            heatSettings[key] = {
              enabled: key === BIV_ALL_KEY ? false : Boolean(saved.enabled),
              binMetres: Number(saved.binMetres) || BIV_DEFAULTS.binMetres,
              perLevel: Number(saved.perLevel) || BIV_DEFAULTS.perLevel,
              opacity: Number(saved.opacity) || BIV_DEFAULTS.opacity
            };
          });
          heatKnownColours.slice().forEach(removeHeatLayers);
          heatKnownColours = [];
        }
        $('sessionName').value = state.name || '';

        // Which sheet was being digitised: the one saved as such, else a sheet
        // named after the typed map (sessions from before numbering), else
        // the last one.
        var savedRefs = state.references || [];
        var wantedId = String(state.sheetId || state.mapId || '');
        var primaryId = savedRefs.filter(function (saved) {
          return String(saved.id) === wantedId;
        }).length
          ? wantedId
          : (savedRefs.length ? String(savedRefs[savedRefs.length - 1].id) : '');

        // Re-align the reference sheet FIRST: applyMapSheet may swap the
        // basemap theme, which tears down every custom layer, and the ink
        // overlays built below must not be caught in that.
        var sheetLoaded = false;
        if (primaryId) {
          try {
            await loadMapSheet(primaryId, true);
            sheetLoaded = true;
          } catch (_error) {
            // The sheet is gone from disk. Hand editing still works off the
            // saved corners; only re-scanning a photo needs the reference.
          }
        }

        savedRefs.forEach(function (saved) {
          if (!Array.isArray(saved.corners) || saved.corners.length !== 4) return;
          var reference = addReference(String(saved.id), saved.corners);
          reference.visible = saved.visible !== false;
          reference.showBox.checked = reference.visible;
          (saved.photos || []).forEach(function (photo) {
            var entry = {
              name: photo.name || 'photo', url: '', sheetId: String(saved.id),
              reference: reference, done: true, failed: false,
              result: {
                segmented: true, kindCodes: null, classImage: null, maskImage: null,
                width: photo.width, height: photo.height,
                stickerDiameter: photo.stickerDiameter || 27,
                counts: photo.counts || null,
                colors: photo.colors || [],
                stickerColors: photo.stickerColors || [],
                markers: photo.markers || [],
                paths: photo.paths || [],
                inkPixels: photo.inkPixels || 0,
                eccRefined: true
              }
            };
            reference.photos.push(entry);
            sheets.push(entry);
          });
          reference.manual = {
            markers: (saved.manual && saved.manual.markers) || [],
            strokes: (saved.manual && saved.manual.strokes) || [],
            pins: (saved.manual && saved.manual.pins) || [],
            erased: null
          };
          refreshReferenceRow(reference);
        });
        projected = references.length > 0;

        // A restored session must be as editable as a freshly loaded one:
        // adopt its sheet the way loadDigitizeReference does, or editTarget()
        // stays null and every hand edit and new photo is silently dropped.
        var active = references.filter(function (reference) {
          return reference.id === primaryId;
        })[0] || references[references.length - 1] || null;
        if (active) {
          currentReference = active;
          selectReferenceForEditing(active);
          // Its map is loaded again, so new photos become further sheets of it.
          if (sheetLoaded && mapIdOf(active.id) === activeMapSheetId) {
            scanSheetId = active.id;
            loadedMap = { id: activeMapSheetId, corners: mapCorners.slice() };
            $('digitizeMapId').value = activeMapSheetId;
            $('digitizeMapId').classList.add('loaded');
          }
        }
        setReferenceSelectionReady(Boolean(loadedMap));

        refreshLegends();
        paintDrawingMask();
        refreshManualPins();
        // The restored sheets are what the row of discs describes, so it has
        // to be re-read here; otherwise every disc stays dimmed until one is
        // clicked, which reads as a workshop nobody answered.
        expoRefreshEmpty();
        setStatus($('inkStatus'), aggregateStatus());
        refreshExportBtn();
        return {loaded: Boolean(active), sheetLoaded: sheetLoaded, id: primaryId};
      }

      async function listSessions() {
        var response = await fetch('/api/imobyl/sessions', { cache: 'no-store' });
        var data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || 'Could not list sessions.');
        return data.sessions || [];
      }

      function renderSessionRows(sessions) {
        var host = $('sessionRows');
        host.textContent = '';
        if (!sessions.length) {
          var empty = document.createElement('div');
          empty.className = 'session-empty';
          empty.textContent = 'Nothing saved yet.';
          host.appendChild(empty);
          return;
        }
        sessions.forEach(function (session) {
          var row = document.createElement('div');
          row.className = 'session-row';
          var meta = document.createElement('div');
          meta.className = 'meta';
          var name = document.createElement('div');
          name.className = 'nm';
          name.textContent = session.name;
          var sub = document.createElement('div');
          sub.className = 'sub';
          sub.textContent = [
            (session.savedAt || '').replace('T', ' ').replace('Z', ''),
            (session.sheets || []).map(sheetLabel).join(', '),
            session.stickers + ' stickers',
            session.paths + ' paths',
            Math.max(1, Math.round(session.bytes / 1024)) + ' kB'
          ].filter(Boolean).join(' · ');
          meta.appendChild(name);
          meta.appendChild(sub);

          var load = document.createElement('button');
          load.type = 'button';
          load.className = 'primary';
          load.textContent = 'Load';
          load.addEventListener('click', function () { void openSession(session.id); });

          var remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'del';
          remove.textContent = 'Delete';
          remove.addEventListener('click', function () { void deleteSession(session); });

          row.appendChild(meta);
          row.appendChild(load);
          row.appendChild(remove);
          host.appendChild(row);
        });
      }

      async function refreshSessionPicker() {
        try {
          renderSessionRows(await listSessions());
          setStatus($('sessionPickerStatus'), '');
        } catch (error) {
          setStatus($('sessionPickerStatus'), error.message, 'err');
        }
      }

      async function openSession(id) {
        setStatus($('sessionPickerStatus'), 'Loading…');
        try {
          var response = await fetch('/api/imobyl/sessions/' + encodeURIComponent(id),
            { cache: 'no-store' });
          var data = await response.json();
          if (!response.ok || !data.ok) throw new Error(data.error || 'Could not load.');
          var restored = await applySessionState(data.state || {});
          $('sessionModal').hidden = true;
          var label = 'Loaded "' + (data.state.name || id) + '"';
          if (restored.loaded && !restored.sheetLoaded) {
            // Hand editing works off the saved corners, but scanning a new
            // photo cannot align without the reference sheet.
            setStatus($('sessionStatus'), label +
              ', but the map of ' + sheetLabel(restored.id) + ' is no longer on the server — ' +
              'hand edits work, re-scanning a photo does not.', 'err');
          } else {
            setStatus($('sessionStatus'), label + '.', 'ok');
          }
        } catch (error) {
          setStatus($('sessionPickerStatus'), error.message, 'err');
        }
      }

      async function deleteSession(session) {
        // Deleting a file is not undoable, so it is confirmed by name.
        if (!window.confirm('Delete "' + session.name + '" permanently?')) return;
        try {
          var response = await fetch('/api/imobyl/sessions/' + encodeURIComponent(session.id),
            { method: 'DELETE' });
          var data = await response.json();
          if (!response.ok || !data.ok) throw new Error(data.error || 'Could not delete.');
          await refreshSessionPicker();
          setStatus($('sessionPickerStatus'), 'Deleted "' + session.name + '".', 'ok');
        } catch (error) {
          setStatus($('sessionPickerStatus'), error.message, 'err');
        }
      }

      $('saveSessionBtn').addEventListener('click', async function () {
        var button = $('saveSessionBtn');
        if (!references.length) {
          setStatus($('sessionStatus'), 'Nothing to save yet.', 'err');
          return;
        }
        button.disabled = true;
        setStatus($('sessionStatus'), 'Saving…');
        try {
          var state = collectSessionState();
          var response = await fetch('/api/imobyl/sessions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: state.name, state: state })
          });
          var data = await response.json();
          if (!response.ok || !data.ok) throw new Error(data.error || 'Could not save.');
          $('sessionName').value = data.name;
          setStatus($('sessionStatus'), 'Saved as "' + data.name + '".', 'ok');
        } catch (error) {
          setStatus($('sessionStatus'), error.message || 'Could not save.', 'err');
        } finally {
          button.disabled = false;
        }
      });

      $('loadSessionBtn').addEventListener('click', function () {
        $('sessionModal').hidden = false;
        void refreshSessionPicker();
      });
      $('sessionCloseBtn').addEventListener('click', function () {
        $('sessionModal').hidden = true;
      });
      $('sessionModal').addEventListener('click', function (event) {
        if (event.target === $('sessionModal')) $('sessionModal').hidden = true;
      });

      // Vectorised on the backend (contour trace + Douglas-Peucker), which
      // re-runs detection from the same photo so the polygons always match the
      // mask currently on screen.
      $('exportGeojsonBtn').addEventListener('click', async function () {
        var button = $('exportGeojsonBtn');
        button.disabled = true;
        setStatus($('inkStatus'), 'Vectorising the detected drawing...');
        try {
          var fs = frameSize();
          if (!fs.w || !fs.h || paperCorners.length !== 4) {
            throw new Error('Load a photo and let it align first.');
          }
          camCanvas.width = fs.w;
          camCanvas.height = fs.h;
          camCanvas.getContext('2d').drawImage(camImg, 0, 0, fs.w, fs.h);
          // The photo on screen belongs to activeSheet (or the camera's sheet).
          var exportId = (activeSheet && activeSheet.sheetId)
            || (cameraSheet && cameraSheet.id) || (loadedMap && loadedMap.id) || scanSheetId;
          if (!exportId) throw new Error('Load a photo and let it align first.');
          var response = await fetch('/api/map-sheet-geojson', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              id: exportId,
              image: camCanvas.toDataURL('image/jpeg', 0.94),
              paperCorners: paperCorners,
              threshold: Number(thresholdInput.value),
              stickerColors: selectedStickerColors(),
              kinds: selectedKinds()
            })
          });
          var data = await response.json();
          if (!response.ok || !data.ok) throw new Error(data.error || 'GeoJSON export failed.');

          // Hand edits belong in the file too, or a correction made on screen
          // would silently vanish the moment it was exported.
          data.geojson.features = (data.geojson.features || []).filter(keepExportedFeature);
          var manualFeatures = manualGeoFeatures(
            findReference(data.sheetId) || editTarget()
          ).filter(keepExportedFeature);
          if (manualFeatures.length) {
            data.geojson.features = (data.geojson.features || []).concat(manualFeatures);
            data.geojson.properties = data.geojson.properties || {};
            data.geojson.properties.manualFeatures = manualFeatures.length;
          }
          var count = (data.geojson.features || []).length;
          if (!count) {
            setStatus($('inkStatus'), 'Nothing to export — no drawing was detected.');
            return;
          }
          var blob = new Blob([JSON.stringify(data.geojson)], { type: 'application/geo+json' });
          var url = URL.createObjectURL(blob);
          var link = document.createElement('a');
          link.href = url;
          link.download = 'map-sheet-' + data.sheetId + '-drawing.geojson';
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
          var breakdown = data.counts ? Object.keys(KIND_LABELS).filter(function (kind) {
            return Number(data.counts[kind] || 0) > 0;
          }).map(function (kind) {
            var total = Number(data.counts[kind]);
            return total + ' ' + (total === 1 ? KIND_LABELS[kind].one : KIND_LABELS[kind].many);
          }).join(', ') : '';
          setStatus($('inkStatus'),
            'Exported ' + count + ' feature' + (count === 1 ? '' : 's') +
            (breakdown ? ' — ' + breakdown + '.' : '.'), 'ok');
        } catch (error) {
          setStatus($('inkStatus'), error.message || 'GeoJSON export failed.', 'err');
        } finally {
          refreshExportBtn();
        }
      });

      refreshCamStep();
      refreshExportBtn();
    })();
  </script>
</body>
</html>
